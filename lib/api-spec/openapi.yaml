          required: [explanation, rawFindingsExposed, automaticEmploymentDecision, bGVClearAuthorityChanged]
      required: [caseId, version, config, authority, effectiveFlags, currentCycle, cycles, policy]
    UpdateOnboardingBgvNotificationsRequest:
