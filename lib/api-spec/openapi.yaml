        message: { type: string }
      required: [code, message]
    AgentInvocationAuditList:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AgentInvocationAuditEntry" }
        nextBeforeId: { type: [integer, "null"] }
      required: [entries, nextBeforeId]
    AgentInvocationAuditEntry:
      type: object
      properties:
        id: { type: integer }
        agentId: { type: [string, "null"] }
        agentVersion: { type: [integer, "null"] }
        initiatingUserId: { type: string }
        runId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        delegatedScope: { type: array, items: { type: string } }
        caseId: { type: [integer, "null"] }
        purpose: { type: string }
        toolKey: { type: string }
        action: { type: string }
        outcome: { type: string, enum: [success, denied, failure] }
        reasonCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, agentId, agentVersion, initiatingUserId, runId, correlationId, delegatedScope, caseId, purpose, toolKey, action, outcome, reasonCode, createdAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SourceRef:
      type: object
      description: Attribution of a data point to its origin corpus
      properties:
        name:
          type: string
          description: e.g. "SAP SuccessFactors service catalog (curated)", "Kaggle HR analytics", "GitHub HR intents corpus"
        note:
          type: string
        confidence:
          type: string
          description: measured | high | medium | low (documented-assumption). "measured" is the strongest tier, meaning the value came from observed production data.
      required: [name, confidence]
    IntentCorpus:
      type: object
      required: [intents, customIntentsAvailable]
      properties:
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        customIntentsAvailable:
          type: boolean
          description: False when custom-intent storage could not be read and only the bundled reference corpus is returned.
        warning:
          type: string
          description: User-safe explanation when the corpus is operating in a degraded state.
    Intent:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
        domain:
          type: string
          description: hire | pay | leave | benefits | time | mobility | develop | retire | data-admin | policy
        flowClass:
          type: string
          description: fc1-deterministic | fc2-policy | fc3-multiagent | fc4-frontier
        description:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        asIsHandlingMin:
          type: number
          description: Average human handling minutes per transaction today (as-is)
        toBeHumanMin:
          type: number
          description: Residual human minutes per transaction in the to-be flow (HITL share included)
        baseWeight:
          type: number
          description: Relative frequency weight in a neutral organization (used by the distribution model)
        actGetActions:
          type: integer
          description: Number of GET system actions in the act phase of this intent (per touched system)
        actPutActions:
          type: integer
          description: Number of PUT/write system actions in the act phase (approval-gated)
        systemsTouchedBase:
          type: integer
          description: Minimum count of systems of record this intent touches regardless of landscape size
        tags:
          type: array
          items:
            type: string
        isCustom:
          type: boolean
          description: True when this intent was added by a client; false for the fixed reference corpus
      required:
        - id
        - key
        - name
        - domain
        - flowClass
        - description
        - source
        - asIsHandlingMin
        - toBeHumanMin
        - baseWeight
        - actGetActions
        - actPutActions
        - systemsTouchedBase
        - tags
    StepSystemTouch:
      type: object
      properties:
        systemKey:
          type: string
        actions:
          type: array
          items:
            type: string
          description: get | put
        scalesWithLandscape:
          type: boolean
          description: When true, this touch repeats across additional client systems
      required: [systemKey, actions, scalesWithLandscape]
    CostComponent:
      type: object
      properties:
        type:
          type: string
          description: ai-consumption | infra | human | build | other
        label:
          type: string
        unitCostUsd:
          type: number
          description: Cost per transaction attributable to this component at this step
        assumption:
          type: string
          description: Human-readable assumption behind the number
        source:
          $ref: "#/components/schemas/SourceRef"
      required: [type, label, unitCostUsd, assumption, source]
    BenefitComponent:
      type: object
      properties:
        type:
          type: string
          description: human-effort | cycle-time | error-reduction | experience | compliance
        label:
          type: string
        dollarized:
          type: boolean
        unitBenefitUsd:
          type: number
          description: Dollar benefit per transaction (0 when not dollarized)
        qualitative:
          type: string
          description: Description of the non-dollar benefit
        assumption:
          type: string
      required: [type, label, dollarized, unitBenefitUsd, qualitative, assumption]
    FlowStep:
      type: object
      properties:
        id:
          type: string
        stage:
          type: string
          description: intake | intent | orchestration | knowledge | communication | act | close
        label:
          type: string
        componentRefs:
          type: array
          items:
            type: string
          description: Architecture components touched, using the deck's circled numbers 1-7
        agents:
          type: array
          items:
            type: string
        human:
          type: boolean
          description: Human-in-the-loop step
        systems:
          type: array
          items:
            $ref: "#/components/schemas/StepSystemTouch"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/CostComponent"
        benefits:
          type: array
          items:
            $ref: "#/components/schemas/BenefitComponent"
      required: [id, stage, label, componentRefs, agents, human, systems, costs, benefits]
    FlowClass:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        slideRef:
          type: string
          description: Which deck slide this flow mirrors
        description:
          type: string
        buildCostUsd:
          type: number
          description: One-time build cost for agents/flows of this class
        buildAssumption:
          type: string
        amortizationTransactions:
          type: number
          description: Transactions over which build cost is amortized by default
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FlowStep"
      required: [key, name, slideRef, description, buildCostUsd, buildAssumption, amortizationTransactions, steps]
    McpIntegration:
      type: object
      description: How a landscape system is exposed to agents through the MCP server
      properties:
        method:
          type: string
          description: rest-odata | rag-index | doc-pipeline | event-webhook | scim-oidc | sftp-file | semantic-layer
        label:
          type: string
        note:
          type: string
      required: [method, label, note]
    SystemInfo:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        category:
          type: string
          description: hcm | payroll | benefits | ticketing | knowledge | identity | other
        description:
          type: string
        integration:
          $ref: "#/components/schemas/McpIntegration"
      required: [key, name, category, description, integration]
    DistributionProfile:
      type: object
      properties:
        sector:
          type: string
        description:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        domainWeights:
          type: object
          additionalProperties:
            type: number
          description: Multiplier per lifecycle domain applied to intent base weights
        sizeAdjustments:
          type: object
          additionalProperties:
            type: number
          description: Multiplier per size band (small|mid|large|enterprise) applied to per-employee volume
      required: [sector, description, source, domainWeights, sizeAdjustments]
    GlobalAssumption:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        provisioning:
          type: string
          enum: [core, configurable, custom]
          description: "Product demarcation: core = product fact identical for every client; configurable = client-set dial (no code change); custom = per-client engineering/content effort."
        value:
          type: number
          description: The canonical estimated/modelled value from the assumptions register.
        measuredValue:
          type: number
          description: The value observed in production actuals. Present only when this assumption was replaced by a calibration overlay. The rollup applied measuredValue; value is retained as the pre-calibration estimate for variance display.
        unit:
          type: string
        rationale:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
      required: [key, label, provisioning, value, unit, rationale, source]
    CorpusSummary:
      type: object
      properties:
        intentCount:
          type: integer
        systemCount:
          type: integer
        profileCount:
          type: integer
        byDomain:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byFlowClass:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        bySource:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        customIntentsAvailable:
          type: boolean
          description: False when custom-intent storage could not be read and all intent totals and buckets contain bundled reference intents only.
        warning:
          type: string
          description: User-safe explanation when custom-intent totals are unavailable.
      required: [intentCount, systemCount, profileCount, byDomain, byFlowClass, bySource, customIntentsAvailable]
    RoutingSummary:
      type: object
      properties:
        registryVersion:
          type: string
        reference:
          type: integer
        activeCustom:
          type: integer
        retiredCustom:
          type: integer
        staleCustom:
          type: integer
        groupingParents:
          type: integer
        candidateGaps:
          type: integer
        routable:
          type: integer
        costModelIntentCount:
          type: integer
        reconciled:
          type: boolean
      required: [registryVersion, reference, activeCustom, retiredCustom, staleCustom, groupingParents, candidateGaps, routable, costModelIntentCount, reconciled]
    RegisteredAction:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
        executorKey:
          type: string
          nullable: true
      required: [type, name, description, inputSchema, executorKey]
    IntentActionSchema:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RegisteredAction"
      required: [actions]
    IntentEvidenceContract:
      type: object
      properties:
        completionEvidence:
          type: string
        required:
          type: array
          items:
            type: string
      required: [completionEvidence, required]
    IntentRoute:
      type: object
      properties:
        registryVersion:
          type: string
        key:
          type: string
        canonicalOutcome:
          type: string
        parentIntentKey:
          type: string
          nullable: true
        exactAliases:
          type: array
          items:
            type: string
        accountableSpecialist:
          type: string
        riskClass:
          type: string
          enum: [low, medium, high, consequential]
        actionSchema:
          $ref: "#/components/schemas/IntentActionSchema"
        evidenceContract:
          $ref: "#/components/schemas/IntentEvidenceContract"
        maturity:
          type: string
          enum: [catalogued, simulated, integrated, verified, unsupported]
        source:
          type: string
          enum: [reference, custom]
        status:
          type: string
          enum: [active, retired]
        routable:
          type: boolean
      required: [registryVersion, key, canonicalOutcome, parentIntentKey, exactAliases, accountableSpecialist, riskClass, actionSchema, evidenceContract, maturity, source, status, routable]
    IntentExecutorRegistration:
      type: object
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [workflow, typed-tool]
        owner:
          type: string
        maximumMaturity:
          type: string
          enum: [simulated, integrated, verified]
      required: [key, kind, owner, maximumMaturity]
    IntentRegistryCounts:
      type: object
      properties:
        reference:
          type: integer
        activeCustom:
          type: integer
        retiredCustom:
          type: integer
        staleCustom:
          type: integer
        groupingParents:
          type: integer
        candidateGaps:
          type: integer
        routable:
          type: integer
      required: [reference, activeCustom, retiredCustom, staleCustom, groupingParents, candidateGaps, routable]
    IntentRegistry:
      type: object
      properties:
        version:
          type: string
        counts:
          $ref: "#/components/schemas/IntentRegistryCounts"
        executors:
          type: array
          items:
            $ref: "#/components/schemas/IntentExecutorRegistration"
        reference:
          type: array
          items:
            $ref: "#/components/schemas/IntentRoute"
        custom:
          type: array
          items:
            $ref: "#/components/schemas/IntentRoute"
        groupingParents:
          type: array
          items:
            type: object
            additionalProperties: true
        candidateGaps:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [version, counts, executors, reference, custom, groupingParents, candidateGaps]
    ResolveIntentRouteInput:
      type: object
      properties:
        key:
          type: string
        registryVersion:
          type: string
      required: [key]
    ResolvedIntentRoute:
      type: object
      properties:
        version:
          type: string
        route:
          $ref: "#/components/schemas/IntentRoute"
      required: [version, route]
    IntentRouteRepair:
      type: object
      properties:
        required:
          type: boolean
        suppliedKey:
          type: string
        registryVersion:
          type: string
      required: [required, suppliedKey, registryVersion]
    IntentRouteError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [UNKNOWN_OUTCOME, RETIRED_OUTCOME, AMBIGUOUS_ALIAS, UNSUPPORTED_OUTCOME, REGISTRY_VERSION_MISMATCH]
        repair:
          $ref: "#/components/schemas/IntentRouteRepair"
      required: [error, code, repair]
    CountBucket:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
      required: [key, count]
    CommercialAssumptions:
      type: object
      description: >-
        Commercial planning inputs applied after the operational cost-benefit
        calculation. These do not alter client benefit or automation economics.
      properties:
        targetGrossMargin:
          type: number
          description: Target pricing margin as a fraction (default 0.60).
        targetClients:
          type: integer
          description: Expected clients sharing product investment and support capacity (default 10).
        productRecoveryMonths:
          type: integer
          description: Planned period for recovering the reusable product build investment (default 36 months).
        supportTeamFte:
          type: number
          description: Shared support and maintenance team capacity in FTE (default 1).
        supportHourlyCostUsd:
          type: number
          description: Loaded hourly cost of support and maintenance capacity (default 60 USD).
        supportToolingAnnualUsdPerClient:
          type: number
          description: Annual per-client support tooling, monitoring and service-management cost (default 5000 USD).
        actualsOverlayId:
          type: integer
          description: Optional saved calibration overlay used for measured token and operating-cost repricing.
    ScenarioInputs:
      type: object
      properties:
        numSystems:
          type: integer
          description: Number of HR systems of record in the client landscape (drives Act fan-out)
        annualTransactions:
          type: number
          description: Committed HR transactions per year
        employees:
          type: integer
        sector:
          type: string
        companyType:
          type: string
          description: single-country | multi-country | global
        isolationTier:
          type: string
          description: pooled | siloed | dedicated
        hrHourlyCostUsd:
          type: number
          description: Loaded hourly cost of client HR staff (as-is baseline)
        hitlHourlyCostUsd:
          type: number
          description: Loaded hourly cost of HITL reviewers in the to-be model
        countries:
          type: integer
        commercialAssumptions:
          $ref: "#/components/schemas/CommercialAssumptions"
        intentShareOverrides:
          type: object
          additionalProperties:
            type: number
          description: Optional manual overrides of intent shares (intent key to share fraction)
        assumptionOverrides:
          type: object
          additionalProperties:
            type: number
            minimum: 0
          description: >
            Per-scenario overrides for global assumption values. Keys must match
            a GlobalAssumption key from the overridable set: slm-call-cost,
            llm-call-cost, frontier-call-cost, mcp-action-cost, infra-per-txn,
            landscape-fanout, country-localization, tier-pooled, tier-siloed,
            tier-dedicated, company-multi-country, company-global.
            Absent keys use the global defaults. Values must be non-negative finite numbers.
        adoptionRate:
          type: number
          description: Share of committed volume arriving through the agentic channel (0-1, default 1). Non-adopted volume incurs no platform cost and yields no benefit.
        containmentOverrides:
          type: object
          additionalProperties:
            type: number
          description: Optional per-flow-class containment overrides (flow-class key to 0-1 fraction). Defaults come from the containment-* assumptions. Uncontained transactions still incur AI/infra cost but fall back to full as-is human handling and yield no benefit.
        hitlSamplingRate:
          type: number
          description: Fraction of default residual HITL minutes actually spent on contained transactions (0-1, default 1). Models review sampling as trust matures.
        landscapeMaturity:
          type: string
          description: clean | mixed | legacy (default mixed). Multiplies build cost and Act landscape fan-out.
        contractYears:
          type: integer
          description: Contract length in years used to amortize client onboarding cost (default 3)
        reworkRatePct:
          type: number
          description: Client's as-is share of transactions requiring rework, in percent (0-20, default 0). Drives a client-specific error-reduction benefit.
        peakLoadFactor:
          type: number
          description: Seasonality premium on avoided human effort (1-1.5, default 1). Reflects that automated capacity at peak avoids overstaffing.
        containmentRates:
          type: object
          additionalProperties:
            type: number
          description: >
            Per-flow-class fraction of transactions that complete in the automated flow (0–1).
            Non-contained (failed) transactions fall back to full as-is human cost; AI/infra costs are still charged on the full adopted volume because the attempt ran before the failure was detected.
            Defaults: fc1-deterministic=0.95, fc2-policy=0.88, fc3-multiagent=0.80, fc4-frontier=0.70.
        adoptionRamp:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: >
            Three-element array [y1, y2, y3] where each element is the fraction of annualTransactions
            routed to the automated channel in that year (0–1, non-decreasing).
            Non-adopted volume stays at as-is cost and generates no benefit.
            Default: [0.40, 0.75, 1.00].
        hitlSamplingRates:
          type: object
          additionalProperties:
            type: number
          description: >
            Per-flow-class fraction of automated (contained) transactions that also receive human review.
            Multiplies toBeHumanMin to give effective residual human minutes per automated transaction.
            Defaults: fc1-deterministic=0.05, fc2-policy=0.15, fc3-multiagent=0.30, fc4-frontier=0.60.
        modelSelection:
          type: object
          additionalProperties:
            type: string
          description: Chosen AI model per role (router | reasoning | frontier | data), keys from /model-catalog. Defaults match the registered *-call-cost assumptions.
        nonIntegratedSystems:
          type: array
          items:
            type: string
          description: System keys (see /systems) that will NOT be integrated with the MCP layer. Their get/put actions lose MCP cost but stay manual, adding handling minutes per action and reducing the benefit for intents touching them.
        intentContainmentOverrides:
          type: object
          additionalProperties:
            type: number
          description: >
            Per-intent containment targets used for drift comparison only (intentKey → 0-1 fraction).
            When set for an intent, overrides the flow-class-level containment estimate shown as the
            reference line in the Drift tab. Does not affect the rollup/cost engine.
            Absent keys fall back to the flow-class expansion from containmentRates/containmentOverrides.
      required:
        - numSystems
        - annualTransactions
        - employees
        - sector
        - companyType
        - isolationTier
        - hrHourlyCostUsd
        - hitlHourlyCostUsd
        - countries
