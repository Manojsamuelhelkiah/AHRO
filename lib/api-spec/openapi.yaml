openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: corpus
    description: HRO intent corpus and reference data
  - name: scenarios
    description: Client scenarios and cost-benefit roll-ups
  - name: actuals
    description: Calibration actuals overlays (measured production data)
  - name: customIntents
    description: Client-specific intents that extend the reference corpus
  - name: onboarding
    description: Orchestrated multi-agent onboarding POC (cases, agents, approvals, channels, connectors, analytics)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /intents:
    get:
      operationId: listIntents
      tags: [corpus]
      summary: List all HRO intents in the corpus
      responses:
        "200":
          description: Intent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Intent"
  /flow-classes:
    get:
      operationId: listFlowClasses
      tags: [corpus]
      summary: List flow-class templates with their steps, costs and benefits
      responses:
        "200":
          description: Flow class list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowClass"
  /systems:
    get:
      operationId: listSystems
      tags: [corpus]
      summary: List modeled HR systems of record
      responses:
        "200":
          description: System list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemInfo"
  /profiles:
    get:
      operationId: listDistributionProfiles
      tags: [corpus]
      summary: List sector/size distribution profiles used to allocate transactions across intents
      responses:
        "200":
          description: Profile list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionProfile"
  /assumptions:
    get:
      operationId: listAssumptions
      tags: [corpus]
      summary: List global default assumptions (rates, token prices, infra allocations)
      responses:
        "200":
          description: Assumption list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlobalAssumption"
  /summary:
    get:
      operationId: getCorpusSummary
      tags: [corpus]
      summary: Corpus dashboard summary (counts by domain, flow class, sources)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusSummary"
  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List saved client scenarios
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a client scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /model-catalog:
    get:
      operationId: listModelCatalog
      tags: [corpus]
      summary: List selectable AI models per role with per-call prices
      responses:
        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelOption"
  /flow-overrides:
    get:
      operationId: listFlowOverrides
      tags: [flowOverrides]
      summary: List all SME flow override versions (newest first)
      responses:
        "200":
          description: All override versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowOverride"
    post:
      operationId: createFlowOverride
      tags: [flowOverrides]
      summary: Propose a new flow override version for an intent (created as draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowOverrideInput"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowOverride"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /flow-overrides/{id}/revoke:
    post:
      operationId: revokeFlowOverride
      tags: [flowOverrides]
      summary: Revoke an approved override version; the intent reverts to the reference flow (history is kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowOverride"
        "400":
          description: Not in a revocable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /flow-overrides/{id}/approve:
    post:
      operationId: approveFlowOverride
      tags: [flowOverrides]
      summary: Approve a draft version; it becomes the single active adjustment for its intent and supersedes prior approvals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowOverride"
        "400":
          description: Not a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /flow-overrides/{id}:
    delete:
      operationId: deleteFlowOverride
      tags: [flowOverrides]
      summary: Delete an override version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /custom-intents:
    get:
      operationId: listCustomIntents
      tags: [customIntents]
      summary: List custom (client-specific) intents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            description: "active (default) | all"
      responses:
        "200":
          description: Custom intent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomIntent"
    post:
      operationId: createCustomIntent
      tags: [customIntents]
      summary: Create a new custom intent (key is auto-generated from name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomIntentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomIntent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /custom-intents/{key}:
    get:
      operationId: getCustomIntent
      tags: [customIntents]
      summary: Get a single custom intent by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Custom intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomIntent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateCustomIntent
      tags: [customIntents]
      summary: Update a custom intent (last-writer-wins)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomIntentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomIntent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteCustomIntent
      tags: [customIntents]
      summary: Hard-delete a custom intent (blocked if SME flow-override history exists; use /retire instead)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Has flow-override history — use retire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /custom-intents/{key}/retire:
    post:
      operationId: retireCustomIntent
      tags: [customIntents]
      summary: Retire a custom intent — removes it from roll-ups but preserves flow-override history
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retired custom intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomIntent"
        "400":
          description: Already retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /sensitivity:
    post:
      operationId: computeSensitivity
      tags: [scenarios]
      summary: One-at-a-time sensitivity analysis of the business case
      description: >
        Nudges each driver (overridable assumptions, labor rates, per-flow-class containment,
        adoption ramp) ±20% while holding everything else constant, re-runs the exact pricing
        engine, and returns rows sorted by how far each nudge swings the net benefit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitivityRequest"
      responses:
        "200":
          description: Sensitivity analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityResult"
        "400":
          description: Invalid inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /workbook/export:
    get:
      operationId: exportScenarioWorkbookLink
      tags: [workbook]
      summary: Direct-navigation workbook download (mobile-friendly)
      description: >
        Same as POST /workbook/export but takes the request body as a base64url-encoded
        JSON query parameter, so browsers (especially mobile) can download via plain navigation.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: base64url-encoded JSON of {"inputs":ScenarioInputs}.
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: exportScenarioWorkbook
      tags: [workbook]
      summary: Generate the Excel shadow-model workbook prefilled from scenario inputs
      description: >
        Returns an .xlsx workbook with live formulas approximating the pricing engine plus structured
        input sheets (Inputs, Flow Classes, Assumptions, Model Stack, Systems) that can be edited
        offline and re-imported via POST /workbook/import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollupRequest"
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /workbook/import:
    post:
      operationId: importScenarioWorkbook
      tags: [workbook]
      summary: Parse a filled-in shadow workbook back into scenario inputs
      description: >
        Reads ONLY the inputs from an uploaded shadow workbook (never Excel's computed numbers),
        validates them, and returns ScenarioInputs ready to load into the Scenario Builder where the
        exact engine reprices them. Maximum file size 10 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                workbookFile:
                  type: string
                  format: binary
                  description: Filled-in shadow workbook (.xlsx, max 10 MB).
              required:
                - workbookFile
      responses:
        "200":
          description: Parsed scenario inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportWorkbookResult"
        "400":
          description: Invalid or unrecognized workbook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /rollup:
    post:
      operationId: computeRollup
      tags: [scenarios]
      summary: Compute a cost-benefit roll-up for a set of scenario inputs (without saving)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollupRequest"
      responses:
        "200":
          description: Roll-up result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rollup"
        "400":
          description: Invalid inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /actuals:
    get:
      operationId: listActualsOverlays
      tags: [actuals]
      summary: List all saved calibration actuals overlays
      responses:
        "200":
          description: Overlay list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActualsOverlayRecord"
    post:
      operationId: createActualsOverlay
      tags: [actuals]
      summary: Save a new calibration actuals overlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualsOverlayInput"
      responses:
        "201":
          description: Created overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualsOverlayRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /actuals/validate:
    post:
      operationId: validateActualsOverlay
      tags: [actuals]
      summary: Validate an actuals overlay payload without persisting it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualsOverlayInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualsValidationResult"
  /actuals/parse-log:
    post:
      operationId: parseActualsLog
      tags: [actuals]
      summary: Parse a raw call-log CSV and aggregate it into a proposed actuals overlay
      description: >
        Accepts a multipart/form-data upload of a raw call-log CSV (one row per call/transaction).
        Returns a proposed ActualsOverlayInput ready to review, adjust, and save via POST /actuals,
        plus parse diagnostics (unknown intents, duplicate call IDs, thin-sample warnings).
        Maximum file size 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logFile:
                  type: string
                  format: binary
                  description: Raw call-log CSV file (max 20 MB).
              required:
                - logFile
      responses:
        "200":
          description: Parse result with proposed overlay and diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualsLogParseResult"
        "400":
          description: Malformed upload or CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /actuals/{id}:
    get:
      operationId: getActualsOverlay
      tags: [actuals]
      summary: Get a saved actuals overlay by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualsOverlayRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteActualsOverlay
      tags: [actuals]
      summary: Delete a saved actuals overlay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/dashboard:
    get:
      operationId: getOnboardingDashboard
      tags: [onboarding]
      summary: Control-tower dashboard summary (case counts by stage, pending approvals, blockers)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbDashboard"
  /onboarding/scenarios:
    get:
      operationId: listOnboardingScenarios
      tags: [onboarding]
      summary: List the demo scenarios (worked examples from the SME spec)
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbScenarioDef"
  /onboarding/scenarios/{key}/run:
    post:
      operationId: runOnboardingScenario
      tags: [onboarding]
      summary: Launch a demo scenario — creates the case and starts orchestration asynchronously
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created case (orchestration runs in the background; poll the case and its events)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbCase"
        "404":
          description: Unknown scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/cases:
    get:
      operationId: listOnboardingCases
      tags: [onboarding]
      summary: List onboarding cases (newest first)
      responses:
        "200":
          description: Case list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbCase"
    post:
      operationId: createOnboardingCase
      tags: [onboarding]
      summary: Create an onboarding case from a manual trigger (intake form) and start orchestration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbCaseIntake"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbCase"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Duplicate active case detected for this person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/cases/{id}:
    get:
      operationId: getOnboardingCase
      tags: [onboarding]
      summary: Get a case with workstreams, readiness checklist and blockers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbCase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/cases/{id}/events:
    get:
      operationId: listOnboardingCaseEvents
      tags: [onboarding]
      summary: Audit trail / live agent activity feed for a case (oldest first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/cases/{id}/communications:
    get:
      operationId: listOnboardingCaseCommunications
      tags: [onboarding]
      summary: Email/WhatsApp timeline for a case (oldest first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Communication list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbCommunication"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/cases/{id}/documents:
    get:
      operationId: listOnboardingCaseDocuments
      tags: [onboarding]
      summary: Document checklist (documentation pack) for a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbDocument"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/cases/{id}/records:
    get:
      operationId: listOnboardingCaseRecords
      tags: [onboarding]
      summary: Archived past-employment stints matched by the case's worker email (rehire evidence)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived stints, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbEmployeeRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo/volunteers:
    get:
      operationId: getDemoVolunteers
      tags: [onboarding]
      summary: Admin list of demo volunteers (real contacts used for live demos)
      responses:
        "200":
          description: Volunteer list plus available demo personas
          content:
            application/json:
              schema:
                type: object
                properties:
                  volunteers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DemoVolunteer"
                  personas:
                    type: array
                    items:
                      $ref: "#/components/schemas/DemoPersona"
                required: [volunteers, personas]
    put:
      operationId: updateDemoVolunteers
      tags: [onboarding]
      summary: Replace the demo volunteer list and refresh the live-delivery allowlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoVolunteerList"
      responses:
        "200":
          description: Saved list (normalized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoVolunteerList"
  /onboarding/demo/volunteers/seed:
    post:
      operationId: seedDemoVolunteers
      tags: [onboarding]
      summary: Create a full onboarding case for each valid volunteer (skips existing)
      responses:
        "200":
          description: Per-volunteer outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                          enum: [seeded, skipped, invalid]
                        note:
                          type: string
                        caseId:
                          type: ["integer", "null"]
                      required: [name, status, note, caseId]
                required: [results]
  /onboarding/guardrails:
    get:
      operationId: getOnboardingGuardrails
      tags: [onboarding]
      summary: Guardrails catalog with live activation counts
      responses:
        "200":
          description: Categories and guardrails
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/GuardrailCategory"
                  guardrails:
                    type: array
                    items:
                      $ref: "#/components/schemas/Guardrail"
                required: [categories, guardrails]
  /onboarding/guardrails/{key}/events:
    get:
      operationId: listGuardrailEvents
      tags: [onboarding]
      summary: Recent activations of one guardrail (most recent first, max 50)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activation events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuardrailEvent"
        "404":
          description: Unknown guardrail
  /onboarding/guardrails/drill:
    post:
      operationId: runOnboardingSecurityDrill
      tags: [onboarding]
      summary: Run the red-team security drill against the live enforcement code
      responses:
        "201":
          description: Drill outcome per simulated attack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityDrillResult"
  /onboarding/cases/{id}/voice-call:
    post:
      operationId: startOnboardingVoiceCall
      tags: [onboarding]
      summary: Place (or simulate) an outbound AI voice call for a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  enum: [day-before, sla-escalation]
                simulate:
                  type: boolean
                  description: Run the identical conversation engine over a scripted hire instead of dialing
              required: [scenario]
      responses:
        "200":
          description: Call outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: calling | simulated | logged-only | failed
                  note:
                    type: string
                required: [status, note]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/cases/{id}/inbound:
    post:
      operationId: receiveOnboardingInbound
      tags: [onboarding]
      summary: Record an inbound message from the new hire (WhatsApp/email reply) and let the agents react
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbInboundMessage"
      responses:
        "201":
          description: Recorded inbound communication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbCommunication"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/approvals:
    get:
      operationId: listOnboardingApprovals
      tags: [onboarding]
      summary: Human-in-the-loop approval queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            description: pending (default) | all
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbApproval"
  /onboarding/approvals/{id}/decide:
    post:
      operationId: decideOnboardingApproval
      tags: [onboarding]
      summary: Approve or reject a pending agent recommendation; orchestration resumes accordingly
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbApprovalDecision"
      responses:
        "200":
          description: Decided approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbApproval"
        "400":
          description: Not pending or invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/connectors:
    get:
      operationId: listOnboardingConnectors
      tags: [onboarding]
      summary: Connected HR systems panel (pluggable adapter per system role)
      responses:
        "200":
          description: Connector list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnbConnector"
  /onboarding/connectors/{key}:
    patch:
      operationId: updateOnboardingConnector
      tags: [onboarding]
      summary: Swap the vendor behind a system role or toggle connection (demonstrates any-HR-system pluggability)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbConnectorUpdate"
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbConnector"
        "400":
          description: Unknown vendor for this system role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/analytics:
    get:
      operationId: getOnboardingAnalytics
      tags: [onboarding]
      summary: Data & Analytics Agent aggregated insights (skill inflow, bottlenecks, cohort readiness) with small-population suppression
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbAnalytics"
  /onboarding/systems/watcher:
    get:
      operationId: getOnboardingSystemWatcher
      tags: [onboarding]
      summary: System Watcher agent status — per-connector polling/webhook health and tracked external-system checks
      responses:
        "200":
          description: Watcher status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbSystemWatcher"
  /onboarding/systems/email-watch:
    get:
      operationId: getOnboardingEmailWatch
      tags: [onboarding]
      summary: Watch-mailbox tracker status — mailbox address, monitor health and recent matched vendor status emails
      responses:
        "200":
          description: Email watch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbEmailWatch"
  /onboarding/systems/email-watch/simulate:
    post:
      operationId: simulateOnboardingWatchEmail
      tags: [onboarding]
      summary: Demo helper — inject a synthetic vendor status email through the same parse-and-apply path as a real watched email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbWatchEmailSimulate"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbWatchEmailSimulateResult"
        "404":
          description: No tracked check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbWatchEmailSimulateResult"
  /onboarding/channels:
    get:
      operationId: getOnboardingChannels
      tags: [onboarding]
      summary: Communication channel configuration status (email, WhatsApp)
      responses:
        "200":
          description: Channel status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbChannelStatus"
  /onboarding/channels/test:
    post:
      operationId: testOnboardingChannel
      tags: [onboarding]
      summary: Send a test message on a channel to verify configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbChannelTest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbChannelTestResult"
  /onboarding/settings:
    get:
      operationId: getOnboardingSettings
      tags: [onboarding]
      summary: App settings (HR alert email address and its effective resolution)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbSettings"
    put:
      operationId: updateOnboardingSettings
      tags: [onboarding]
      summary: Update app settings (set or clear the HR alert email address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOnbSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbSettings"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SourceRef:
      type: object
      description: Attribution of a data point to its origin corpus
      properties:
        name:
          type: string
          description: e.g. "SAP SuccessFactors service catalog (curated)", "Kaggle HR analytics", "GitHub HR intents corpus"
        note:
          type: string
        confidence:
          type: string
          description: measured | high | medium | low (documented-assumption). "measured" is the strongest tier, meaning the value came from observed production data.
      required: [name, confidence]
    Intent:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
        domain:
          type: string
          description: hire | pay | leave | benefits | time | mobility | develop | retire | data-admin | policy
        flowClass:
          type: string
          description: fc1-deterministic | fc2-policy | fc3-multiagent | fc4-frontier
        description:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        asIsHandlingMin:
          type: number
          description: Average human handling minutes per transaction today (as-is)
        toBeHumanMin:
          type: number
          description: Residual human minutes per transaction in the to-be flow (HITL share included)
        baseWeight:
          type: number
          description: Relative frequency weight in a neutral organization (used by the distribution model)
        actGetActions:
          type: integer
          description: Number of GET system actions in the act phase of this intent (per touched system)
        actPutActions:
          type: integer
          description: Number of PUT/write system actions in the act phase (approval-gated)
        systemsTouchedBase:
          type: integer
          description: Minimum count of systems of record this intent touches regardless of landscape size
        tags:
          type: array
          items:
            type: string
        isCustom:
          type: boolean
          description: True when this intent was added by a client; false for the fixed reference corpus
      required:
        - id
        - key
        - name
        - domain
        - flowClass
        - description
        - source
        - asIsHandlingMin
        - toBeHumanMin
        - baseWeight
        - actGetActions
        - actPutActions
        - systemsTouchedBase
        - tags
    StepSystemTouch:
      type: object
      properties:
        systemKey:
          type: string
        actions:
          type: array
          items:
            type: string
          description: get | put
        scalesWithLandscape:
          type: boolean
          description: When true, this touch repeats across additional client systems
      required: [systemKey, actions, scalesWithLandscape]
    CostComponent:
      type: object
      properties:
        type:
          type: string
          description: ai-consumption | infra | human | build | other
        label:
          type: string
        unitCostUsd:
          type: number
          description: Cost per transaction attributable to this component at this step
        assumption:
          type: string
          description: Human-readable assumption behind the number
        source:
          $ref: "#/components/schemas/SourceRef"
      required: [type, label, unitCostUsd, assumption, source]
    BenefitComponent:
      type: object
      properties:
        type:
          type: string
          description: human-effort | cycle-time | error-reduction | experience | compliance
        label:
          type: string
        dollarized:
          type: boolean
        unitBenefitUsd:
          type: number
          description: Dollar benefit per transaction (0 when not dollarized)
        qualitative:
          type: string
          description: Description of the non-dollar benefit
        assumption:
          type: string
      required: [type, label, dollarized, unitBenefitUsd, qualitative, assumption]
    FlowStep:
      type: object
      properties:
        id:
          type: string
        stage:
          type: string
          description: intake | intent | orchestration | knowledge | communication | act | close
        label:
          type: string
        componentRefs:
          type: array
          items:
            type: string
          description: Architecture components touched, using the deck's circled numbers 1-7
        agents:
          type: array
          items:
            type: string
        human:
          type: boolean
          description: Human-in-the-loop step
        systems:
          type: array
          items:
            $ref: "#/components/schemas/StepSystemTouch"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/CostComponent"
        benefits:
          type: array
          items:
            $ref: "#/components/schemas/BenefitComponent"
      required: [id, stage, label, componentRefs, agents, human, systems, costs, benefits]
    FlowClass:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        slideRef:
          type: string
          description: Which deck slide this flow mirrors
        description:
          type: string
        buildCostUsd:
          type: number
          description: One-time build cost for agents/flows of this class
        buildAssumption:
          type: string
        amortizationTransactions:
          type: number
          description: Transactions over which build cost is amortized by default
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FlowStep"
      required: [key, name, slideRef, description, buildCostUsd, buildAssumption, amortizationTransactions, steps]
    McpIntegration:
      type: object
      description: How a landscape system is exposed to agents through the MCP server
      properties:
        method:
          type: string
          description: rest-odata | rag-index | doc-pipeline | event-webhook | scim-oidc | sftp-file | semantic-layer
        label:
          type: string
        note:
          type: string
      required: [method, label, note]
    SystemInfo:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        category:
          type: string
          description: hcm | payroll | benefits | ticketing | knowledge | identity | other
        description:
          type: string
        integration:
          $ref: "#/components/schemas/McpIntegration"
      required: [key, name, category, description, integration]
    DistributionProfile:
      type: object
      properties:
        sector:
          type: string
        description:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        domainWeights:
          type: object
          additionalProperties:
            type: number
          description: Multiplier per lifecycle domain applied to intent base weights
        sizeAdjustments:
          type: object
          additionalProperties:
            type: number
          description: Multiplier per size band (small|mid|large|enterprise) applied to per-employee volume
      required: [sector, description, source, domainWeights, sizeAdjustments]
    GlobalAssumption:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        provisioning:
          type: string
          enum: [core, configurable, custom]
          description: "Product demarcation: core = product fact identical for every client; configurable = client-set dial (no code change); custom = per-client engineering/content effort."
        value:
          type: number
          description: The canonical estimated/modelled value from the assumptions register.
        measuredValue:
          type: number
          description: The value observed in production actuals. Present only when this assumption was replaced by a calibration overlay. The rollup applied measuredValue; value is retained as the pre-calibration estimate for variance display.
        unit:
          type: string
        rationale:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
      required: [key, label, provisioning, value, unit, rationale, source]
    CorpusSummary:
      type: object
      properties:
        intentCount:
          type: integer
        systemCount:
          type: integer
        profileCount:
          type: integer
        byDomain:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byFlowClass:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        bySource:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
      required: [intentCount, systemCount, profileCount, byDomain, byFlowClass, bySource]
    CountBucket:
      type: object
      properties:
        key:
          type: string
        count:
          type: integer
      required: [key, count]
    CommercialAssumptions:
      type: object
      description: >-
        Commercial planning inputs applied after the operational cost-benefit
        calculation. These do not alter client benefit or automation economics.
      properties:
        targetGrossMargin:
          type: number
          description: Target pricing margin as a fraction (default 0.60).
        targetClients:
          type: integer
          description: Expected clients sharing product investment and support capacity (default 10).
        productRecoveryMonths:
          type: integer
          description: Planned period for recovering the reusable product build investment (default 36 months).
        supportTeamFte:
          type: number
          description: Shared support and maintenance team capacity in FTE (default 1).
        supportHourlyCostUsd:
          type: number
          description: Loaded hourly cost of support and maintenance capacity (default 60 USD).
        supportToolingAnnualUsdPerClient:
          type: number
          description: Annual per-client support tooling, monitoring and service-management cost (default 5000 USD).
        actualsOverlayId:
          type: integer
          description: Optional saved calibration overlay used for measured token and operating-cost repricing.
    ScenarioInputs:
      type: object
      properties:
        numSystems:
          type: integer
          description: Number of HR systems of record in the client landscape (drives Act fan-out)
        annualTransactions:
          type: number
          description: Committed HR transactions per year
        employees:
          type: integer
        sector:
          type: string
        companyType:
          type: string
          description: single-country | multi-country | global
        isolationTier:
          type: string
          description: pooled | siloed | dedicated
        hrHourlyCostUsd:
          type: number
          description: Loaded hourly cost of client HR staff (as-is baseline)
        hitlHourlyCostUsd:
          type: number
          description: Loaded hourly cost of HITL reviewers in the to-be model
        countries:
          type: integer
        commercialAssumptions:
          $ref: "#/components/schemas/CommercialAssumptions"
        intentShareOverrides:
          type: object
          additionalProperties:
            type: number
          description: Optional manual overrides of intent shares (intent key to share fraction)
        assumptionOverrides:
          type: object
          additionalProperties:
            type: number
            minimum: 0
          description: >
            Per-scenario overrides for global assumption values. Keys must match
            a GlobalAssumption key from the overridable set: slm-call-cost,
            llm-call-cost, frontier-call-cost, mcp-action-cost, infra-per-txn,
            landscape-fanout, country-localization, tier-pooled, tier-siloed,
            tier-dedicated, company-multi-country, company-global.
            Absent keys use the global defaults. Values must be non-negative finite numbers.
        adoptionRate:
          type: number
          description: Share of committed volume arriving through the agentic channel (0-1, default 1). Non-adopted volume incurs no platform cost and yields no benefit.
        containmentOverrides:
          type: object
          additionalProperties:
            type: number
          description: Optional per-flow-class containment overrides (flow-class key to 0-1 fraction). Defaults come from the containment-* assumptions. Uncontained transactions still incur AI/infra cost but fall back to full as-is human handling and yield no benefit.
        hitlSamplingRate:
          type: number
          description: Fraction of default residual HITL minutes actually spent on contained transactions (0-1, default 1). Models review sampling as trust matures.
        landscapeMaturity:
          type: string
          description: clean | mixed | legacy (default mixed). Multiplies build cost and Act landscape fan-out.
        contractYears:
          type: integer
          description: Contract length in years used to amortize client onboarding cost (default 3)
        reworkRatePct:
          type: number
          description: Client's as-is share of transactions requiring rework, in percent (0-20, default 0). Drives a client-specific error-reduction benefit.
        peakLoadFactor:
          type: number
          description: Seasonality premium on avoided human effort (1-1.5, default 1). Reflects that automated capacity at peak avoids overstaffing.
        containmentRates:
          type: object
          additionalProperties:
            type: number
          description: >
            Per-flow-class fraction of transactions that complete in the automated flow (0–1).
            Non-contained (failed) transactions fall back to full as-is human cost; AI/infra costs are still charged on the full adopted volume because the attempt ran before the failure was detected.
            Defaults: fc1-deterministic=0.95, fc2-policy=0.88, fc3-multiagent=0.80, fc4-frontier=0.70.
        adoptionRamp:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: >
            Three-element array [y1, y2, y3] where each element is the fraction of annualTransactions
            routed to the automated channel in that year (0–1, non-decreasing).
            Non-adopted volume stays at as-is cost and generates no benefit.
            Default: [0.40, 0.75, 1.00].
        hitlSamplingRates:
          type: object
          additionalProperties:
            type: number
          description: >
            Per-flow-class fraction of automated (contained) transactions that also receive human review.
            Multiplies toBeHumanMin to give effective residual human minutes per automated transaction.
            Defaults: fc1-deterministic=0.05, fc2-policy=0.15, fc3-multiagent=0.30, fc4-frontier=0.60.
        modelSelection:
          type: object
          additionalProperties:
            type: string
          description: Chosen AI model per role (router | reasoning | frontier | data), keys from /model-catalog. Defaults match the registered *-call-cost assumptions.
        nonIntegratedSystems:
          type: array
          items:
            type: string
          description: System keys (see /systems) that will NOT be integrated with the MCP layer. Their get/put actions lose MCP cost but stay manual, adding handling minutes per action and reducing the benefit for intents touching them.
        intentContainmentOverrides:
          type: object
          additionalProperties:
            type: number
          description: >
            Per-intent containment targets used for drift comparison only (intentKey → 0-1 fraction).
            When set for an intent, overrides the flow-class-level containment estimate shown as the
            reference line in the Drift tab. Does not affect the rollup/cost engine.
            Absent keys fall back to the flow-class expansion from containmentRates/containmentOverrides.
      required:
        - numSystems
        - annualTransactions
        - employees
        - sector
        - companyType
        - isolationTier
        - hrHourlyCostUsd
        - hitlHourlyCostUsd
        - countries
    Scenario:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        inputs:
          $ref: "#/components/schemas/ScenarioInputs"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, inputs, createdAt, updatedAt]
    ScenarioInput:
      type: object
      properties:
        name:
          type: string
        inputs:
          $ref: "#/components/schemas/ScenarioInputs"
      required: [name, inputs]
    ScenarioUpdate:
      type: object
      properties:
        name:
          type: string
        inputs:
          $ref: "#/components/schemas/ScenarioInputs"
    SensitivityRequest:
      type: object
      properties:
        inputs:
          $ref: "#/components/schemas/ScenarioInputs"
        actualsOverlayId:
          type: integer
          description: Optional saved actuals overlay id; held constant across baseline and every nudge so the tornado matches the calibrated rollup.
      required: [inputs]
    SensitivityRow:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
          enum: [assumption, labor, containment, adoption]
        baseValue:
          type: number
        lowValue:
          type: number
        highValue:
          type: number
        netLowUsd:
          type: number
        netHighUsd:
          type: number
        swingUsd:
          type: number
          description: Max absolute deviation of net benefit from baseline across the two nudges.
      required: [key, label, group, baseValue, lowValue, highValue, netLowUsd, netHighUsd, swingUsd]
    SensitivityResult:
      type: object
      properties:
        baselineNetUsd:
          type: number
        nudgePct:
          type: number
          description: Fractional nudge applied to each driver (0.2 = ±20%).
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SensitivityRow"
      required: [baselineNetUsd, nudgePct, rows]
    ImportWorkbookResult:
      type: object
      properties:
        inputs:
          $ref: "#/components/schemas/ScenarioInputs"
      required: [inputs]
    RollupRequest:
      type: object
      properties:
        inputs:
          $ref: "#/components/schemas/ScenarioInputs"
        actualsOverlayId:
          type: integer
          description: Optional id of a saved actuals overlay to apply. When present, the rollup is re-run twice (once without, once with the overlay) and the response includes estimatedTotals and a per-assumption variance array.
      required: [inputs]
    IntentRollupRow:
      type: object
      properties:
        intentId:
          type: integer
        intentKey:
          type: string
        intentName:
          type: string
        domain:
          type: string
        flowClass:
          type: string
        share:
          type: number
          description: Fraction of total transactions allocated to this intent
        transactions:
          type: number
        runCostUsd:
          type: number
        buildCostUsd:
          type: number
          description: Amortized build cost allocated to this intent for the committed volume
        aiCostUsd:
          type: number
        infraCostUsd:
          type: number
        humanCostUsd:
          type: number
        otherCostUsd:
          type: number
        benefitUsd:
          type: number
        netUsd:
          type: number
        humanMinutesSaved:
          type: number
        overridden:
          type: boolean
          description: True when an approved SME flow override adjusted this intent
      required:
        - intentId
        - intentKey
        - intentName
        - domain
        - flowClass
        - share
        - overridden
        - transactions
        - runCostUsd
        - buildCostUsd
        - aiCostUsd
        - infraCostUsd
        - humanCostUsd
        - otherCostUsd
        - benefitUsd
        - netUsd
        - humanMinutesSaved
    RollupTotals:
      type: object
      properties:
        runCostUsd:
          type: number
        buildCostUsd:
          type: number
        totalCostUsd:
          type: number
        benefitUsd:
          type: number
        netUsd:
          type: number
        roi:
          type: number
          description: benefit divided by total cost
        costPerTransactionUsd:
          type: number
        benefitPerTransactionUsd:
          type: number
        humanHoursSaved:
          type: number
        fteEquivalent:
          type: number
          description: Human hours saved divided by annual working hours
      required:
        - runCostUsd
        - buildCostUsd
        - totalCostUsd
        - benefitUsd
        - netUsd
        - roi
        - costPerTransactionUsd
        - benefitPerTransactionUsd
        - humanHoursSaved
        - fteEquivalent
    ComponentBucket:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        usd:
          type: number
      required: [key, label, usd]
    YearSlice:
      type: object
      description: Per-year cost/benefit summary after applying adoption ramp, containment and HITL sampling
      properties:
        year:
          type: integer
          description: 1, 2, or 3
        adoptionFraction:
          type: number
          description: Fraction of annualTransactions routed to the automated channel this year
        benefitUsd:
          type: number
        totalCostUsd:
          type: number
        netUsd:
          type: number
        humanHoursSaved:
          type: number
        fteEquivalent:
          type: number
      required: [year, adoptionFraction, benefitUsd, totalCostUsd, netUsd, humanHoursSaved, fteEquivalent]
    TokenUsage:
      type: object
      properties:
        annualModelCalls:
          type: number
        annualInputTokens:
          type: number
        annualOutputTokens:
          type: number
        annualTotalTokens:
          type: number
        basis:
          type: string
          enum: [estimated, mixed, measured]
          description: Whether role-level token profiles came from architecture estimates, calibrated logs, or both.
      required: [annualModelCalls, annualInputTokens, annualOutputTokens, annualTotalTokens, basis]
    CommercialSummary:
      type: object
      description: >-
        Supplier-side pricing summary. This is deliberately separate from the
        client's cost-benefit ROI in totals.
      properties:
        productBuildCostUsd:
          type: number
          description: Reusable core product engineering investment.
        clientImplementationCostUsd:
          type: number
          description: One-time client-specific onboarding and implementation delivery cost.
        clientImplementationPriceUsd:
          type: number
          description: Recommended implementation sell price at the target pricing margin.
        annualRunCostUsd:
          type: number
          description: Annual supplier AI, infrastructure, vendor HITL and knowledge operating cost at full committed volume, before support.
        annualCommittedTransactions:
          type: number
          description: Annual transaction volume used consistently for recurring and unit pricing.
        monthlyRunCostUsd:
          type: number
        annualAiCostUsd:
          type: number
          description: Annual AI/model consumption cost at full committed volume.
        annualInfrastructureCostUsd:
          type: number
          description: Annual transaction-driven infrastructure cost at full committed volume.
        annualVendorHitlCostUsd:
          type: number
          description: Annual supplier-delivered HITL cost; excludes client fallback HR labor.
        annualChannelAndOtherVariableCostUsd:
          type: number
          description: Annual transaction-driven channel, MCP and other operating cost.
        annualKnowledgeMaintenanceCostUsd:
          type: number
          description: Annual fixed knowledge maintenance cost for the configured countries.
        annualSupportCostUsd:
          type: number
          description: Allocated annual support and maintenance delivery cost per client.
        annualSupportPriceUsd:
          type: number
          description: Standalone annual support sell price at the target pricing margin.
        annualRecurringCogsUsd:
          type: number
          description: Annual run cost plus allocated support and maintenance cost.
        monthlyRecurringCogsUsd:
          type: number
        annualProductRecoveryUsd:
          type: number
          description: Per-client annual allocation for recovering reusable product investment.
        recommendedMonthlyPriceUsd:
          type: number
        recommendedAnnualPriceUsd:
          type: number
        recommendedTransactionPriceUsd:
          type: number
          description: All-in annual subscription price divided by committed annual transactions.
        overagePricePerTransactionUsd:
          type: number
          description: Incremental run cost per transaction priced at the target margin.
        firstYearContractValueUsd:
          type: number
          description: Recommended implementation price plus first-year recurring price.
        pricingMargin:
          type: number
          description: Target margin applied after including the product-recovery allocation.
        plannedPaybackMonths:
          type: number
          description: Product investment recovery period at the target client count.
        assumptions:
          $ref: "#/components/schemas/CommercialAssumptions"
        tokenUsage:
          $ref: "#/components/schemas/TokenUsage"
      required:
        - productBuildCostUsd
        - clientImplementationCostUsd
        - clientImplementationPriceUsd
        - annualRunCostUsd
        - annualCommittedTransactions
        - monthlyRunCostUsd
        - annualAiCostUsd
        - annualInfrastructureCostUsd
        - annualVendorHitlCostUsd
        - annualChannelAndOtherVariableCostUsd
        - annualKnowledgeMaintenanceCostUsd
        - annualSupportCostUsd
        - annualSupportPriceUsd
        - annualRecurringCogsUsd
        - monthlyRecurringCogsUsd
        - annualProductRecoveryUsd
        - recommendedMonthlyPriceUsd
        - recommendedAnnualPriceUsd
        - recommendedTransactionPriceUsd
        - overagePricePerTransactionUsd
        - firstYearContractValueUsd
        - pricingMargin
        - plannedPaybackMonths
        - assumptions
        - tokenUsage
    Rollup:
      type: object
      properties:
        totals:
          $ref: "#/components/schemas/RollupTotals"
        byYear:
          type: array
          items:
            $ref: "#/components/schemas/YearSlice"
          description: Three-year view of cost/benefit after applying adoption ramp, containment and HITL sampling
        rows:
          type: array
          items:
            $ref: "#/components/schemas/IntentRollupRow"
        byFlowClass:
          type: array
          items:
            $ref: "#/components/schemas/ComponentBucket"
        byCostComponent:
          type: array
          items:
            $ref: "#/components/schemas/ComponentBucket"
        byDomain:
          type: array
          items:
            $ref: "#/components/schemas/ComponentBucket"
        tierMultiplier:
          type: number
          description: Isolation-tier cost multiplier applied (from the deck's tier uplift)
        adoptionRate:
          type: number
          description: Effective adoption rate applied (share of committed volume in the agentic channel)
        knowledgeMaintenanceUsd:
          type: number
          description: Fixed annual knowledge/content maintenance cost (per-country), included in run cost
        onboardingAnnualUsd:
          type: number
          description: Annualized one-time client onboarding cost (amortized over contract years), included in build cost
        buildBreakdown:
          type: array
          description: Component-level decomposition of build cost; annual amounts sum to totals build cost
          items:
            $ref: "#/components/schemas/BuildComponentCost"
        demarcationSplit:
          $ref: "#/components/schemas/DemarcationSplit"
        commercialSummary:
          $ref: "#/components/schemas/CommercialSummary"
        appliedAssumptions:
          type: array
          items:
            $ref: "#/components/schemas/GlobalAssumption"
        confidence:
          $ref: "#/components/schemas/Confidence"
        calibrated:
          type: boolean
          description: True when a calibration actuals overlay was applied to this rollup.
        estimatedTotals:
          $ref: "#/components/schemas/RollupTotals"
          description: Pre-calibration totals (from the pass without overlay). Present only when calibrated=true.
        variance:
          type: array
          description: Per-assumption variance between the estimated and measured values. Present only when calibrated=true.
          items:
            $ref: "#/components/schemas/VarianceEntry"
        orphanedIntentKeys:
          type: array
          description: Intent keys present in the actuals overlay that no longer exist in the active intent registry (reference + custom). The rollup proceeded on the valid remainder; these entries were silently skipped without this field. Present only when at least one orphan is detected.
          items:
            type: string
      required: [totals, byYear, rows, byFlowClass, byCostComponent, byDomain, tierMultiplier, adoptionRate, knowledgeMaintenanceUsd, onboardingAnnualUsd, buildBreakdown, demarcationSplit, commercialSummary, appliedAssumptions, confidence, calibrated]
    BuildComponentCost:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          description: platform | onboarding
        provisioning:
          type: string
          enum: [core, configurable, custom]
          description: "Product demarcation: core platform components vs custom per-client onboarding effort."
        oneTimeUsd:
          type: number
          description: One-time build/setup cost (maturity-scaled for platform components)
        annualUsd:
          type: number
          description: Annualized share included in this scenario's build cost
      required: [key, name, description, kind, provisioning, oneTimeUsd, annualUsd]
    DemarcationSplit:
      type: object
      description: >-
        Core vs custom cost split for commercial quoting: core platform build
        (amortized product cost, same for every client) vs one-time custom
        per-client implementation, with the configurable dials applied to this
        scenario listed. Amounts derive from buildBreakdown and reconcile with
        the scenario's total build cost.
      properties:
        coreOneTimeUsd:
          type: number
          description: Total one-time engineering cost of core platform components (maturity-scaled)
        coreAnnualUsd:
          type: number
          description: Core platform build cost amortized into this scenario's year-1 build cost
        customOneTimeUsd:
          type: number
          description: One-time custom per-client implementation (onboarding) cost
        customAnnualUsd:
          type: number
          description: Custom implementation cost annualized over the contract term
        contractYears:
          type: integer
          description: Contract length in years used to annualize the custom implementation cost
        configurableDials:
          type: array
          description: Configurable assumptions (client dials) applied to this scenario, deduped by key
          items:
            $ref: "#/components/schemas/GlobalAssumption"
      required: [coreOneTimeUsd, coreAnnualUsd, customOneTimeUsd, customAnnualUsd, contractYears, configurableDials]
    ModelOption:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        role:
          type: string
          description: router | reasoning | frontier | data
        pricePerCallUsd:
          type: number
        inputPricePerMillionTokens:
          type: number
          description: Published input (prompt) price per million tokens. Used to reprice calls from measured token actuals.
        outputPricePerMillionTokens:
          type: number
          description: Published output (completion) price per million tokens. Used to reprice calls from measured token actuals.
        description:
          type: string
        isDefault:
          type: boolean
      required: [key, label, role, pricePerCallUsd, inputPricePerMillionTokens, outputPricePerMillionTokens, description, isDefault]
    CustomIntent:
      type: object
      description: A client-specific intent that extends the reference corpus. Active custom intents participate in roll-ups exactly like reference intents.
      properties:
        id:
          type: integer
        key:
          type: string
          description: Auto-generated URL-safe slug (unique across reference corpus and custom intents)
        name:
          type: string
        domain:
          type: string
        flowClass:
          type: string
          description: fc1-deterministic | fc2-policy | fc3-multiagent | fc4-frontier
        description:
          type: string
        asIsHandlingMin:
          type: number
        toBeHumanMin:
          type: number
        baseWeight:
          type: number
        actGetActions:
          type: integer
        actPutActions:
          type: integer
        systemsTouchedBase:
          type: integer
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          description: Free-text rationale or provenance
        author:
          type: string
        status:
          type: string
          description: active | retired
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - key
        - name
        - domain
        - flowClass
        - description
        - asIsHandlingMin
        - toBeHumanMin
        - baseWeight
        - actGetActions
        - actPutActions
        - systemsTouchedBase
        - tags
        - source
        - author
        - status
        - createdAt
        - updatedAt
    CustomIntentInput:
      type: object
      description: Fields required to create a custom intent. Key is auto-generated from name.
      properties:
        name:
          type: string
        domain:
          type: string
        flowClass:
          type: string
        description:
          type: string
        asIsHandlingMin:
          type: number
        toBeHumanMin:
          type: number
        baseWeight:
          type: number
        actGetActions:
          type: integer
        actPutActions:
          type: integer
        systemsTouchedBase:
          type: integer
          description: Default 2
        source:
          type: string
          description: Rationale or provenance for this intent
        author:
          type: string
      required:
        - name
        - domain
        - flowClass
        - description
        - asIsHandlingMin
        - toBeHumanMin
        - baseWeight
        - actGetActions
        - actPutActions
        - source
        - author
    CustomIntentUpdate:
      type: object
      description: Partial update for a custom intent (all fields optional)
      properties:
        name:
          type: string
        domain:
          type: string
        flowClass:
          type: string
        description:
          type: string
        asIsHandlingMin:
          type: number
        toBeHumanMin:
          type: number
        baseWeight:
          type: number
        actGetActions:
          type: integer
        actPutActions:
          type: integer
        systemsTouchedBase:
          type: integer
        source:
          type: string
        author:
          type: string
    FlowOverride:
      type: object
      description: A versioned SME adjustment to an intent's flow; latest approved version per intent is applied to roll-ups
      properties:
        id:
          type: integer
        intentKey:
          type: string
        version:
          type: integer
        status:
          type: string
          description: draft | approved | superseded
        author:
          type: string
        rationale:
          type: string
        flowClass:
          type: string
          nullable: true
        toBeHumanMin:
          type: number
          nullable: true
        actGetActions:
          type: integer
          nullable: true
        actPutActions:
          type: integer
          nullable: true
        createdAt:
          type: string
      required: [id, intentKey, version, status, author, rationale, createdAt]
    FlowOverrideInput:
      type: object
      properties:
        intentKey:
          type: string
        author:
          type: string
        rationale:
          type: string
        flowClass:
          type: string
        toBeHumanMin:
          type: number
        actGetActions:
          type: integer
        actPutActions:
          type: integer
      required: [intentKey, author, rationale]
    Confidence:
      type: object
      description: How much of the model is driven by client-specific inputs vs generic defaults
      properties:
        score:
          type: number
          description: 0-100 (up to ~115 with measured overlay); higher means more of the business case rests on client-provided data
        level:
          type: string
          description: low | medium | high | calibrated
        factors:
          type: array
          items:
            $ref: "#/components/schemas/ConfidenceFactor"
      required: [score, level, factors]
    ConfidenceFactor:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        provided:
          type: boolean
          description: True when any client-specific value was supplied (fraction > 0). For per-FC factors this can be true while fraction < 1, indicating partial data.
        fraction:
          type: number
          description: "0–1 scoring fraction. Non-per-FC factors are 0 or 1; per-FC factors (containment, HITL) equal (supplied FC count / total FC count), so 2 of 4 classes awards half the weight."
        weight:
          type: number
          description: Base points this parameter contributes to the confidence score at full (fraction=1). Measured inputs earn weight + MEASURED_BONUS, yielding a strictly higher score.
        note:
          type: string
          description: What assuming the default means for the result when the parameter is missing or partial.
        sourceTier:
          type: string
          description: "Tier of the supplied value: client-confirmed (user provided) or measured (from a calibration actuals overlay). Absent when not provided."
      required: [key, label, provided, fraction, weight, note]
    VarianceEntry:
      type: object
      description: Per-assumption comparison between the estimated value (from assumptions register or scenario inputs) and the measured value (from actuals overlay).
      properties:
        assumptionKey:
          type: string
          description: Matches a key in appliedAssumptions.
        label:
          type: string
        unit:
          type: string
        estimatedValue:
          type: number
          description: Value used in the pre-calibration (estimated) rollup.
        actualValue:
          type: number
          description: Value applied in the calibrated rollup (from overlay).
        absVariance:
          type: number
          description: actualValue - estimatedValue
        pctVariance:
          type: number
          description: "(actualValue - estimatedValue) / |estimatedValue| × 100. Zero when estimatedValue is zero."
        direction:
          type: string
          description: "Which side of the model this assumption affects: cost | benefit | both"
      required: [assumptionKey, label, unit, estimatedValue, actualValue, absVariance, pctVariance, direction]
    TokenRoleActuals:
      type: object
      description: Measured average token counts per model call for a given role, taken from production logs.
      properties:
        avgInputTokens:
          type: number
          description: Average input (prompt) tokens per call.
        avgOutputTokens:
          type: number
          description: Average output (completion) tokens per call.
      required: [avgInputTokens, avgOutputTokens]
    IntentActuals:
      type: object
      description: Per-intent measured values. At least one measured field must be present.
      properties:
        intentKey:
          type: string
          description: Must match a key in the intent corpus.
        measuredContainmentRate:
          type: number
          description: Measured containment rate for this specific intent (0-1). Overrides the flow-class level measurement when present.
        avgHitlMinutes:
          type: number
          description: Measured average residual human-in-the-loop minutes per contained transaction for this intent.
      required: [intentKey]
    ActualsOverlayInput:
      type: object
      description: Calibration actuals overlay payload. All fields are optional; at least one measurement must be present.
      properties:
        clientLabel:
          type: string
          description: Human-readable label, e.g. "Acme Q1 2025 production logs".
        periodStart:
          type: string
          description: ISO date string for the start of the observed period.
        periodEnd:
          type: string
          description: ISO date string for the end of the observed period.
        intents:
          type: array
          description: Per-intent measured values.
          items:
            $ref: "#/components/schemas/IntentActuals"
        measuredContainmentByFlowClass:
          type: object
          additionalProperties:
            type: number
          description: Measured containment rate per flow class (fc1-deterministic | fc2-policy | fc3-multiagent | fc4-frontier → 0-1). Overrides the corresponding containment assumption for all intents in that class unless a per-intent value is provided.
        measuredHitlSamplingRate:
          type: number
          description: Measured fraction of residual HITL checkpoints actually reviewed (0-1). Replaces hitlSamplingRate from scenario inputs.
        tokenActualsByRole:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TokenRoleActuals"
          description: "Measured average token counts per model role (router | reasoning | frontier | data). When present for a role, the rollup reprices model calls from catalog per-token rates × measured tokens instead of the baked pricePerCallUsd."
    ActualsOverlayRecord:
      type: object
      description: A saved actuals overlay with its database id and timestamps.
      properties:
        id:
          type: integer
        clientLabel:
          type: string
          nullable: true
        periodStart:
          type: string
          nullable: true
        periodEnd:
          type: string
          nullable: true
        payload:
          $ref: "#/components/schemas/ActualsOverlayInput"
        createdAt:
          type: string
      required: [id, payload, createdAt]
    ActualsLogIntentStat:
      type: object
      description: Per-intent parse statistics from a raw call-log import.
      properties:
        intentKey:
          type: string
        rowCount:
          type: integer
          description: Number of rows in the log for this intent.
        belowMinThreshold:
          type: boolean
          description: True when rowCount < 30 — measurement is emitted but flagged as thin.
      required: [intentKey, rowCount, belowMinThreshold]
    ActualsLogUnknownIntent:
      type: object
      description: An intent key found in the log that is not present in the corpus.
      properties:
        intentKey:
          type: string
        rowCount:
          type: integer
      required: [intentKey, rowCount]
    ActualsLogParseResult:
      type: object
      description: Result of parsing a raw call-log CSV into a proposed actuals overlay.
      properties:
        proposedOverlay:
          $ref: "#/components/schemas/ActualsOverlayInput"
        periodStart:
          type: string
          nullable: true
          description: ISO date (YYYY-MM-DD) of the earliest timestamp in the log.
        periodEnd:
          type: string
          nullable: true
          description: ISO date (YYYY-MM-DD) of the latest timestamp in the log.
        totalRows:
          type: integer
          description: Total non-blank data rows found in the file (before any filtering).
        deduplicatedRows:
          type: integer
          description: >
            Rows remaining after removing duplicate call_id entries
            (totalRows minus duplicateCount). Some of these may still be
            skipped as invalid (see invalidRowSkips).
        duplicateCount:
          type: integer
          description: Number of rows skipped because their call_id was already seen.
        invalidRowSkips:
          type: integer
          description: >
            Number of rows skipped due to data quality issues (blank call_id,
            blank intent_key, unrecognisable contained value, etc.) after
            deduplication. These are separate from duplicates.
        intentStats:
          type: array
          items:
            $ref: "#/components/schemas/ActualsLogIntentStat"
          description: Per-intent statistics for known intents found in the log.
        unknownIntents:
          type: array
          items:
            $ref: "#/components/schemas/ActualsLogUnknownIntent"
          description: Intent keys present in the log that are not in the corpus.
        parseWarnings:
          type: array
          items:
            type: string
          description: Non-fatal issues encountered during parsing (duplicate IDs, unparseable rows, etc.).
      required: [proposedOverlay, totalRows, deduplicatedRows, duplicateCount, invalidRowSkips, intentStats, unknownIntents, parseWarnings]
    ActualsValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        intentRowCount:
          type: integer
          description: Number of intent rows recognised and validated.
        measuredFields:
          type: array
          items:
            type: string
          description: List of measurement dimensions present in the overlay (e.g. containment, tokenPricing, hitlSampling, hitlMinutes).
