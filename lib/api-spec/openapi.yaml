openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: corpus
    description: HRO intent corpus and reference data
  - name: scenarios
    description: Client scenarios and cost-benefit roll-ups
  - name: actuals
    description: Calibration actuals overlays (measured production data)
  - name: customIntents
    description: Client-specific intents that extend the reference corpus
  - name: onboarding
    description: Orchestrated multi-agent onboarding POC (cases, agents, approvals, channels, connectors, analytics)
  - name: pricingRateSets
    description: Immutable versioned pricing rate register for quote-critical Azure, AI, implementation, and support unit rates
  - name: enterpriseArchitecture
    description: Owner-scoped enterprise architecture assessments and reusable solution baseline
  - name: demoController
    description: Isolated, synthetic onboarding demonstrations with explicit simulated or approved live communications
  - name: demoControllerSetup
    description: One-time, operator-approved Demo Controller bootstrap for a member-only Demo Organization
  - name: onboardingUat
    description: Tenant-scoped, non-authoritative onboarding acceptance runs and evidence
  - name: governance
    description: Tenant-scoped revisioned decision, requirement coverage, and verified specialist authority register
  - name: hrPolicyLibrary
    description: Tenant-isolated, governed curated HR policy sources and cited answers; separate from case chat
  - name: organizations
    description: Authenticated organization selection, creation, and membership joining
  - name: accessGovernance
    description: Owner-managed tenant access catalog, groups, grants, and effective-access review
  - name: agentInvocations
    description: Authenticated agent invocation requests and records
  - name: audit
    description: Protected audit integrity and independently archived audit readiness
paths:
  /context-manager/retention:
    get:
      operationId: getHroContextRetention
      tags: [onboarding]
      summary: Read metadata retention policy and bounded sweep status
      description: Requires current server-verified privacy or legal authority and current tenant membership. No default approval is created.
      responses:
        "200":
          description: Reviewed policy, hold state and latest sweep status
          content: { application/json: { schema: { $ref: "#/components/schemas/HroContextRetentionStatus" } } }
        "401": { description: Authentication required }
        "403": { description: Verified privacy or legal authority required }
    put:
      operationId: saveHroContextRetention
      tags: [onboarding]
      summary: Record a new reviewed metadata retention revision or pause pruning
      description: Requires current verified privacy or legal authority. Enabling requires explicit irreversible-pruning confirmation and an approval reference. Optimistic revision checks and the shared lifecycle fence serialize approval, holds and deletion.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HroContextRetentionInput" } } }
      responses:
        "200":
          description: Newly recorded reviewed policy and current status
          content: { application/json: { schema: { $ref: "#/components/schemas/HroContextRetentionStatus" } } }
        "400": { description: Invalid rule or missing explicit pruning confirmation }
        "401": { description: Authentication required }
        "403": { description: Verified privacy or legal authority required }
        "409": { description: Policy revision changed; reload and review }
  /vault/profile:
    get:
      operationId: getVaultDashboard
      tags: [employeeVault]
      responses:
        "200":
          description: Private independent employee dashboard
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultDashboard" } } }
  /vault/source-results:
    post:
      operationId: acceptVaultSourceResult
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultSourceEnvelope" } } }
      responses:
        "204": { description: Exact authenticated source result or idempotent replay }
        "403": { description: "Unapproved, forged, stale or conflicting source evidence" }
  /vault/expiry-preferences:
    patch:
      operationId: updateVaultExpiryPreferences
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultExpiryPreferences" } } }
      responses:
        "200":
          description: Independent employee notice preference
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultExpiryPreferences" } } }
  /vault/expiry-notices/{id}/dismiss:
    post:
      operationId: dismissVaultExpiryNotice
      tags: [employeeVault]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Notice dismissed for its owner }
        "404": { description: Notice unavailable }
  /vault/documents:
    post:
      operationId: reserveVaultDocument
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultDocumentInput" } } }
      responses:
        "201":
          description: Durable upload reservation
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultDocument" } } }
  /vault/documents/{id}/bytes:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      operationId: uploadVaultDocument
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: Quarantined private upload }
    get:
      operationId: downloadVaultDocument
      tags: [employeeVault]
      responses:
        "200":
          description: Owner-only malware-cleared bytes
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
  /vault/documents/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteVaultDocument
      tags: [employeeVault]
      responses:
        "204": { description: Access withdrawn; durable cleanup scheduled }
  /vault/checks:
    post:
      operationId: submitVaultCheck
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultCheckInput" } } }
      responses:
        "201":
          description: Revision-bound submission, not trusted clearance
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultCheck" } } }
  /vault/requests/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getVaultShareRequest
      tags: [employeeVault]
      responses:
        "200":
          description: Authenticated employer request metadata only
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultShareRequest" } } }
    post:
      operationId: decideVaultShareRequest
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultConsentInput" } } }
      responses:
        "200":
          description: Employee decision
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultShareRequest" } } }
  /vault/requests/{id}/revoke:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: revokeVaultShareRequest
      tags: [employeeVault]
      responses:
        "204": { description: Future access revoked }
  /employee-vault/settings:
    get:
      operationId: getEmployeeVaultSettings
      tags: [employeeVault]
      responses:
        "200":
          description: Tenant feature readiness
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultProductSettings" } } }
    put:
      operationId: updateEmployeeVaultSettings
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultProductInput" } } }
      responses:
        "200":
          description: Owner-only product configuration
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultProductSettings" } } }
  /onboarding/cases/{caseId}/employee-vault:
    parameters: [{ name: caseId, in: path, required: true, schema: { type: integer } }]
    get:
      operationId: getCaseVaultReuse
      tags: [employeeVault]
      responses:
        "200":
          description: Live reuse evaluation
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultReuse" } } }
    post:
      operationId: requestCaseVaultReuse
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultEmployerRequestInput" } } }
      responses:
        "201":
          description: Case-bound request; no ID or email lookup
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultShareRequest" } } }
  /onboarding/cases/{caseId}/employee-vault/consume:
    parameters: [{ name: caseId, in: path, required: true, schema: { type: integer } }]
    post:
      operationId: consumeCaseVaultReuse
      tags: [employeeVault]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VaultConsumptionInput" } } }
      responses:
        "200":
          description: Minimal dated consumption receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/VaultReuse" } } }
  /onboarding/cases/{caseId}/employee-vault/requests/{requestId}/documents/{documentId}:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: integer } }
      - { name: requestId, in: path, required: true, schema: { type: string } }
      - { name: documentId, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadCaseVaultDocument
      tags: [employeeVault]
      responses:
        "200":
          description: Separate live employee grant plus all sensitive-record recipient authorities required
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
  /context-manager/transactions:
    get:
      operationId: listHroContextTransactions
      tags: [onboarding]
      summary: Read bounded metadata-only execution attempts, with operator keyset pagination
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [personal, operator], default: personal }
          description: Operator view requires a live human data.context.metadata.read grant.
        - in: query
          name: workflow
          schema: { $ref: "#/components/schemas/HroContextWorkflow" }
        - in: query
          name: status
          schema: { type: string, enum: [running, completed, failed] }
          description: Running means unfinished, not confirmed failure.
        - in: query
          name: correlationId
          schema: { type: string, format: uuid }
          description: Metadata-only correlation lookup; the same tenant and view permissions still apply.
        - in: query
          name: cursor
          schema: { type: string, minLength: 1, maxLength: 2048 }
          description: Opaque next-page cursor for operator view only. Keep the same tenant, user and filters.
      responses:
        "200":
          description: Own execution metadata in the current organization, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HroContextHistory"
        "401":
          description: Authentication required
        "403":
          description: Live operator permission required or shared demo principal
        "400":
          description: Invalid history filter
  /scenario-system-capabilities:
    get:
      operationId: listScenarioSystemCapabilities
      tags: [scenarios]
      summary: List server-supported client setup system connection choices
      responses:
        "200":
          description: Capability matrix used by Client Setup
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScenarioSystemCapability" }
  /scenarios/{id}/activate-system-setup:
    post:
      operationId: activateScenarioSystemSetup
      tags: [scenarios]
      summary: Apply a saved scenario's system choices to tenant operations
      description: Requires an organization owner or admin. Scenario saving alone never changes live connectors or open checks.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Activated scenario setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scenario" }
        "403": { description: Organization owner or admin required }
        "404": { description: Scenario not found }
  /policies/evaluation:
    get:
      operationId: getHrPolicyEvaluation
      tags: [hrPolicyLibrary]
      summary: Get synthetic answer key, business review and regression history
      responses:
        "200":
          description: Tenant-scoped synthetic benchmark evidence, not an accuracy guarantee
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyEvaluationCatalog" } } }
        "403": { description: Current membership required }
  /policies/evaluation/review:
    post:
      operationId: reviewHrPolicyEvaluation
      tags: [hrPolicyLibrary]
      summary: Record verified HR compliance review of an exact synthetic answer key
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyEvaluationReviewInput" } } }
      responses:
        "200":
          description: Business review recorded
          content: { application/json: { schema: { type: object, required: [review], properties: { review: { $ref: "#/components/schemas/HrPolicyEvaluationReview" } } } } }
        "400": { description: Invalid review }
        "403": { description: Verified HR compliance authority required }
        "409": { description: Benchmark changed }
  /policies/evaluation/runs:
    post:
      operationId: runHrPolicyEvaluation
      tags: [hrPolicyLibrary]
      summary: Run offline replay or explicitly authorized bounded real-model evaluation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyEvaluationRunInput" } } }
      responses:
        "200":
          description: Synthetic run evidence
          content: { application/json: { schema: { type: object, required: [run], properties: { run: { $ref: "#/components/schemas/HrPolicyEvaluationRun" } } } } }
        "400": { description: Invalid run }
        "403": { description: Current membership or verified live-run authority required }
        "409": { description: "Missing review, stale benchmark or budget exhausted" }
  /policies/capabilities:
    get:
      operationId: getHrPolicyCapabilities
      tags: [hrPolicyLibrary]
      summary: Get current verified policy-library capabilities
      responses:
        "200":
          description: Current capability flags
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyCapabilities" } } }
        "403": { description: Current tenant membership required }
  /policies:
    get:
      operationId: listHrPolicies
      tags: [hrPolicyLibrary]
      summary: List audience-authorized policy version metadata
      responses:
        "200":
          description: Policy metadata; never restricted source text
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyListResponse" } } }
        "403": { description: Current tenant membership required }
    post:
      operationId: createHrPolicy
      tags: [hrPolicyLibrary]
      summary: Create an immutable curated policy draft
      description: Requires current verified hr-policy-maintain authority. Required `reviewAuthorityRole` is server-enforced as hr-compliance, legal, occupational-health, or payroll; external source references are never fetched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyCreateInput" }
      responses:
        "201":
          description: Draft created
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyResponse" } } }
        "400": { description: Invalid policy input }
        "403": { description: Verified authority and source audience required }
  /policies/reminders:
    get:
      operationId: listHrPolicyReminders
      tags: [hrPolicyLibrary]
      summary: List durable, currently actionable HR policy expiry reminders
      description: Requires live tenant membership, verified active `hr-policy-maintain` authority, and the current membership role in each version's explicit audience. Published versions with review or effective-end dates overdue or within the next 30 UTC calendar days are returned; retired and superseded versions remain hidden. Reading lazily creates missing durable rows and never dispatches externally.
      responses:
        "200":
          description: Current internal-only reminder rows
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HrPolicyReminder" } } } }
        "403": { description: Live membership and verified active maintenance authority required }
  /policies/{policyId}/history:
    get:
      operationId: getHrPolicyHistory
      tags: [hrPolicyLibrary]
      summary: Get audience-authorized immutable policy history
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Version metadata
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyHistoryResponse" } } }
        "403": { description: Current tenant membership required }
        "404": { description: No visible policy source }
  /policies/{policyId}/versions/{version}:
    get:
      operationId: getHrPolicyVersion
      tags: [hrPolicyLibrary]
      summary: Read audience-authorized policy text for maintenance or review
      description: Draft/review text requires explicit maintainer or matching verified specialist authority; retired/superseded text requires verified historical review authority.
      parameters:
        - { name: policyId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Authorized curated source
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyVersionDetailResponse" } } }
        "400": { description: Invalid version request }
        "403": { description: Source audience or specialist permission required }
        "404": { description: No visible policy version }
  /policies/{policyId}/draft:
    patch:
      operationId: reviseHrPolicyDraft
      tags: [hrPolicyLibrary]
      summary: Create a successor immutable draft
      description: A published version remains current until its reviewed successor is published.
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyRevisionInput" }
      responses:
        "201":
          description: Successor draft
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyResponse" } } }
        "400": { description: Invalid policy input }
        "403": { description: Verified authority and source audience required }
        "404": { description: Policy source not found }
        "409": { description: Stale or review-locked version }
  /policies/{policyId}/submit-review:
    post:
      operationId: submitHrPolicyReview
      tags: [hrPolicyLibrary]
      summary: Submit current draft for independent review
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicySubmitReviewInput" }
      responses:
        "200":
          description: Draft is in review
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyResponse" } } }
        "400": { description: Invalid expected version }
        "403": { description: Verified maintenance authority required }
        "404": { description: Policy source not found }
        "409": { description: Draft is stale or not eligible for review }
  /policies/{policyId}/reviews:
    post:
      operationId: reviewHrPolicyVersion
      tags: [hrPolicyLibrary]
      summary: Approve or reject one exact policy version
      description: Requires the source's verified specialist review authority, live membership, source audience, and separation from the author.
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyReviewInput" }
      responses:
        "200":
          description: Immutable reviewer provenance recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyResponse" } } }
        "400": { description: Invalid review input }
        "403": { description: Verified review authority required }
        "404": { description: Policy version not found }
        "409": { description: Policy version is not awaiting review }
  /policies/{policyId}/publish:
    post:
      operationId: publishHrPolicyVersion
      tags: [hrPolicyLibrary]
      summary: Publish an approved, date-valid policy version
      description: Requires current source-category specialist authority, rechecks the independent review grant, and records a separate publisher receipt (`publicationVerificationReference`) before atomically superseding older guidance.
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyPublishInput" }
      responses:
        "200":
          description: Published policy
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyResponse" } } }
        "400": { description: Invalid publication input }
        "403": { description: Verified publishing authority required }
        "404": { description: Policy version not found }
        "409": { description: "Missing current review, stale, future or overdue source" }
  /policies/{policyId}/supersede:
    post:
      operationId: supersedeHrPolicyVersion
      tags: [hrPolicyLibrary]
      summary: Supersede a published version with a published replacement
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicySupersedeInput" }
      responses:
        "200":
          description: Superseded policy
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyResponse" } } }
        "400": { description: Invalid supersession input }
        "403": { description: Verified policy authority required }
        "404": { description: Policy version not found }
        "409": { description: Published replacement is not valid }
  /policies/{policyId}/retire:
    post:
      operationId: retireHrPolicyVersion
      tags: [hrPolicyLibrary]
      summary: Retire a published or superseded policy version
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyRetireInput" }
      responses:
        "200":
          description: Retired policy
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyResponse" } } }
        "400": { description: Invalid retirement input }
        "403": { description: Verified policy authority required }
        "404": { description: Policy version not found }
        "409": { description: Only published or superseded policies can be retired }
  /policies/answer:
    post:
      operationId: answerHrPolicyQuestion
      tags: [hrPolicyLibrary]
      summary: Answer only from a currently authorized, dated policy extract
      description: Current membership, explicit audience, publication, allowlisted applicability (country, workerType, location), and current freshness are checked before content reaches approved AI. The AI receives the exact candidate plus full authorized source context only to reject insufficient, qualified, conflicting, or injected material; it can return only the exact server passage. Authorization is rechecked after AI returns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyAnswerInput" }
      responses:
        "200":
          description: Cited extractive answer
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyAnswerResponse" } } }
        "400": { description: Invalid question or applicability }
        "403": { description: Current tenant membership required }
        "422":
          description: Missing, conflicting, future, overdue, or insufficient source
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyAnswerResponse" } } }
        "503": { description: Approved AI unavailable; no general-knowledge fallback }
  /policies/{policyId}/versions/{version}/excerpts/{excerptId}:
    get:
      operationId: getHrPolicyCitationExcerpt
      tags: [hrPolicyLibrary]
      summary: Open an authorized cited source excerpt
      description: "Retired, superseded, future, expired, or review-overdue sources require verified historical-review authority and return `isCurrent: false`."
      parameters:
        - { name: policyId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: excerptId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized source extract
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyCitationExcerpt" } } }
        "400": { description: Invalid version or excerpt request }
        "403": { description: Historical review authority required for non-current source }
        "404": { description: No visible citation }
  /policies/handoffs:
    get:
      operationId: listHrPolicyHandoffs
      tags: [hrPolicyLibrary]
      summary: List internal policy clarification work
      responses:
        "200":
          description: Internal-only handoff queue
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyHandoffListResponse" } } }
        "403": { description: Verified handoff resolution authority required }
    post:
      operationId: createHrPolicyHandoff
      tags: [hrPolicyLibrary]
      summary: Request internal human policy clarification
      description: Tenant/user duplicate requests are deduplicated and no external message is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyHandoffCreateInput" }
      responses:
        "201":
          description: Internal handoff
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyHandoffCreateResponse" } } }
        "400": { description: Invalid handoff input }
        "403": { description: Current tenant membership required }
        "409": { description: Handoff changed during deduplication }
  /policies/handoffs/{handoffId}/resolve:
    post:
      operationId: resolveHrPolicyHandoff
      tags: [hrPolicyLibrary]
      summary: Resolve an internal policy handoff
      parameters: [{ name: handoffId, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HrPolicyHandoffResolveInput" }
      responses:
        "200":
          description: Internal resolution recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/HrPolicyHandoffResolveResponse" } } }
        "400": { description: Invalid resolution input }
        "403": { description: Verified resolution authority required }
        "404": { description: Open policy handoff not found }
  /governance/decisions:
    get:
      operationId: listGovernanceDecisions
      tags: [governance]
      summary: List current tenant governance decisions
      description: Seeds only missing provisional catalog records; never overwrites tenant decisions or policies.
      responses:
        "200":
          description: Current decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceDecisionsResponse"
    post:
      operationId: createGovernanceDecision
      tags: [governance]
      summary: Create a draft decision revision one
      description: Owner/admin may draft only. Approval requires separately verified specialist authority.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceDecisionInput" }
      responses:
        "201":
          description: Draft decision
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceDecisionResponse" } } }
        "400": { description: Invalid input }
        "403": { description: Owner/admin required }
        "409": { description: Key already exists }
  /governance/decisions/{key}/history:
    get:
      operationId: getGovernanceDecisionHistory
      tags: [governance]
      summary: Read immutable revisions and reviews for a decision
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revision and review history
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceDecisionHistoryResponse" } } }
        "404": { description: Decision not found }
  /governance/decisions/{key}/revisions:
    post:
      operationId: reviseGovernanceDecision
      tags: [governance]
      summary: Supersede the current decision with a new draft revision
      description: Requires expectedRevision; active cases are not changed by this operation.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 4000 }
                proposedValue: {}
                rationale: { type: string, minLength: 1, maxLength: 4000 }
                risk: { type: string, minLength: 1, maxLength: 4000 }
                accountableRole: { type: string, minLength: 1, maxLength: 64 }
                reviewDueAt: { type: [string, "null"], format: date-time }
                impactedWorkflows: { type: array, items: { type: string }, maxItems: 100 }
                sourceReference: { type: [string, "null"], maxLength: 4000 }
      responses:
        "201":
          description: New draft revision
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceDecisionResponse" } } }
        "409": { description: Stale revision or decision changed }
  /governance/decisions/{key}/reviews:
    post:
      operationId: reviewGovernanceDecision
      tags: [governance]
      summary: Approve or reject one exact decision revision
      description: Requires an active server-verified assignment for the decision's accountable role. Tenant administration alone is insufficient.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, outcome, reason, verificationReference]
              properties:
                revision: { type: integer, minimum: 1 }
                outcome: { type: string, enum: [approved, rejected] }
                reason: { type: string }
                verificationReference: { type: string }
      responses:
        "200":
          description: Review receipt and current decision
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceDecisionReviewResponse" } } }
        "403": { description: Verified active specialist authority required }
        "409": { description: Stale or already-reviewed revision }
  /governance/requirements:
    get:
      operationId: listGovernanceRequirements
      tags: [governance]
      summary: List tenant requirement coverage
      description: Implemented, tested, configured, and approved-for-live remain independent facts.
      responses:
        "200":
          description: Requirements
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceRequirementsResponse" } } }
  /governance/requirements/{key}/coverage:
    put:
      operationId: updateGovernanceRequirementCoverage
      tags: [governance]
      summary: Attest independent coverage facts for one requirement
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                implemented: { type: boolean }
                tested: { type: boolean }
                configured: { type: boolean }
                approvedForLive: { type: boolean }
                coverageState: { type: string, enum: [gap, partial, covered] }
                relatedImplementation: { type: [string, "null"] }
                evidenceReference: { type: [string, "null"] }
      responses:
        "200":
          description: Updated coverage
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceRequirementResponse" } } }
        "403": { description: Verified specialist authority required }
        "409": { description: Stale coverage version }
  /governance/assignments:
    get:
      operationId: listGovernanceAssignments
      tags: [governance]
      summary: List verified authority assignments
      responses:
        "200":
          description: Assignments
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceAssignmentsResponse" } } }
    post:
      operationId: assignGovernanceAuthority
      tags: [governance]
      summary: Assign or nominate specialist authority
      description: A server allow-listed verified operator creates verified authority. Owner/admin may only create a pending nomination, which has no review authority until verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/GovernanceAuthorityAssignmentInput"
                - $ref: "#/components/schemas/GovernanceAuthorityNominationInput"
      responses:
        "201":
          description: Verified assignment
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceAssignmentResponse" } } }
        "403": { description: Server-verified operator required }
  /governance/assignments/{id}/verify:
    post:
      operationId: verifyGovernanceAuthority
      tags: [governance]
      summary: Verify a pending owner/admin authority nomination
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verificationReference]
              properties:
                verificationReference: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200": { description: Verified assignment }
        "403": { description: Server-verified operator required }
        "409": { description: "Pending assignment missing, revoked, or already verified" }
  /governance/authority-bootstrap:
    post:
      operationId: bootstrapGovernanceAuthority
      tags: [governance]
      summary: Bootstrap verified specialist authority
      description: Same server-verified operator controls as assignment; this is not a tenant-admin escalation path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceAuthorityAssignmentInput" }
      responses:
        "201":
          description: Verified bootstrap assignment
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceAssignmentResponse" } } }
        "403": { description: Server-verified operator required }
  /governance/assignments/{id}/revoke:
    post:
      operationId: revokeGovernanceAuthority
      tags: [governance]
      summary: Revoke a verified authority assignment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Revoked assignment
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceAssignmentResponse" } } }
        "403": { description: Server-verified operator required }
        "409": { description: Assignment absent or already revoked }
  /governance/history:
    get:
      operationId: listGovernanceHistory
      tags: [governance]
      summary: Read tenant governance audit history
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        "200":
          description: Governance audit events
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceHistoryResponse" } } }
  /governance/reminders/dispatch:
    post:
      operationId: dispatchGovernanceReminders
      tags: [governance]
      summary: Sweep due durable tenant review reminders
      description: Claims each persisted reminder once and writes an in-app audit event; it sends no external notification.
      responses:
        "200":
          description: Durable reminder sweep receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/GovernanceReminderDispatchResponse" } } }
        "403": { description: Owner/admin required }
  /governance/dispatches/{dispatchId}/reconcile:
    post:
      operationId: reconcileGovernanceDispatch
      tags: [governance]
      summary: Finalize a durably ambiguous governance provider dispatch
      description: Only a server-verified operator may reconcile an ambiguous fence after establishing the external outcome.
      parameters:
        - { name: dispatchId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reconciliationReference]
              properties:
                reconciliationReference: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200": { description: Finalized reconciliation receipt }
        "403": { description: Server-verified operator required }
        "409": { description: Ambiguous dispatch absent or already finalized }
  /organizations/current:
    get:
      operationId: getCurrentOrganization
      tags: [organizations]
      summary: Get the authenticated user's organization memberships and active selection
      description: The optional X-Organization-Id header selects the active membership. A missing or invalid selection is returned as null rather than crossing tenant boundaries.
      responses:
        "200":
          description: Current organization context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationCurrentResponse" }
        "401": { description: Authentication required }
  /organizations/current/primary-country:
    put:
      operationId: updateOrganizationPrimaryCountry
      tags: [organizations]
      summary: Update the active organization's primary country
      description: Owner/admin only. This does not rewrite saved starter proposals or approved policies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPrimaryCountryInput" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization: { $ref: "#/components/schemas/OrganizationSummary" }
                required: [organization]
        "400": { description: Invalid country }
        "401": { description: Authentication required }
        "403": { description: Owner or admin role required }
  /organizations/current/access:
    get:
      operationId: getOrganizationAccessGovernance
      tags: [accessGovernance]
      summary: Read the current organization's access-governance snapshot
      description: Owner/admin only. Includes the reviewed catalog, active organization members, registered agents, user groups, security groups, effective direct grants, and the most recent 250 audit events.
      responses:
        "200":
          description: Access-governance snapshot
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceSnapshot" } } }
        "403":
          description: Owner or administrator access is required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/preview:
    get:
      operationId: previewOrganizationPrincipalAccess
      tags: [accessGovernance]
      summary: Resolve effective access for a principal
      description: Owner/admin only. Optional caseId includes case-scoped grants in the evaluation. Previewing a registered agent requires an explicit initiatorUserId; effective agent access is evaluated in that initiator's context and is constrained by the initiator's effective access. The registered owner is never inferred as the initiator.
      parameters:
        - name: principalType
          in: query
          required: true
          schema: { type: string, enum: [user, agent] }
        - name: principalId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: caseId
          in: query
          required: false
          description: Optional positive case ID whose case-scoped grants should be included.
          schema: { type: integer, minimum: 1 }
        - name: initiatorUserId
          in: query
          required: false
          description: Required when principalType is agent. Explicit organization-member user whose effective access constrains the agent preview.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Effective access and per-key explanation
          content: { application/json: { schema: { $ref: "#/components/schemas/EffectiveAccess" } } }
        "400":
          description: Principal type or ID is invalid
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Owner or administrator access is required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/field-access:
    get:
      operationId: listOrganizationPrincipalsWithFieldAccess
      tags: [accessGovernance]
      summary: List active principals allowed to access a catalog field
      description: Owner/admin only. Optional caseId includes case-scoped grants. Pass initiatorUserId to resolve agent entries in an explicit initiator context; agent access is constrained by that user's effective access and is never inferred from the registered owner.
      parameters:
        - name: field
          in: query
          required: true
          schema: { $ref: "#/components/schemas/AccessFieldKey" }
        - name: caseId
          in: query
          required: false
          description: Optional positive case ID whose case-scoped grants should be included.
          schema: { type: integer, minimum: 1 }
        - name: initiatorUserId
          in: query
          required: false
          description: Explicit organization-member user context for resolving registered-agent access.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Principals with effective access and reasons
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessFieldPrincipalsResponse" } } }
        "400":
          description: A known catalog field key is required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Owner or administrator access is required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/agents:
    post:
      operationId: createAccessAgent
      tags: [accessGovernance]
      summary: Register an agent for the current organization
      description: Owner only. The supplied ownerUserId must identify an active human member.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessAgentInput" } } }
      responses:
        "201":
          description: Registered agent
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessAgentResponse" } } }
        "400":
          description: Invalid agent or inactive owner
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/agents/{id}:
    patch:
      operationId: retireAccessAgent
      tags: [accessGovernance]
      summary: Retire a registered agent
      description: Owner only. Uses the agent's expected history version to reject stale updates.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessAgentUpdate" } } }
      responses:
        "200":
          description: Retirement result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceOk" } } }
        "400":
          description: Invalid agent update
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Agent not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Agent version conflict
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/user-groups:
    post:
      operationId: createAccessUserGroup
      tags: [accessGovernance]
      summary: Create a user group
      description: Owner only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserGroupInput" } } }
      responses:
        "201":
          description: Created user group
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserGroupResponse" } } }
        "400":
          description: Invalid user group
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/user-groups/{id}:
    patch:
      operationId: updateAccessUserGroup
      tags: [accessGovernance]
      summary: Rename or retire a user group
      description: Owner only. The expected version is the number of history events for the group; retired groups cannot be changed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserGroupUpdate" } } }
      responses:
        "200":
          description: Update result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceOk" } } }
        "400":
          description: Invalid user-group update
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: User group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Version conflict or retired group
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/user-groups/{id}/members:
    put:
      operationId: setAccessUserGroupMember
      tags: [accessGovernance]
      summary: Add or remove a principal from a user group
      description: Owner only. Adding requires an active organization member or registered agent; removing is idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserGroupMemberUpdate" } } }
      responses:
        "200":
          description: Membership update result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceStatusResponse" } } }
        "400":
          description: Invalid membership or inactive principal
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Active user group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/user-groups/{id}/members/approve:
    post:
      operationId: approveAccessUserGroupMember
      tags: [accessGovernance]
      summary: Independently approve a pending sensitive user-group membership
      description: Owner only. expectedVersion must match the current user-group version; the reviewer must be an active owner other than the requester and member being approved.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserGroupMemberApproval" } } }
      responses:
        "200":
          description: Membership approval result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceStatusResponse" } } }
        "400":
          description: Invalid approval request or inactive principal
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Owner or independent-review requirement not met
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Active user group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Version conflict, no pending membership, or review no longer required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/user-groups/{id}/security-groups:
    put:
      operationId: setAccessUserGroupSecurityGroup
      tags: [accessGovernance]
      summary: Attach or detach a security group from a user group
      description: Owner only. Retired groups cannot be attached.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserGroupSecurityGroupUpdate" } } }
      responses:
        "200":
          description: Attachment update result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceStatusResponse" } } }
        "400":
          description: Invalid attachment
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: User or security group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Retired group cannot be attached
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/user-groups/{id}/security-groups/approve:
    post:
      operationId: approveAccessUserGroupSecurityGroup
      tags: [accessGovernance]
      summary: Independently approve a pending sensitive group attachment
      description: Owner of the security group only. expectedVersion must match its current policy version; the requester and policy must already have independent approval.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserGroupSecurityGroupApproval" } } }
      responses:
        "200":
          description: Attachment approval result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceStatusResponse" } } }
        "400":
          description: Invalid approval request
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Active security-group owner or independent-review requirement not met
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Active group binding not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Version conflict, no pending attachment, or review requirement not met
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/security-groups:
    post:
      operationId: createAccessSecurityGroup
      tags: [accessGovernance]
      summary: Create a security group and its initial policy
      description: Owner only. Policies accept only keys in the reviewed access catalog; high-sensitivity policies require independent owner approval before sensitive grants become active.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessSecurityGroupInput" } } }
      responses:
        "201":
          description: Created security group
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessSecurityGroupResponse" } } }
        "400":
          description: Invalid security group or catalog keys
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/security-groups/{id}:
    patch:
      operationId: updateAccessSecurityGroup
      tags: [accessGovernance]
      summary: Publish a new security-group policy version or retire the group
      description: Owner only. expectedVersion must match the current policy version. Sensitive keys require a different owner to approve the published policy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessSecurityGroupUpdate" } } }
      responses:
        "200":
          description: Update result and new policy version
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessSecurityGroupVersionResponse" } } }
        "400":
          description: Invalid security-group update or catalog keys
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Security group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Version conflict, retired group, or unknown policy key
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/grants:
    put:
      operationId: setAccessPrincipalSecurityGroupGrant
      tags: [accessGovernance]
      summary: Grant or revoke a security group for a principal
      description: Owner only. Grant targets must be active organization members or agents; sensitive policy resources are granted only after independent approval.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrantUpdate" } } }
      responses:
        "200":
          description: Grant update result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceStatusResponse" } } }
        "400":
          description: Invalid grant or inactive principal
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Security group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Security group is retired or its policy is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/grants/approve:
    post:
      operationId: approveAccessPrincipalSecurityGroupGrant
      tags: [accessGovernance]
      summary: Independently approve a pending sensitive direct grant
      description: Owner of the security group only. expectedVersion must match its current policy version; the grant target must be active and the policy independently approved.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrantApproval" } } }
      responses:
        "200":
          description: Direct-grant approval result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceStatusResponse" } } }
        "400":
          description: Invalid approval request or inactive principal
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Active security-group owner or independent-review requirement not met
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Security group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Version conflict, no pending grant, or review requirement not met
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /organizations/current/access/security-groups/{id}/approve:
    post:
      operationId: approveAccessSecurityGroupPolicy
      tags: [accessGovernance]
      summary: Independently approve a high-sensitivity security-group policy
      description: Owner only; the reviewer must differ from the owner who created the policy. expectedVersion must match the current policy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessPolicyApproval" } } }
      responses:
        "200":
          description: Approval result
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessPolicyApprovalResponse" } } }
        "400":
          description: Invalid approval request
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "403":
          description: Organization owner or independent reviewer required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "404":
          description: Security group not found
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
        "409":
          description: Version conflict, unknown policy key, or independent review is not required
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGovernanceError" } } }
  /agent-invocations:
    post:
      operationId: invokeRegisteredAgentTool
      tags: [agentInvocations]
      summary: Request a tool invocation by a registered organization agent
      description: Authenticated human initiation is required. The server resolves the agent, owner, permissions, and case within the current tenant; request claims cannot establish authority. The currently executable tool is read-only case metadata lookup. Every authorized or denied attempt is durably audited.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationInput" } } }
      responses:
        "200":
          description: Tool result and durable audit record ID
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationResponse" } } }
        "400":
          description: Invocation request is malformed or missing required fields
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationError" } } }
        "401":
          description: Authenticated human initiation is required
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationAuthenticationError" } } }
        "403":
          description: Invocation denied by tenant, agent, case, tool, or delegated-access authorization
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationDenied" } } }
        "500":
          description: Authorized tool operation failed and its outcome was durably recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationFailure" } } }
  /agent-invocations/audit:
    get:
      operationId: listAgentInvocationAudit
      tags: [agentInvocations]
      summary: Read registered-agent invocation audit
      description: Tenant-scoped, read-only audit listing for organization owners and administrators. Returns no tool payload or case contents.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: beforeId
          schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
      responses:
        "200":
          description: Invocation audit records for the current tenant
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationAuditList" } } }
        "400":
          description: Invalid pagination parameters
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationError" } } }
        "403":
          description: Organization owner or administrator access is required
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInvocationAuditForbidden" } } }
  /organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization and become its owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreateInput" }
      responses:
        "201":
          description: Created organization and one-time join code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationCreateResponse" }
        "400": { description: Invalid organization or archive configuration }
        "401": { description: Authentication required }
  /organizations/join:
    post:
      operationId: joinOrganization
      tags: [organizations]
      summary: Join an organization with a join code
      description: The demo flag joins the well-known synthetic Demo Organization and does not require a join code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationJoinInput" }
      responses:
        "200":
          description: Joined organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationJoinResponse" }
        "400": { description: Join code or demo selection is required }
        "401": { description: Authentication required }
        "403": { description: Membership was revoked }
        "404": { description: Join code was not found }
        "409": { description: Membership changed during the join }
  /organizations/current/audit-archive:
    get:
      operationId: getCurrentOrganizationAuditArchive
      tags: [organizations, audit]
      summary: Get external audit archive readiness for the selected organization
      responses:
        "200":
          description: External archive readiness and comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationAuditArchiveResponse" }
        "400": { description: Active organization header is required }
        "401": { description: Authentication required }
        "403": { description: Organization membership required }
    put:
      operationId: updateCurrentOrganizationAuditArchive
      tags: [organizations, audit]
      summary: Configure or clear the selected organization's external audit archive
      description: Stores references only; credential values are never accepted. Reconfiguration increments the archive generation and invalidates prior drills.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationAuditArchiveInput" }
      responses:
        "200":
          description: Updated external archive readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationAuditArchiveResponse" }
        "400": { description: Invalid archive configuration }
        "401": { description: Authentication required }
        "403": { description: Organization owner or admin required }
  /organizations/current/audit-archive/drills:
    post:
      operationId: runCurrentOrganizationAuditArchiveDrill
      tags: [organizations, audit]
      summary: Run a provider-owned restore or legal-hold archive drill
      description: A drill is valid only when the configured independent provider returns a verifiable receipt for the current archive generation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationAuditArchiveDrillInput" }
      responses:
        "200":
          description: Drill receipt and refreshed external archive readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationAuditArchiveDrillResponse" }
        "400": { description: Invalid drill kind }
        "401": { description: Authentication required }
        "403": { description: Organization owner or admin required }
        "500": { description: Provider drill failed or returned an unverifiable receipt }
  /organizations/demo-controller-setup:
    get:
      operationId: getDemoControllerSetupStatus
      tags: [demoControllerSetup]
      summary: Get the authenticated member's Demo Controller setup status
      description: Returns only the authenticated Demo Organization member's own active setup request. The operator approval authority is a deployment secret and is never returned or logged.
      responses:
        "200":
          description: Setup status
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
            Pragma:
              schema: { type: string, const: "no-cache" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerSetupResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Demo Organization scope or membership required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /organizations/demo-controller-setup/request:
    post:
      operationId: requestDemoControllerSetup
      tags: [demoControllerSetup]
      summary: Request a one-time Demo Controller setup approval
      description: Issues or reuses the authenticated member's active 24-hour request. The returned opaque value must be provided privately to the deployment operator, who sets DEMO_CONTROLLER_SETUP_APPROVAL to that exact value.
      responses:
        "200":
          description: Active setup request
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
            Pragma:
              schema: { type: string, const: "no-cache" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerSetupResponse"
        "400":
          description: Strict request-body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Demo member required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: An existing Demo Controller or one-time grant prevents bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /organizations/demo-controller-setup/complete:
    post:
      operationId: completeDemoControllerSetup
      tags: [demoControllerSetup]
      summary: Complete the authenticated member's operator-approved setup
      description: Atomically consumes the exact request and grants Demo Organization admin only while no owner/admin exists. The durable grant is one-time per Demo Organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDemoControllerSetupBody"
      responses:
        "200":
          description: Setup completed
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
            Pragma:
              schema: { type: string, const: "no-cache" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerSetupResponse"
        "400":
          description: Strict request-body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Demo member or current operator approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Expired, consumed, stale, or no-longer-eligible request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /organizations/members:
    get:
      operationId: listOrganizationMembers
      tags: [organizations]
      summary: List active members in the selected organization
      description: Owner and admin members may read the active membership list. Revoked memberships are intentionally omitted.
      responses:
        "200":
          description: Active organization members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
        "401":
          description: Authentication required
        "403":
          description: Owner or admin membership required
  /organizations/current/removed-members:
    get:
      operationId: listRemovedOrganizationMembers
      tags: [organizations]
      summary: List removed members in the selected organization
      description: Owner-only listing of retained membership revocation tombstones. Removed accounts are never exposed to admins or other tenants.
      responses:
        "200":
          description: Removed organization members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemovedOrganizationMember"
        "401":
          description: Authentication required
        "403":
          description: Organization owner membership required
  /organizations/current/members/{userId}/reinstate:
    post:
      operationId: reinstateOrganizationMember
      tags: [organizations]
      summary: Reinstate a removed organization member
      description: Owner-only reinstatement protected by the exact revokedAt timestamp and monotonic membership revision compare-and-set preconditions. The account is restored only as an ordinary member; specialist grants and historical approval receipts remain revoked.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationMemberReinstatement"
      responses:
        "200":
          description: Reinstated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "400": { description: Invalid reinstatement body }
        "403": { description: Organization owner membership required }
        "404": { description: Removed target membership not found }
        "409": { description: Expected removal timestamp or membership revision conflict }
  /organizations/members/{userId}:
    patch:
      operationId: changeOrganizationMemberRole
      tags: [organizations]
      summary: Change an active member's role
      description: Owner-only role mutation protected by an expected-role compare-and-set precondition.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationMemberRoleChange"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "400": { description: Invalid role mutation body }
        "403": { description: Owner membership required }
        "404": { description: Active target membership not found }
        "409": { description: Expected-role conflict or protected owner }
    delete:
      operationId: removeOrganizationMember
      tags: [organizations]
      summary: Revoke an active organization membership
      description: Owner-only removal. The membership row is retained as a revocation tombstone and all tenant-scoped specialist authority grants are revoked atomically.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationMemberRemoval"
      responses:
        "200":
          description: Revoked membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "400": { description: Invalid removal body }
        "403": { description: Owner membership required }
        "404": { description: Active target membership not found }
        "409": { description: Expected-role conflict or protected owner }
  /onboarding/demo-controller:
    get:
      operationId: getOnboardingDemoController
      tags: [demoController]
      summary: Get demo-controller capabilities and available scenarios
      description: Returns the capability boundary for the selected tenant. Every authenticated Demo Organization member may create or mutate synthetic demo runs, including demo overrides. Authentication, tenant isolation, and approved-volunteer communication safeguards still apply.
      responses:
        "200":
          description: Demo-controller capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerCapabilities"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs:
    post:
      operationId: createOnboardingDemoRun
      tags: [demoController]
      summary: Create a fresh synthetic onboarding demonstration run
      description: Creates a new run-owned synthetic case. The case remains blocked from ordinary orchestration and outbound automation; mode defaults to hybrid and never enables HRIS, access, assets, payroll, or learning connectors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRunInput"
      responses:
        "201":
          description: Created demonstration run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRun"
        "403":
          description: Authenticated Demo Organization membership required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    get:
      operationId: getOnboardingDemoRun
      tags: [demoController]
      summary: Get a demonstration run
      responses:
        "200":
          description: Demonstration run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs/{runId}/actions:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    post:
      operationId: applyOnboardingDemoRunAction
      tags: [demoController]
      summary: Apply one optimistic-versioned action to a demonstration run
      description: Every action is explicitly requested, UUID-idempotent, and scoped to its run. Provider calls, if explicitly authorized, happen outside the database transaction after a durable claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRunAction"
      responses:
        "200":
          description: Updated demonstration run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRun"
        "400":
          description: Invalid action or unsafe live request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Stale version or duplicate action with a different payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs/{runId}/documents:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    get:
      operationId: downloadOnboardingDemoRunDocuments
      tags: [demoController]
      summary: Download a watermarked synthetic documentation pack
      description: Generates a plain-text synthetic pack from run metadata. No document bytes are persisted.
      responses:
        "200":
          description: Synthetic documentation pack
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/uat:
    get:
      operationId: getOnboardingUatCatalog
      tags: [onboardingUat]
      summary: Get the non-authoritative UAT catalog and tenant-owned run summaries
      responses:
        "200":
          description: UAT catalog and runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingUatCatalog" }
        "403": { description: Authenticated organization membership required }
  /onboarding/learning-catalog:
    get:
      operationId: getOnboardingLearningCatalog
      tags: [onboardingUat]
      summary: Get the canonical learning, feature, and requirements traceability catalog
      responses:
        "200":
          description: Canonical catalog without tenant-private run evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingLearningCatalog" }
  /onboarding/uat/runs:
    post:
      operationId: createOnboardingUatRun
      tags: [onboardingUat]
      summary: Create a tenant-scoped synthetic UAT run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingUatRunInput" }
      responses:
        "201":
          description: Created synthetic UAT run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingUatRun" }
        "400": { description: Invalid scenario or unsafe real-email request }
  /onboarding/uat/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOnboardingUatRun
      tags: [onboardingUat]
      summary: Get a tenant-owned UAT run
      responses:
        "200":
          description: UAT run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingUatRun" }
        "404": { description: Run not found in current organization }
  /onboarding/uat/runs/{runId}/actions:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: applyOnboardingUatRunAction
      tags: [onboardingUat]
      summary: Record a guided action, run-scoped exchange, or scoped clock advance
      description: Simulation remains non-authoritative. The only live-email action delegates to an existing Demo Organization run with its already pinned approved volunteer, explicit confirmation, and existing monitoring; it never accepts a recipient address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingUatRunAction" }
      responses:
        "200":
          description: Updated UAT run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingUatRun" }
        "409": { description: Stale run version or conflicting idempotency request }
  /onboarding/uat/runs/{runId}/fixture-pack:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadOnboardingUatFixturePack
      tags: [onboardingUat]
      summary: Download a harmless synthetic fixture manifest
      responses:
        "200":
          description: Plain text, upload-ready fixture instructions
          content: { text/plain: { schema: { type: string } } }
  /onboarding/uat/runs/{runId}/evidence-report:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadOnboardingUatEvidenceReport
      tags: [onboardingUat]
      summary: Download a redacted UAT evidence report
      responses:
        "200":
          description: Redacted JSON evidence report
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingUatEvidenceReport" } } }
  /enterprise-architecture/baseline:
    get:
      operationId: getEnterpriseArchitectureBaseline
      tags: [enterpriseArchitecture]
      summary: Derive the reusable solution baseline from the current corpus
      responses:
        "200":
          description: Reusable architecture baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaSolutionBaseline"
  /enterprise-architecture/assessments:
    get:
      operationId: listEaAssessments
      tags: [enterpriseArchitecture]
      summary: List assessments owned by the signed-in user
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EaAssessmentStatus"
      responses:
        "200":
          description: Assessment list
          content:
            application/json:
              schema:
