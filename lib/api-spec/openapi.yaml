    BgvNotificationConfig:
      type: object
      properties:
        version: { type: integer, minimum: 1 }
        flags:
          type: object
          properties:
            candidateActionRequired: { type: boolean }
            providerActionRequired: { type: boolean }
            startDateAtRisk: { type: boolean }
            coordinationRequired: { type: boolean }
            dependentWorkOnHold: { type: boolean }
        hr: { $ref: "#/components/schemas/BgvNotificationRecipientConfig" }
        bgvTeam: { $ref: "#/components/schemas/BgvNotificationRecipientConfig" }
        recruiter: { $ref: "#/components/schemas/BgvNotificationRecipientConfig" }
        hiringManager: { $ref: "#/components/schemas/BgvNotificationRecipientConfig" }
        compliance: { $ref: "#/components/schemas/BgvNotificationRecipientConfig" }
        candidate:
          type: object
          properties:
            enabled: { type: boolean }
            purposeAuthorized: { type: boolean }
          required: [enabled, purposeAuthorized]
      required: [version]
    BgvNotificationAuthority:
      type: object
      properties:
        canManage: { type: boolean }
        offline: { type: boolean }
        reason: { type: ["string", "null"] }
      required: [canManage, offline, reason]
    BgvNotificationRecipient:
      type: object
