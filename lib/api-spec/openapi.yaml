  /onboarding/cases/{caseId}/bgv-notifications:
    get:
      operationId: getOnboardingBgvNotifications
      tags: [onboarding]
      summary: Read durable BGV stakeholder notification cycles and delivery state
      description: >
        Returns tenant-scoped recipient configuration, source-derived BGV
        notification cycles, and one planned recipient row per stakeholder.
        Missing recipients, simulated provenance, and live authorization
        requirements are explicit; configuration never implies delivery.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: BGV notification policy and durable delivery state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingBgvNotificationsEnvelope"
        "404":
          description: Case not found in the requesting organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    put:
      operationId: updateOnboardingBgvNotifications
      tags: [onboarding]
      summary: Save case-scoped BGV notification recipients and coordination metadata
      description: >
        Saves explicit recipient purpose authorization and safe coordination
        metadata. It never mutates BGV evidence or employment state. Owner/admin
        HR roles may save real recipient configuration; Demo Organization
        members may save simulation-only configuration. Requires the current
        optimistic version.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOnboardingBgvNotificationsRequest" }
      responses:
        "200":
          description: Saved notification policy and current cycles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingBgvNotificationsEnvelope" }
        "400": { description: Invalid recipient or coordination metadata }
        "403": { description: HR owner/admin role required for live tenant configuration }
        "404": { description: Case not found in the requesting organization }
        "409": { description: Stale notification configuration version }
  /onboarding/cases/{caseId}/bgv-notifications/reconcile:
    post:
      operationId: reconcileOnboardingBgvNotifications
      tags: [onboarding]
      summary: Reconcile current BGV stakeholder notifications
      description: >
        Creates missing current-cycle communications and retries only definite
        failures. Unknown provider outcomes are never replayed. Synthetic,
        offline, and demo transitions stay simulated or skipped and cannot
        live-send.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileOnboardingBgvNotificationsRequest" }
      responses:
        "200":
          description: Current notification policy after reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileOnboardingBgvNotificationsResult" }
        "403": { description: HR owner/admin role required }
        "404": { description: Case not found in the requesting organization }
        "409": { description: Current cycle is stale or has ambiguous delivery }
