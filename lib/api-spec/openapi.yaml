      required: [expectedVersion, expectedGenerationId, requestId]
    RestartOnboardingCaseSimulationBody:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: Version returned by the preceding simulation state response
        expectedGenerationId:
          type: string
          minLength: 1
          maxLength: 200
          description: Opaque generation identity returned by the preceding simulation state response
        requestId:
          type: string
          minLength: 1
          maxLength: 200
          description: Client retry key; a retry with the same key replays the restart result
      required: [expectedVersion, expectedGenerationId, requestId]
    OnboardingCaseSimulationExchange:
      type: object
      additionalProperties: false
      properties:
        sequence: { type: integer, minimum: 1 }
        stage:
          type: string
          enum: [offer, documents, bgv, payroll, access, readiness, final-review]
        stageBefore:
          type: string
          enum: [offer, documents, bgv, payroll, access, readiness, final-review]
        stageAfter:
          type: string
          enum: [offer, documents, bgv, payroll, access, readiness, final-review, complete]
        outcome:
          type: string
          enum: [success, missing-info, pending, exception]
        transition:
          type: string
          enum: [advanced, follow-up, pending, review, completed]
        followUp: { type: boolean }
        reviewRequired: { type: boolean }
        requestText:
          type: string
          description: Explicitly simulated request shown to the case panel
        responderLabel:
          type: string
          description: Non-real simulated responder label
        responseText:
          type: string
          description: Explicitly simulated response text
        decisionExplanation:
          type: string
          description: Why the simulated outcome did or did not advance the stage
        nextAction:
          type: string
          enum: [advance-stage, follow-up-missing-info, poll-status, simulated-human-review, complete]
        recordedAt: { type: string, format: date-time }
        deliveryProvenance:
          type: string
          enum: [simulated, real-email]
        businessOutcome:
          type: string
          enum: [simulated]
      required:
        - sequence
        - stage
        - stageBefore
        - stageAfter
        - outcome
        - transition
        - followUp
        - reviewRequired
        - requestText
        - responderLabel
        - responseText
        - decisionExplanation
        - nextAction
        - recordedAt
    OnboardingCaseSimulationState:
      type: object
      additionalProperties: false
      properties:
        caseId: { type: integer, minimum: 1 }
        generationId:
          type: string
          minLength: 1
          maxLength: 200
          description: Opaque identity of the current simulation generation; versions are scoped to it
        version: { type: integer, minimum: 0 }
        stage:
          type: string
          enum: [offer, documents, bgv, payroll, access, readiness, final-review, complete]
        status:
          type: string
          enum: [ready, active, follow-up, pending, review, completed]
        exchanges:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/OnboardingCaseSimulationExchange"
        lastOutcome:
          type: [string, "null"]
          enum: [success, missing-info, pending, exception, null]
        operationExchange:
          oneOf:
            - $ref: "#/components/schemas/OnboardingCaseSimulationExchange"
            - type: "null"
          description: The operation exchange created by this request; null on GET
        replayed:
          type: boolean
          description: True when requestId replayed its original exchange after later writes
        simulated: { type: boolean, const: true }
        authoritative: { type: boolean, const: false }
        emailDelivery:
          oneOf:
            - $ref: "#/components/schemas/OnboardingCaseSimulationEmailDelivery"
            - type: "null"
          description: Current controlled real-email delivery status; recipient is masked and correlation secrets are never returned
      required: [caseId, generationId, version, stage, status, exchanges, lastOutcome, operationExchange, replayed, simulated, authoritative, emailDelivery]
    OnboardingCaseSimulationEmailDelivery:
      type: object
      additionalProperties: false
      properties:
        transport: { type: string, enum: [real-email] }
        businessOutcome: { type: string, enum: [simulated-only] }
        recipient: { type: string }
        status: { type: string, enum: [prepared, sent, sending, failed, replied, stale] }
        reason: { type: [string, "null"] }
        freshness: { type: string, enum: [current-generation, retired-generation] }
      required: [transport, businessOutcome, recipient, status, reason, freshness]
    OnboardingCaseSimulationEmailResult:
      allOf:
        - $ref: "#/components/schemas/OnboardingCaseSimulationState"
        - type: object
          additionalProperties: false
          properties:
            emailDelivery:
              type: object
              additionalProperties: false
              properties:
                transport: { type: string, enum: [real-email] }
                businessOutcome: { type: string, enum: [simulated-only] }
                recipient: { type: string }
                status: { type: string, enum: [prepared, sent, sending, failed, replied, stale] }
                reason: { type: [string, "null"] }
                freshness: { type: string, enum: [current-generation, retired-generation] }
              required: [transport, businessOutcome, recipient, status, reason, freshness]
          required: [emailDelivery]
