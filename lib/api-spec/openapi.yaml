        evidenceContract:
          $ref: "#/components/schemas/IntentEvidenceContract"
        maturity:
          type: string
          enum: [catalogued, simulated, integrated, verified, unsupported]
        source:
          type: string
          enum: [reference, custom]
        status:
          type: string
