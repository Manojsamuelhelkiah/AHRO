    OnbOperationalRequestMethod:
      type: string
      enum: [email, agent, human-task]
    OnbOperationalRequestStatus:
      type: string
      enum: [requested, in-progress, completed, blocked]
    OnbAgent:
      type: object
      description: >
        Canonical identity for an operational onboarding agent. The current
        catalog contains internal simulation personas; simulated true means no
        AI provider or external system was invoked.
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        name:
          type: string
        origin:
          type: string
          enum: [internal, external]
        description:
          type: string
        owner:
          type: string
        capabilities:
          type: array
          items:
            type: string
        simulated:
          type: boolean
          enum: [true]
      required: [id, name, origin, description, owner, capabilities, simulated]
    OnbOperationalRequestHistoryEntry:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OnbOperationalRequestStatus"
        at:
          type: string
          format: date-time
        actor:
          type: string
        reason:
          type: ["string", "null"]
        requestId:
          type: ["string", "null"]
        communicationId:
          type: ["integer", "null"]
        agentIdentity:
          oneOf:
            - $ref: "#/components/schemas/OnbAgent"
            - type: "null"
          description: Resolved identity for a new AI-agent assignment; null means no AI agent attribution or historical identity unavailable
      required: [status, at, actor, reason, requestId, communicationId]
    OnbOperationalRequest:
      type: object
      description: >
        A simulated setup request or an accountable workforce human task.
        Human tasks never represent an AI, LMS, calendar, message, or external
        system execution.
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        label:
          type: string
        owner:
          type: string
          description: Workstream owner accountable for the simulated request
        agent:
          type: string
          description: Stable simulation persona id, or human-task for a workforce human task
        agentIdentity:
          oneOf:
            - $ref: "#/components/schemas/OnbAgent"
            - type: "null"
          description: Resolved current AI-agent identity; null for email assignments or unknown legacy ids
        teamRecipientLabel:
          type: string
          description: Human-readable team label; never an invented email address
        method:
          $ref: "#/components/schemas/OnbOperationalRequestMethod"
        status:
          $ref: "#/components/schemas/OnbOperationalRequestStatus"
        reference:
          type: string
          description: Simulation-local reference, or a HUMAN-TASK audit reference
        simulated:
          type: boolean
          description: False only for accountable human workforce tasks
        runtimeSchemaVersion:
          type: string
          enum: [workforce-step-runtime/v1]
        runtimeWorkstream:
          type: string
          enum: [intake, payroll, assets, learning]
        responsibleRole:
          type: string
        assignedTo:
          type: ["string", "null"]
        mandatory:
          type: boolean
        evidenceRequired:
          type: boolean
        nonblocking:
          type: boolean
        prerequisites:
          type: array
          items:
            type: string
        parallelGroup:
          type: ["string", "null"]
        permittedChannels:
          type: array
          items:
            type: string
            enum: [manager-led]
          description: Accountable-human evidence channel; no learning portal executor is registered.
        notBeforeAt:
          type: ["string", "null"]
          format: date-time
        dueAt:
          type: ["string", "null"]
          format: date-time
        escalation:
          oneOf:
            - $ref: "#/components/schemas/OnbWorkforceStepEscalation"
            - type: "null"
        overdue:
          type: boolean
          description: Computed from dueAt at read time; no external escalation is implied
        escalationRequired:
          type: boolean
          description: Computed from escalation.at at read time; an accountable human must act
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        blockedAt:
          type: ["string", "null"]
          format: date-time
        lastRetryAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
        failureReason:
          type: ["string", "null"]
        history:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OnbOperationalRequestHistoryEntry"
      required: [id, label, owner, agent, teamRecipientLabel, method, status, reference, simulated, requestedAt, startedAt, completedAt, blockedAt, lastRetryAt, updatedAt, failureReason, history]
    OnbOperationalRequestsEnvelope:
      type: object
      properties:
        caseId:
          type: integer
        version:
          type: integer
          minimum: 0
        simulated:
          type: boolean
          description: False when the case includes accountable human workforce tasks
        offlinePaused:
          type: boolean
          description: Synthetic offline samples remain read-only and never record actions
        requests:
          type: array
          items:
            $ref: "#/components/schemas/OnbOperationalRequest"
      required: [caseId, version, simulated, offlinePaused, requests]
    OnbOperationalRequestsInitialize:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        method:
          $ref: "#/components/schemas/OnbOperationalRequestMethod"
          default: agent
        requestIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        expectedVersion:
          type: integer
          minimum: 0
      additionalProperties: false
    OnbOperationalRequestAction:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: Client idempotency id; reuse only for the identical action payload
        action:
          type: string
          enum: [select-method, start, progress, complete, block, retry]
        method:
          $ref: "#/components/schemas/OnbOperationalRequestMethod"
        reason:
          type: string
          minLength: 3
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 0
      required: [requestId, action, expectedVersion]
      additionalProperties: false
    OnbOperationalRequestsMutationResult:
      allOf:
        - $ref: "#/components/schemas/OnbOperationalRequestsEnvelope"
        - type: object
          properties:
            requestId:
              type: ["string", "null"]
              description: Stable operational request id for actions; initialization echoes its client idempotency id
            action:
              type: ["string", "null"]
            idempotent:
              type: boolean
            continuationPending:
              type: boolean
              description: The task action committed, but a follow-up connector continuation is pending durable automatic retry.
            initializedRequestIds:
              type: array
              items:
                type: string
          required: [requestId, action, idempotent, initializedRequestIds]
    OnbWorkforceStepEscalation:
      type: object
      additionalProperties: false
      properties:
        at:
          type: string
          format: date-time
        responsibleRole:
          type: string
        assignedTo:
          type: ["string", "null"]
      required: [at, responsibleRole, assignedTo]
    OnbDocumentRecoveryResult:
      type: object
