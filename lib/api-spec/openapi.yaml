            schema: { $ref: "#/components/schemas/StandardOperationsStartDateInput" }
      responses:
        "200":
          description: Updated standard operations projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOperationsView" }
        "400":
          description: Invalid calendar date, expected version, or rationale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Organization owner or administrator required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "404":
          description: Case not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "409":
          description: Standard operations version or current-date conflict; no date or state was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/cases/{id}/standard-operations/start-date/impacts/{stream}/reconcile:
    post:
      operationId: reconcileOnboardingStandardOperationsStartDateImpact
      tags: [onboarding]
      summary: Reconcile one impact of a changed standard operations start date
      description: >
        Authenticated tenant route requiring an organization owner or
        administrator. `source-proof` is accepted only when current
        server-verified proof exists for the stream; otherwise an accountable
        `manual-resolution` is required. Either choice is status-only, grants
        no authority, and does not replace independent release evidence. A
        stale `expectedVersion` returns HTTP `409` without applying the
        reconciliation.
