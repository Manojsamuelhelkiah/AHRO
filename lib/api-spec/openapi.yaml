        createdBy:
          type: string
          description: Display name of the author resolved at write time.
        createdAt:
          type: string
          description: ISO 8601 creation timestamp.
      required: [id, effectiveDate, rationale, rates, createdBy, createdAt]
    PricingRateRegister:
      type: object
      description: The full pricing rate register — current snapshot and complete version history.
      properties:
        current:
          $ref: "#/components/schemas/PricingRateSetVersion"
          description: The current effective rate set (null when none exists yet).
          nullable: true
        versions:
          type: array
          description: All versions, newest first.
          items:
            $ref: "#/components/schemas/PricingRateSetVersion"
        canManage:
          type: boolean
          description: Whether the signed-in user may publish immutable global rate versions.
      required: [current, versions, canManage]
    PricingRateSetInput:
      type: object
      description: Body for creating a new pricing rate set version.
      properties:
        effectiveDate:
          type: string
          description: YYYY-MM-DD calendar date this version takes effect. May be in the future (scheduled).
        rationale:
          type: string
          description: Non-blank rationale explaining why this version was created.
        rates:
          type: object
          additionalProperties: true
          description: Complete pricing rate snapshot. All quote-critical keys are required; missing or unsafe values block save.
      required: [effectiveDate, rationale, rates]
    DemoScenarioChoice:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string }
        description: { type: string }
        expectedBehaviour: { type: string }
      required: [key, title, description, expectedBehaviour]
    DemoControllerVolunteer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Server-derived stable identifier; clients cannot use it to change volunteer records.
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        channelPreference:
          type: string
          enum: [email, whatsapp, both]
        approved:
          type: boolean
        liveEmailAvailable: { type: boolean }
        liveCallAvailable: { type: boolean }
        capabilityReason: { type: ["string", "null"] }
      required: [id, name, email, phone, channelPreference, approved, liveEmailAvailable, liveCallAvailable, capabilityReason]
    DemoControllerCapabilities:
      type: object
      additionalProperties: false
      properties:
        available: { type: boolean }
        reason: { type: ["string", "null"] }
        organizationId: { type: string }
        canCreateRuns: { type: boolean }
        canDispatchLive: { type: boolean }
        defaultMode:
          type: string
          enum: [hybrid]
        allowedSystems:
          type: array
          items:
            type: string
            enum: [bgv, hris, access, assets, payroll, learning]
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/DemoScenarioChoice" }
        approvedVolunteers:
          type: array
          items: { $ref: "#/components/schemas/DemoControllerVolunteer" }
        existingSessions:
          type: array
          items:
            $ref: "#/components/schemas/DemoRunSummary"
      required: [available, reason, organizationId, canCreateRuns, canDispatchLive, defaultMode, allowedSystems, scenarios, approvedVolunteers, existingSessions]
    DemoControllerSetupRequest:
      type: object
      additionalProperties: false
      properties:
        requestId: { type: string, minLength: 1 }
        approvalValue:
          type: string
          minLength: 64
          description: Opaque 256-bit value shown only to the authenticated requester.
        expiresAt: { type: string, format: date-time }
        approved: { type: boolean }
      required: [requestId, approvalValue, expiresAt, approved]
    DemoControllerSetupResponse:
      type: object
      additionalProperties: false
      properties:
        eligible: { type: boolean }
        reason: { type: ["string", "null"] }
        request:
          oneOf:
            - $ref: "#/components/schemas/DemoControllerSetupRequest"
            - type: "null"
        completed: { type: boolean }
      required: [eligible, reason, request, completed]
    CompleteDemoControllerSetupBody:
      type: object
      additionalProperties: false
      properties:
        requestId: { type: string, minLength: 1 }
      required: [requestId]
    DemoRunInput:
      type: object
      additionalProperties: false
      properties:
        scenario: { type: string, minLength: 1, maxLength: 80 }
        volunteerId:
          type: ["string", "null"]
          minLength: 1
          maxLength: 200
        mode:
          type: string
          enum: [hybrid]
          default: hybrid
      required: [scenario]
    DemoRunSummary:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string }
        caseId: { type: integer, minimum: 1 }
        caseName: { type: string }
        scenario: { type: string }
        status:
          type: string
          enum: [active, completed, blocked, restarted]
        version: { type: integer, minimum: 0 }
        mode:
          type: string
          enum: [hybrid]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        selectedVolunteerId: { type: ["string", "null"] }
      required: [runId, caseId, caseName, scenario, status, version, mode, createdAt, updatedAt, selectedVolunteerId]
    DemoWorkflowCheckpoint:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          enum: [offer, documents, bgv, systems, hr-approval, day1]
        status:
          type: string
          enum: [pending, completed, overridden, blocked]
        reason: { type: ["string", "null"] }
      required: [key, status, reason]
    DemoSystemState:
      type: object
      additionalProperties: false
      properties:
        system:
          type: string
          enum: [bgv, hris, access, assets, payroll, learning]
        status:
          type: string
          enum: [pending, complete, exception, overdue]
        outcome:
          type: ["string", "null"]
          enum: [pending, complete, exception, overdue, null]
        simulated: { type: boolean }
        updatedAt: { type: string, format: date-time }
        note: { type: ["string", "null"] }
      required: [system, status, outcome, simulated, updatedAt, note]
    DemoClock:
      type: object
      additionalProperties: false
      properties:
        now: { type: string, format: date-time }
        offsetHours: { type: integer, minimum: 0, maximum: 8760 }
      required: [now, offsetHours]
    DemoActivity:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        kind: { type: string }
        provenance:
          type: string
          enum: [simulated, live]
        message: { type: string }
        transcript: { type: ["string", "null"] }
        providerStatus: { type: ["string", "null"] }
      required: [id, at, actor, kind, provenance, message, transcript, providerStatus]
    DemoCaseMetadata:
      type: object
      additionalProperties: false
      properties:
        caseId: { type: integer, minimum: 1 }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string }
        department: { type: string }
        geography: { type: string }
        joiningDate: { type: string, format: date }
        offlineMarker: { type: string }
      required: [caseId, name, email, phone, role, department, geography, joiningDate, offlineMarker]
    DemoRun:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string }
        caseId: { type: integer, minimum: 1 }
        caseName: { type: string }
        scenario: { type: string }
        mode:
          type: string
          enum: [hybrid]
        status:
          type: string
          enum: [active, completed, blocked, restarted]
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        metadata: { $ref: "#/components/schemas/DemoCaseMetadata" }
        checkpoints:
          type: array
          items: { $ref: "#/components/schemas/DemoWorkflowCheckpoint" }
        systems:
          type: array
          items: { $ref: "#/components/schemas/DemoSystemState" }
        clock: { $ref: "#/components/schemas/DemoClock" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/DemoActivity" }
        liveCapabilityReason: { type: ["string", "null"] }
        selectedVolunteerId: { type: ["string", "null"] }
        selectedVolunteer:
          allOf:
            - $ref: "#/components/schemas/DemoControllerVolunteer"
          nullable: true
      required: [runId, caseId, caseName, scenario, mode, status, version, createdAt, updatedAt, metadata, checkpoints, systems, clock, activity, liveCapabilityReason, selectedVolunteerId, selectedVolunteer]
    DemoRunAction:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        requestId: { type: string, minLength: 36, maxLength: 36, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
        kind:
          type: string
          enum: [load-documents, system-outcome, advance-time, advance, override-step, communication, restart]
        system:
          type: ["string", "null"]
          enum: [bgv, hris, access, assets, payroll, learning, null]
        outcome:
          type: ["string", "null"]
          enum: [pending, complete, exception, overdue, null]
        step:
          type: ["string", "null"]
          enum: [offer, documents, bgv, systems, hr-approval, day1, null]
        reason: { type: ["string", "null"], maxLength: 1000 }
        hours:
          type: ["integer", "null"]
          minimum: 0
          maximum: 8760
        channel:
          type: ["string", "null"]
          enum: [email, call, null]
        mode:
          type: ["string", "null"]
          enum: [live, simulated, null]
        liveConfirmation:
          type: ["string", "null"]
          enum: [I_UNDERSTAND_LIVE_DEMO, null]
      required: [expectedVersion, requestId, kind]
