        "404":
          description: Case not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: UAT-isolated case denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /onboarding/cases/{caseId}/simulation/simulate-next:
    post:
      operationId: simulateNextOnboardingCaseExchange
      tags: [onboarding]
      summary: Persist one bounded randomized simulation exchange
      description: >
        Advances exactly one simulated exchange through offer, documents, BGV,
        payroll, access, readiness, and final simulated HR review. The sampled
        outcome is server-owned; requestId retries replay the original sampled
        result. expectedGenerationId and expectedVersion prevent stale writes.
        No real recipient, readiness mutation, provider call, or outbound
        delivery is performed.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateNextOnboardingCaseExchangeInput"
      responses:
        "200":
          description: Updated simulation state and the persisted exchange
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCaseSimulationState"
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: Demo Administrator, membership, or synthetic-case boundary denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Case not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: Stale generation/version, reused requestId, completed simulation, or UAT-isolated case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /onboarding/cases/{caseId}/simulation/restart:
    post:
      operationId: restartOnboardingCaseSimulation
      tags: [onboarding]
      summary: Explicitly restart an eligible synthetic case simulation
      description: >
        Retires the current response-driven simulation generation and starts a
        new generation at offer with version 0. The prior simulated exchanges
        remain in the append-only Communications and case timeline audit
        history. The operation is available only to the current registered Demo
        Administrator for an eligible server-marked synthetic case outside UAT.
        Generation and version preconditions fence stale requests, and requestId
        retries replay the restart result. No case, provider, UAT, recipient, or
        authoritative readiness state is changed.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartOnboardingCaseSimulationBody"
      responses:
        "200":
          description: New simulation generation at version 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCaseSimulationState"
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "403":
          description: Demo Administrator, membership, or synthetic-case boundary denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Case not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: Stale generation/version, reused requestId, or UAT-isolated case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
