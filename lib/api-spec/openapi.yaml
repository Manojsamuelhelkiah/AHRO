        caseId: { type: integer }
        version: { type: integer, minimum: 1 }
        config: { $ref: "#/components/schemas/BgvNotificationConfig" }
        authority: { $ref: "#/components/schemas/BgvNotificationAuthority" }
        effectiveFlags: { $ref: "#/components/schemas/BgvNotificationFlags" }
        currentCycle:
          anyOf:
            - $ref: "#/components/schemas/BgvNotificationCycle"
