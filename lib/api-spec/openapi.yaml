        lastErrorAt:
          type: [string, "null"]
          format: date-time
      required: [state, healthy, lastAttemptAt, lastSuccessAt, expiredSessions, retainedLinksDeleted, consecutiveFailures, lastErrorAt]
    UpdateOnbSettings:
      type: object
      properties:
        hrAlertEmail:
          type: string
          nullable: true
