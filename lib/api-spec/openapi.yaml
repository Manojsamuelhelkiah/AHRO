                  properties:
                    total: { type: integer, minimum: 0 }
                    passed: { type: integer, minimum: 0 }
                    failed: { type: integer, minimum: 0 }
                    manual: { type: integer, minimum: 0 }
                  required: [total, passed, failed, manual]
              required: [runId, scenarioId, family, providerMode, decisions, summary]
            cleanupNotice: { type: string }
            candidatePortal: { $ref: "#/components/schemas/OnboardingUatCandidatePortal" }
          required: [fixtureVersion, fixtureSeed, baselineRevision, mode, clock, linkedCaseIds, syntheticProfile, scannerFacts, initialization, steps, evidence, exchanges, pendingEvents, cleanupNotice]
