    BgvNotificationClassification:
      type: string
      enum: [delay, missing-info, discrepancy, review-required]
    BgvNotificationRole:
      type: string
      enum: [hr, bgvTeam, recruiter, hiringManager, compliance, candidate]
    BgvNotificationDeliveryState:
      type: string
      enum: [missing-recipient, queued, sent, failed, uncertain, simulated, skipped]
    BgvNotificationFlags:
      type: object
      properties:
        delay: { type: boolean }
        missingInfo: { type: boolean }
        discrepancy: { type: boolean }
        reviewRequired: { type: boolean }
        candidateActionRequired: { type: boolean }
        providerActionRequired: { type: boolean }
        startDateAtRisk: { type: boolean }
        coordinationRequired: { type: boolean }
        dependentWorkOnHold: { type: boolean }
      required: [delay, missingInfo, discrepancy, reviewRequired, candidateActionRequired, providerActionRequired, startDateAtRisk, coordinationRequired, dependentWorkOnHold]
    BgvNotificationRecipientConfig:
