          additionalProperties: false
          properties:
            profileId: { type: string }
            profileName: { type: string }
            currentProfileVersion: { type: integer }
            exactCohortVerifiedOutcomes: { type: integer, minimum: 0 }
          required: [profileId, profileName, currentProfileVersion, exactCohortVerifiedOutcomes]
        cohortDefinition: { type: string }
        compatibilityDefinition: { type: string }
        outcomeDefinition: { type: string }
        window:
          type: object
          additionalProperties: false
          properties:
            startedAt: { type: string, format: date-time }
            endedAt: { type: string, format: date-time }
            days: { type: integer }
          required: [startedAt, endedAt, days]
        sample:
