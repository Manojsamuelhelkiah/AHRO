          additionalProperties: false
          properties:
            candidateCases: { type: integer, minimum: 0 }
            verifiedOutcomes: { type: integer, minimum: 0 }
            excludedDemoOrSimulation: { type: integer, minimum: 0 }
            missingOutcomeEvidence: { type: integer, minimum: 0 }
          required: [candidateCases, verifiedOutcomes, excludedDemoOrSimulation, missingOutcomeEvidence]
        outcome:
          type: object
          additionalProperties: false
          properties:
            meanDaysToVerifiedReadiness: { type: [number, "null"] }
