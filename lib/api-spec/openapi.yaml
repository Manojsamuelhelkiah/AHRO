          description: bgv | itsm | payroll
        label:
          type: string
        mode:
          type: string
          description: push (vendor webhook) | poll (scheduled API polling)
        connectorKey:
          type: string
          description: onb_connectors row this health is tied to
        pollIntervalSeconds:
          type: ["integer", "null"]
          description: Null for push-mode systems
        running:
          type: boolean
        state:
          type: string
          description: healthy | initializing | broken | stopped
        healthy:
          type: boolean
        lastPollAt:
          type: ["string", "null"]
        lastSuccessAt:
          type: ["string", "null"]
        lastEventAt:
          type: ["string", "null"]
          description: Push mode — when the last vendor webhook arrived
        eventsReceived:
          type: integer
        lastError:
          type: ["string", "null"]
        lastErrorAt:
          type: ["string", "null"]
      required: [key, label, mode, connectorKey, pollIntervalSeconds, running, state, healthy, lastPollAt, lastSuccessAt, lastEventAt, eventsReceived, lastError, lastErrorAt]
    OnbSystemCheck:
