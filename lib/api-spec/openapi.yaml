openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: corpus
    description: HRO intent corpus and reference data
  - name: scenarios
    description: Client scenarios and cost-benefit roll-ups
  - name: actuals
    description: Calibration actuals overlays (measured production data)
  - name: customIntents
    description: Client-specific intents that extend the reference corpus
  - name: onboarding
    description: Orchestrated multi-agent onboarding POC (cases, agents, approvals, channels, connectors, analytics)
  - name: pricingRateSets
    description: Immutable versioned pricing rate register for quote-critical Azure, AI, implementation, and support unit rates
  - name: enterpriseArchitecture
    description: Owner-scoped enterprise architecture assessments and reusable solution baseline
  - name: demoController
    description: Isolated, synthetic onboarding demonstrations with explicit simulated or approved live communications
  - name: demoControllerSetup
    description: One-time, operator-approved Demo Controller bootstrap for a member-only Demo Organization
paths:
  /organizations/demo-controller-setup:
    get:
      operationId: getDemoControllerSetupStatus
      tags: [demoControllerSetup]
      summary: Get the authenticated member's Demo Controller setup status
      description: Returns only the authenticated Demo Organization member's own active setup request. The operator approval authority is a deployment secret and is never returned or logged.
      responses:
        "200":
          description: Setup status
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
            Pragma:
              schema: { type: string, const: "no-cache" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerSetupResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Demo Organization scope or membership required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /organizations/demo-controller-setup/request:
    post:
      operationId: requestDemoControllerSetup
      tags: [demoControllerSetup]
      summary: Request a one-time Demo Controller setup approval
      description: Issues or reuses the authenticated member's active 24-hour request. The returned opaque value must be provided privately to the deployment operator, who sets DEMO_CONTROLLER_SETUP_APPROVAL to that exact value.
      responses:
        "200":
          description: Active setup request
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
            Pragma:
              schema: { type: string, const: "no-cache" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerSetupResponse"
        "400":
          description: Strict request-body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Demo member required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: An existing Demo Controller or one-time grant prevents bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /organizations/demo-controller-setup/complete:
    post:
      operationId: completeDemoControllerSetup
      tags: [demoControllerSetup]
      summary: Complete the authenticated member's operator-approved setup
      description: Atomically consumes the exact request and grants Demo Organization admin only while no owner/admin exists. The durable grant is one-time per Demo Organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDemoControllerSetupBody"
      responses:
        "200":
          description: Setup completed
          headers:
            Cache-Control:
              schema: { type: string, const: "no-store" }
            Pragma:
              schema: { type: string, const: "no-cache" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerSetupResponse"
        "400":
          description: Strict request-body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Demo member or current operator approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Expired, consumed, stale, or no-longer-eligible request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-controller:
    get:
      operationId: getOnboardingDemoController
      tags: [demoController]
      summary: Get demo-controller capabilities and available scenarios
      description: Returns the capability boundary for the selected tenant. Every authenticated Demo Organization member may create or mutate synthetic demo runs, including demo overrides. Authentication, tenant isolation, and approved-volunteer communication safeguards still apply.
      responses:
        "200":
          description: Demo-controller capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoControllerCapabilities"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs:
    post:
      operationId: createOnboardingDemoRun
      tags: [demoController]
      summary: Create a fresh synthetic onboarding demonstration run
      description: Creates a new run-owned synthetic case. The case remains blocked from ordinary orchestration and outbound automation; mode defaults to hybrid and never enables HRIS, access, assets, payroll, or learning connectors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRunInput"
      responses:
        "201":
          description: Created demonstration run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRun"
        "403":
          description: Authenticated Demo Organization membership required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    get:
      operationId: getOnboardingDemoRun
      tags: [demoController]
      summary: Get a demonstration run
      responses:
        "200":
          description: Demonstration run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs/{runId}/actions:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    post:
      operationId: applyOnboardingDemoRunAction
      tags: [demoController]
      summary: Apply one optimistic-versioned action to a demonstration run
      description: Every action is explicitly requested, UUID-idempotent, and scoped to its run. Provider calls, if explicitly authorized, happen outside the database transaction after a durable claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRunAction"
      responses:
        "200":
          description: Updated demonstration run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRun"
        "400":
          description: Invalid action or unsafe live request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Stale version or duplicate action with a different payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/demo-runs/{runId}/documents:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    get:
      operationId: downloadOnboardingDemoRunDocuments
      tags: [demoController]
      summary: Download a watermarked synthetic documentation pack
      description: Generates a plain-text synthetic pack from run metadata. No document bytes are persisted.
      responses:
        "200":
          description: Synthetic documentation pack
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /enterprise-architecture/baseline:
    get:
      operationId: getEnterpriseArchitectureBaseline
      tags: [enterpriseArchitecture]
      summary: Derive the reusable solution baseline from the current corpus
      responses:
        "200":
          description: Reusable architecture baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaSolutionBaseline"
  /enterprise-architecture/assessments:
    get:
      operationId: listEaAssessments
      tags: [enterpriseArchitecture]
      summary: List assessments owned by the signed-in user
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EaAssessmentStatus"
      responses:
        "200":
          description: Assessment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EaAssessment"
    post:
      operationId: createEaAssessment
      tags: [enterpriseArchitecture]
      summary: Create an owned assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaAssessmentInput"
      responses:
        "201":
          description: Created assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaAssessment"
  /enterprise-architecture/assessments/{id}:
    parameters:
      - $ref: "#/components/parameters/EaAssessmentId"
    get:
      operationId: getEaAssessment
      tags: [enterpriseArchitecture]
      summary: Get an owned assessment
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaAssessment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateEaAssessment
      tags: [enterpriseArchitecture]
      summary: Update an owned assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaAssessmentUpdate"
      responses:
        "200":
          description: Updated assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaAssessment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Assessment is archived or has been modified by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteEaAssessment
      tags: [enterpriseArchitecture]
      summary: Permanently delete an owned assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaDeleteRequest"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Archived assessments are retained and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /enterprise-architecture/assessments/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/EaAssessmentId"
    post:
      operationId: archiveEaAssessment
      tags: [enterpriseArchitecture]
      summary: Archive an owned assessment
      description: >
        Archives an active assessment when expectedVersion matches. Calling this
        operation for an already archived assessment is idempotent and returns
        the current archived row even when the supplied expectedVersion is older;
        stale expectedVersion is rejected only while the assessment is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaArchiveRequest"
      responses:
        "200":
          description: Newly archived assessment, or the current row when already archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaAssessment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Assessment has been modified since it was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /enterprise-architecture/assessments/{id}/handoff:
    parameters:
      - $ref: "#/components/parameters/EaAssessmentId"
    post:
      operationId: createEaAssessmentHandoff
      tags: [enterpriseArchitecture]
      summary: Derive reviewable scenario and product-pricing scope suggestions
      description: Returns suggestions only; the existing scenario and pricing engines remain authoritative.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EaHandoffRequest"
      responses:
        "200":
          description: Reviewable handoff suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EaHandoffSuggestion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Assessment is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /intents:
    get:
      operationId: listIntents
      tags: [corpus]
      summary: List all HRO intents in the corpus
      responses:
        "200":
          description: Intent corpus, including custom-storage availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentCorpus"
  /flow-classes:
    get:
      operationId: listFlowClasses
      tags: [corpus]
      summary: List flow-class templates with their steps, costs and benefits
      responses:
        "200":
          description: Flow class list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowClass"
  /systems:
    get:
      operationId: listSystems
      tags: [corpus]
      summary: List modeled HR systems of record
      responses:
        "200":
          description: System list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemInfo"
  /profiles:
    get:
      operationId: listDistributionProfiles
      tags: [corpus]
      summary: List sector/size distribution profiles used to allocate transactions across intents
      responses:
        "200":
          description: Profile list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributionProfile"
  /assumptions:
    get:
      operationId: listAssumptions
      tags: [corpus]
      summary: List global default assumptions (rates, token prices, infra allocations)
      responses:
        "200":
          description: Assumption list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlobalAssumption"
  /summary:
    get:
      operationId: getCorpusSummary
      tags: [corpus]
      summary: Corpus dashboard summary (counts by domain, flow class, sources)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusSummary"
  /summary/routing:
    get:
      operationId: getRoutingSummary
      tags: [corpus]
      summary: Reconcile cost-model and routing-registry taxonomy counts
      responses:
        "200":
          description: Routing taxonomy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingSummary"
  /intent-registry:
    get:
      operationId: getIntentRegistry
      tags: [intentRegistry]
      summary: Get the versioned HRO outcome routing contract
      responses:
        "200":
          description: Versioned registry with separately counted taxonomy classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentRegistry"
  /intent-registry/resolve:
    post:
      operationId: resolveIntentRoute
      tags: [intentRegistry]
      summary: Resolve a canonical outcome or approved exact alias to one executable route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIntentRouteInput"
      responses:
        "200":
          description: Resolved executable route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedIntentRoute"
        "404":
          description: Unknown outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentRouteError"
        "409":
          description: Retired, ambiguous, or wrong-version outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentRouteError"
        "422":
          description: Known outcome without a registered executable route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentRouteError"
  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List saved client scenarios
      responses:
        "200":
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a client scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateScenario
      tags: [scenarios]
      summary: Update a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /scenario-files/upload-intents:
    post:
      operationId: createScenarioFileUploadIntent
      tags: [scenarios]
      summary: Create a one-time authenticated API upload intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioFileUploadRequest"
      responses:
        "200":
          description: Two-minute, one-time authenticated API upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioFileUploadIntent"
        "400":
          description: Unsupported file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Authentication required
        "429":
          description: Per-owner pending upload count or byte quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /scenario-files/upload-intents/{intentId}/content:
    put:
      operationId: uploadScenarioFileContent
      tags: [scenarios]
      summary: Upload bytes through a one-time authenticated intent
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Bytes uploaded and intent ready to finalize
        "400":
          description: Content length did not match the declaration
        "401":
          description: Authentication required
        "409":
          description: Intent expired, already used, or currently in progress
        "413":
          description: Uploaded body exceeded the hard file-size limit
        "415":
          description: Upload transport must use application/octet-stream
  /scenario-files/finalize:
    post:
      operationId: finalizeScenarioFile
      tags: [scenarios]
      summary: Validate an uploaded object and create its private metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioFileFinalizeRequest"
      responses:
        "201":
          description: Upload finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioFile"
        "400":
          description: Object metadata or content failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Scenario, replacement, or uploaded object not found
        "409":
          description: Upload intent expired, was already finalized, or did not match its declaration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /scenarios/{id}/files:
    get:
      operationId: listScenarioFiles
      tags: [scenarios]
      summary: List private files belonging to an owned scenario
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Scenario file list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioFile"
        "404":
          description: Scenario not found
  /scenario-files/{id}/download:
    get:
      operationId: downloadScenarioFile
      tags: [scenarios]
      summary: Stream a private scenario file after owner authorization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: File not found
  /scenario-files/{id}:
    delete:
      operationId: deleteScenarioFile
      tags: [scenarios]
      summary: Remove a private scenario file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "404":
          description: File not found
  /pricing-sheets:
    get:
      operationId: listPricingSheets
      tags: [pricingSheets]
      summary: List saved product pricing sheets
      responses:
        "200":
          description: Pricing sheet list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingSheet"
    post:
      operationId: createPricingSheet
      tags: [pricingSheets]
      summary: Save a product pricing sheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingSheetInput"
      responses:
        "201":
          description: Created
