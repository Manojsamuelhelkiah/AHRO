          required: [meanDaysToVerifiedReadiness, uncertainty95PercentDays, observedOutcomeDates, caseReferences]
        missingness:
          type: array
          items: { type: string }
        uncertainty: { type: string }
      required: [scope, status, notEligibleForPublication, target, cohortDefinition, compatibilityDefinition, outcomeDefinition, window, sample, outcome, missingness, uncertainty]
    OnbPolicyRecommendationFallback:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, const: insufficient-evidence }
        message: { type: string }
        candidateCases: { type: integer, minimum: 0 }
        verifiedOutcomes: { type: integer, minimum: 0 }
        excludedDemoOrSimulation: { type: integer, minimum: 0 }
        missingOutcomeEvidence: { type: integer, minimum: 0 }
        broaderEvidence:
          type: array
          items:
            $ref: "#/components/schemas/OnbBroaderCompatibleCohortEvidence"
      required: [status, message, candidateCases, verifiedOutcomes, excludedDemoOrSimulation, missingOutcomeEvidence, broaderEvidence]
    OnbPolicyRecommendationList:
      type: object
      additionalProperties: true
      description: Each persisted recommendation preserves its full proposal and evidence snapshot. Evidence is cohort-scoped, excludes demo/simulation, reports missingness and uncertainty, and is descriptive rather than causal.
      properties:
        asOf: { type: string, format: date-time }
        methodologyVersion: { type: string, const: learning-cohort-v1 }
        window:
          type: object
          properties:
            startedAt: { type: string, format: date-time }
            endedAt: { type: string, format: date-time }
            days: { type: integer }
          required: [startedAt, endedAt, days]
        recommendations:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: integer }
              status: { type: string, enum: [proposed, accepted, rejected] }
              recommendation:
                type: object
                additionalProperties: true
                properties:
                  type: { type: string, const: cohort-learning-default }
                  learning: { $ref: "#/components/schemas/OnbLearningPolicy" }
              evidenceSnapshot:
                type: object
                additionalProperties: true
                properties:
                  evidenceFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
              createdAt: { type: string, format: date-time }
            required: [id, status, recommendation, evidenceSnapshot, createdAt]
        fallback:
          type: ["object", "null"]
          allOf:
            - $ref: "#/components/schemas/OnbPolicyRecommendationFallback"
      required: [asOf, methodologyVersion, window, recommendations, fallback]
    OnbChecklistItemStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, pending]
        note:
          type: ["string", "null"]
          maxLength: 500
      required: [status]
    OnbEvidenceVerificationInput:
      type: object
      additionalProperties: false
      properties:
        evidenceReference: { type: string, minLength: 3, maxLength: 500 }
        authorityRole: { type: string, minLength: 2, maxLength: 80 }
        decision: { type: string, enum: [verified, rejected] }
        reason: { type: string, minLength: 3, maxLength: 500 }
        expectedPolicy:
          type: object
          additionalProperties: false
          description: Exact case policy provenance the server locks and compares before recording independently verified evidence.
          properties:
            contextVersion: { type: integer, minimum: 0 }
            templateVersion: { type: integer, minimum: 0 }
            profileId: { type: string, minLength: 1 }
            profileVersion: { type: integer, minimum: 0 }
          required: [contextVersion, templateVersion, profileId, profileVersion]
      required: [evidenceReference, authorityRole, decision, reason, expectedPolicy]
    OnbWorkforceContextCorrectionInput:
      type: object
      additionalProperties: false
      properties:
        workforceContext: { $ref: "#/components/schemas/OnbWorkforceContext" }
        expectedUpdatedAt: { type: string, format: date-time }
        reason: { type: string, minLength: 3, maxLength: 500 }
      required: [workforceContext, expectedUpdatedAt, reason]
    OnbWorkstream:
      type: object
      description: A parallel readiness workstream owned by one agent
      properties:
        key:
          type: string
          description: documentation | access | assets | learning | analytics
        label:
          type: string
        agent:
          type: string
        status:
          type: string
          description: pending | in-progress | blocked | ready | exception
        owner:
          type: string
          description: Accountable human owner
        blockers:
          type: array
          items:
            type: string
      required: [key, label, agent, status, owner, blockers]
    OnbWorkforceContext:
      type: object
      additionalProperties: false
      description: Work and operating context only. Accessibility, language and assisted-intake preferences are collected explicitly and never inferred from a workforce indicator.
      properties:
        roleFamily: { type: string, maxLength: 120 }
        band: { type: string, maxLength: 120 }
        department: { type: string, maxLength: 120 }
        legalEntity: { type: string, maxLength: 120 }
        businessUnit: { type: string, maxLength: 120 }
        industry: { type: string, maxLength: 120 }
        workCountry: { type: string, maxLength: 120 }
        workState: { type: string, maxLength: 120 }
        site: { type: string, maxLength: 120 }
        employmentArrangement: { type: string, maxLength: 120 }
        workerCategory: { type: string, maxLength: 120 }
        payBasis: { type: string, maxLength: 120 }
        shiftPattern: { type: string, maxLength: 120 }
        workEnvironment: { type: string, enum: [office, remote, site, field, mixed] }
        hazards: { type: array, maxItems: 30, items: { type: string, maxLength: 120 } }
        requiredLicenses: { type: array, maxItems: 30, items: { type: string, maxLength: 120 } }
        hiringMode: { type: string, enum: [individual, batch, seasonal] }
        batchId: { type: string, maxLength: 120 }
        assistedIntake: { type: boolean }
        accessibilityNeeds: { type: string, maxLength: 500 }
        languagePreference: { type: string, maxLength: 120 }
        siteExposure: { type: boolean }
        safetyCritical: { type: boolean }
    OnbWorkforceClassification:
      type: object
      additionalProperties: false
      description: Explainable job classification; it describes the job, never the person.
      properties:
        label: { type: string, enum: [white-collar, blue-collar-frontline, mixed, needs-review] }
        source: { type: string, enum: [deterministic-job-context, authorized-correction] }
        rationale: { type: string }
        confidence: { type: string, enum: [high, medium, uncertain] }
      required: [label, source, rationale, confidence]
    OnbCase:
      type: object
      properties:
        id:
          type: integer
        workerName:
          type: string
        workerEmail:
          type: string
        workerPhone:
          type: ["string", "null"]
          description: E.164 phone for WhatsApp; null when not provided
        channelPreference:
          type: string
          enum: [email, whatsapp, both]
          description: HR-selected contact channel(s) for this new hire
        hireType:
          type: string
          description: external-fte | contractor | rehire | internal-transfer | campus-cohort | expedited
        workerCategory:
          type: string
          description: employee | contractor | vendor | intern
        workerBand:
          type: ["string", "null"]
          description: Employee band used for exact targeted checklist matching
        role:
          type: string
        department:
          type: string
        geography:
          type: string
          description: Country/region driving statutory items (e.g. India, USA, UK)
        legalEntity:
          type: string
        managerName:
          type: string
        recruiterName:
          type: string
        joiningDate:
          type: string
          description: ISO date
        urgency:
          type: string
          description: standard | elevated
        lifecycleStage:
          type: string
          description: trigger-received | profile-validated | plan-generated | preboarding | day1-review | early-enablement | exception | complete | paused
        orchestrationStatus:
          type: string
          description: running | waiting-approval | checklist-blocked | blocked | idle | done
        readiness:
          type: array
          items:
            $ref: "#/components/schemas/OnbReadinessItem"
        workstreams:
          type: array
          items:
            $ref: "#/components/schemas/OnbWorkstream"
        primarySkill:
          type: ["string", "null"]
        skillCriticality:
          type: ["string", "null"]
          description: standard | scarce | client-critical
        scenarioKey:
          type: ["string", "null"]
          description: Demo scenario this case came from, if any
        offlineSample:
          type: boolean
          description: Server-derived marker for a provider-isolated offline Demo sample
        fictionalOfflineIdentity:
          type: boolean
          description: Case-scoped identity projection is synthetic and does not represent sensitive-record authority
        hybridDemoSimulation:
          type: boolean
          description: Server-verified volunteer-backed Demo Controller run is eligible for simulation; never grants sensitive-record authority
        planSummary:
          type: ["string", "null"]
          description: LLM-generated onboarding plan narrative
        checklistTemplateVersion:
          type: integer
          minimum: 1
        checklistSnapshot:
          type: array
          items:
            $ref: "#/components/schemas/OnbChecklistTemplateItem"
        checklistProfileId:
          type: string
        checklistProfileName:
          type: string
        checklistProfileVersion:
          type: integer
          minimum: 1
        checklistMatchedCriteria:
          $ref: "#/components/schemas/OnbChecklistProfileCriteria"
        checklistMatchExplanation:
          type: string
        workforceContext:
          $ref: "#/components/schemas/OnbWorkforceContext"
        workforceClassification:
          oneOf:
            - $ref: "#/components/schemas/OnbWorkforceClassification"
            - type: "null"
        workforceContextVersion: { type: integer, minimum: 1 }
        processPolicySnapshot:
          type: object
          additionalProperties: true
        jobProfileId: { type: ["string", "null"] }
        jobProfileVersion: { type: ["integer", "null"] }
        orchestrationCheckpoint:
          type: ["string", "null"]
          description: Last completed orchestration boundary, or the exact checklist gate currently blocking the case
        candidateEmailAuthorized:
          type: boolean
          description: Whether this manually-created case currently authorizes live email to its candidate record address
        offerAcceptanceComplete:
          type: boolean
          description: HR-confirmed offer-acceptance package completion. False is not evidence of acceptance for legacy or active cases.
        offerAcceptanceCompletedAt:
          type: ["string", "null"]
          format: date-time
        offerAcceptanceCompletedBy:
          type: ["string", "null"]
        gateways:
          type: object
          description: Server-derived live onboarding gate status; human-review always denotes a real human queue item.
          properties:
            a: { $ref: "#/components/schemas/OnbGateway" }
            b: { $ref: "#/components/schemas/OnbGateway" }
            c: { $ref: "#/components/schemas/OnbGateway" }
          required: [a, b, c]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - workerName
        - workerEmail
        - workerPhone
        - channelPreference
        - hireType
        - workerCategory
        - workerBand
        - role
        - department
        - geography
        - legalEntity
        - managerName
        - recruiterName
        - joiningDate
        - urgency
        - lifecycleStage
        - orchestrationStatus
        - readiness
        - workstreams
        - primarySkill
        - skillCriticality
        - scenarioKey
        - offlineSample
        - fictionalOfflineIdentity
        - planSummary
        - checklistTemplateVersion
        - checklistSnapshot
        - checklistProfileId
        - checklistProfileName
        - checklistProfileVersion
        - checklistMatchedCriteria
        - checklistMatchExplanation
        - workforceContext
        - workforceClassification
        - workforceContextVersion
        - processPolicySnapshot
        - jobProfileId
        - jobProfileVersion
        - orchestrationCheckpoint
        - candidateEmailAuthorized
        - offerAcceptanceComplete
        - offerAcceptanceCompletedAt
        - offerAcceptanceCompletedBy
        - gateways
        - createdAt
        - updatedAt
    OnbCaseExplanationInput:
      type: object
      description: A bounded question and untrusted in-memory conversation context; history is never evidence.
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/OnbCaseExplanationHistoryEntry"
      required: [question]
    OnbCaseExplanationHistoryEntry:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required: [role, content]
    OnbCaseExplanationParagraph:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1500
        sourceIds:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 160
        kind:
          type: string
          enum: [supported, not-recorded]
      required: [text, sourceIds, kind]
    OnbCaseExplanationSource:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 240
        excerpt:
          type: string
          minLength: 1
          maxLength: 1000
        occurredAt:
          type: ["string", "null"]
          format: date-time
        tab:
          type: string
          enum: [overview, activity, communications, documents, approvals]
      required: [id, kind, title, excerpt, occurredAt, tab]
    OnbCaseExplanation:
      type: object
      properties:
        asOf:
          type: string
          format: date-time
        paragraphs:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/OnbCaseExplanationParagraph"
        sources:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OnbCaseExplanationSource"
        limitations:
          type: array
          items:
            type: string
            maxLength: 500
        truncated:
          type: boolean
      required: [asOf, paragraphs, sources, limitations, truncated]
    OnbGateway:
      type: object
      properties:
        status:
          type: string
          enum: [complete, blocked, pending, human-review, not-applicable]
        label:
          type: string
        reason:
          type: string
      required: [status, label, reason]
    OnbOfferAcceptanceConfirmation:
      type: object
      properties:
        note:
          type: string
          minLength: 1
      required: [note]
    OnbCaseIntake:
      type: object
      description: Manual onboarding trigger (intake form). The Intake Agent classifies and routes it.
      properties:
        workerName:
          type: string
          minLength: 1
        workerEmail:
          type: string
        workerPhone:
          type: string
          description: Optional E.164 phone used for WhatsApp
        channelPreference:
          type: string
          enum: [email, whatsapp, both]
          description: How the new hire should be contacted (defaults to both)
        hireType:
          type: string
        workerCategory:
          type: string
        workerBand:
          type: string
          description: Optional employee band used for targeted checklist matching
        role:
          type: string
        department:
          type: string
        geography:
          type: string
        legalEntity:
          type: string
        managerName:
          type: string
        recruiterName:
          type: string
        joiningDate:
          type: string
        primarySkill:
          type: string
        skillCriticality:
          type: string
        notes:
          type: string
          description: Unstructured recruiter notes; treated as evidence, not instructions
        offerAcceptanceComplete:
          type: boolean
          default: false
          description: Must be false at creation. Offer acceptance is released only after creation through the dedicated authority-bound Gate A confirmation endpoint.
        workforceContext:
          $ref: "#/components/schemas/OnbWorkforceContext"
        jobProfileId:
          type: string
          minLength: 1
      required:
        - workerName
        - workerEmail
        - hireType
        - workerCategory
        - role
        - department
        - geography
        - legalEntity
        - managerName
        - recruiterName
        - joiningDate
    DemoVolunteer:
      type: object
      description: One demo participant; email/phone become live-delivery targets when valid
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          description: International format (+919876543210) or empty for email-only
        channelPreference:
          type: string
          description: email | whatsapp | both
        persona:
          type: string
          description: Scenario key the volunteer role-plays, or "custom"
        role:
          type: string
        department:
          type: string
        geography:
          type: string
        hireType:
          type: string
        workerCategory:
          type: string
        managerName:
          type: string
        recruiterName:
          type: string
        joiningDate:
          type: string
          description: YYYY-MM-DD
        notes:
          type: string
      required: [name, email, phone, channelPreference, persona, role, department, geography, hireType, workerCategory, managerName, recruiterName, joiningDate, notes]
    DemoPersona:
      type: object
      description: A demo role a volunteer can play, with a plain-language briefing
      properties:
        key:
          type: string
        title:
          type: string
        description:
          type: string
        expectedBehaviour:
          type: string
        volunteerBrief:
          type: string
          description: What the volunteer should do and which messages to expect
      required: [key, title, description, expectedBehaviour, volunteerBrief]
    DemoVolunteerList:
      type: object
      properties:
        volunteers:
          type: array
          items:
            $ref: "#/components/schemas/DemoVolunteer"
      required: [volunteers]
    GuardrailCategory:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        blurb:
          type: string
      required: [key, title, blurb]
    GuardrailEval:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          description: automated-test | live-verified | deterministic-rule
      required: [name, kind]
    Guardrail:
      type: object
      description: One enforced security/safety control, with live activation stats
      properties:
        key:
          type: string
        title:
          type: string
        category:
          type: string
        severity:
          type: string
          description: low | medium | high | critical
        threat:
          type: string
        mechanism:
          type: string
        onViolation:
          type: string
        enforcedAt:
          type: array
          items:
            type: string
        evals:
          type: array
          items:
            $ref: "#/components/schemas/GuardrailEval"
        activationCount:
          type: integer
        lastActivatedAt:
          type: ["string", "null"]
      required: [key, title, category, severity, threat, mechanism, onViolation, enforcedAt, evals, activationCount, lastActivatedAt]
    GuardrailEvent:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: ["integer", "null"]
        action:
          type: string
          description: blocked | sanitized | rate-limited | escalated | rejected
        detail:
          type: string
        createdAt:
          type: string
        workerName:
          type: ["string", "null"]
      required: [id, caseId, action, detail, createdAt, workerName]
    SecurityDrillStep:
      type: object
      properties:
        step:
          type: string
        guardrailKey:
          type: string
        attack:
          type: string
        outcome:
          type: string
      required: [step, guardrailKey, attack, outcome]
    SecurityDrillResult:
      type: object
      properties:
        caseId:
          type: integer
        created:
          type: boolean
          description: True when this run created the drill case (first run)
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SecurityDrillStep"
      required: [caseId, created, steps]
    OnbDocument:
      type: object
      description: One item of a case's documentation pack (identity/statutory/contract/policy)
      properties:
        id:
          type: integer
        caseId:
          type: integer
        key:
          type: string
        label:
          type: string
        category:
          type: string
          enum: [identity, statutory, contract, policy]
        status:
          type: string
          enum: [pending, received, verified]
        required:
          type: boolean
        note:
          type: ["string", "null"]
        updatedAt:
          type: string
        reminderCount:
          type: integer
        lastReminderAt:
          type: ["string", "null"]
        reminderNextAt:
          type: ["string", "null"]
      required: [id, caseId, key, label, category, status, required, note, updatedAt, reminderCount, lastReminderAt, reminderNextAt]
    OnbDocumentEvidence:
      type: object
      properties:
        id: { type: integer }
        documentId: { type: integer }
        originalName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        fingerprint: { type: ["string", "null"] }
        label: { type: string }
        category: { type: string }
        required: { type: boolean }
        reminderCount: { type: integer }
        reminderNextAt: { type: ["string", "null"], format: date-time }
        validationState:
          type: string
          enum: [queued, processing, passed, manual_review, correction_requested, rejected]
        validationReasons:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              evidence: { type: string }
            required: [code, message]
        validationStartedAt: { type: ["string", "null"], format: date-time }
        validatedAt: { type: ["string", "null"], format: date-time }
        malwareScanState:
          type: string
          enum: [pending, scanning, clean, infected, unavailable, timeout, indeterminate]
        malwareScannedAt: { type: ["string", "null"], format: date-time }
        malwareClean: { type: boolean }
        isLatest: { type: boolean }
        canReview: { type: boolean }
        canRequestCorrection: { type: boolean }
        canRetryScan: { type: boolean }
      required: [id, documentId, originalName, contentType, sizeBytes, fingerprint, label, category, required, reminderCount, reminderNextAt, validationState, validationReasons, malwareScanState, malwareScannedAt, malwareClean, isLatest, canReview, canRequestCorrection, canRetryScan]
    OnbBgvStatus:
      type: object
      properties:
        id: { type: integer }
        system: { type: string }
        externalRef: { type: string }
        status: { type: string, enum: [pending, incomplete, rejected, overdue, clear, manual_review, done] }
        requestedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        note: { type: ["string", "null"] }
      required: [id, system, externalRef, status, requestedAt, dueAt, completedAt, note]
    OnbEmployeeRecord:
      type: object
      description: One archived past-employment stint from the employee-records archive (rehire evidence)
      properties:
        id:
          type: integer
        workerEmail:
          type: string
        workerName:
          type: string
        role:
          type: string
        department:
          type: string
        startDate:
          type: string
          description: YYYY-MM-DD
        endDate:
          type: string
          description: YYYY-MM-DD
        exitReason:
          type: string
        noticeRequiredDays:
          type: integer
        noticeServedDays:
          type: integer
        performanceRating:
          type: string
          description: Final rating for the stint on a 1.0–5.0 scale
        rehireEligible:
          type: boolean
        notes:
          type: ["string", "null"]
      required: [id, workerEmail, workerName, role, department, startDate, endDate, exitReason, noticeRequiredDays, noticeServedDays, performanceRating, rehireEligible, notes]
    OnbEvent:
      type: object
      description: One audit-trail entry; every agent decision lands here with engine type and rule reference
      properties:
        id:
          type: integer
        caseId:
          type: ["integer", "null"]
          description: Null for system-level events not tied to a case (e.g. inbox-monitor outages)
        agent:
          type: string
          description: intake | plan | documentation | access | assets | learning | analytics | orchestrator | human | channel
        engine:
          type: string
          description: llm | rules | ldm | orchestrator | human | system
        hitlPattern:
          type: ["string", "null"]
          description: notify-only | approve-before-act | act-then-review | hard-block
        ruleRef:
          type: ["string", "null"]
          description: SME-spec rule reference, e.g. "4.1 Intake Rule 5"
        title:
          type: string
        detail:
          type: string
          description: Decision rationale
        createdAt:
          type: string
      required: [id, caseId, agent, engine, hitlPattern, ruleRef, title, detail, createdAt]
    OnbApproval:
      type: object
      properties:
        id:
          type: integer
        version:
          type: integer
          minimum: 1
        caseId:
          type: integer
        caseWorkerName:
          type: string
        agent:
          type: string
        ruleRef:
          type: ["string", "null"]
        hitlPattern:
          type: string
          description: approve-before-act | hard-block (hard-blocks require human resolution end-to-end)
        recommendation:
          type: string
        rationale:
          type: string
        recordsEvidence:
          description: Structured archive Q&A evidence with per-answer stint scope; null when the approval has no records evidence.
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/OnbRecordsEvidenceItem"
        authorityScope:
          type: ["string", "null"]
          description: Verified specialist authority scope required for a new decision; a null historical value cannot be replayed.
        authorityReviewStatus:
          type: string
          enum: [not-required, unresolved, reviewed-no-effect]
        decidedAuthorityId:
          type: ["string", "null"]
        status:
          type: string
          description: pending | approved | rejected
        decidedBy:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
        decidedAt:
          type: ["string", "null"]
      required: [id, version, caseId, caseWorkerName, agent, ruleRef, hitlPattern, recommendation, rationale, recordsEvidence, authorityScope, authorityReviewStatus, decidedAuthorityId, status, decidedBy, comment, createdAt, decidedAt]
    OnbApprovalCapability:
      type: object
      required: [canDecide, reason, version]
      properties:
        canDecide:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Machine-readable fail-closed reason when the current authenticated user cannot decide.
        version:
          type: integer
          minimum: 1
    OnbRecordsEvidenceItem:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        scope:
          type: object
          description: Which stints the answer covers. kind "all" means the whole archived history; "yearRange" may carry from/to year bounds.
          properties:
            kind:
              type: string
              enum: [all, latest, earliest, yearRange]
            from:
              type: integer
            to:
              type: integer
          required: [kind]
      required: [question, answer, scope]
    OnbApprovalDecision:
      type: object
      properties:
        decision:
          type: string
          description: approved | rejected
        comment:
          type: string
        expectedVersion:
          type: integer
          minimum: 1
      required: [decision, expectedVersion]
    OnbAuthorityGovernanceState:
      type: object
      properties:
        governance:
          type: object
          properties:
            status: { type: string, enum: [unconfigured, operator-attested, governance-approved, withdrawn] }
            attestedAt: { type: ["string", "null"] }
            attestationNote: { type: ["string", "null"] }
            approvedAt: { type: ["string", "null"] }
            governanceSource: { type: ["string", "null"] }
            revision: { type: integer }
          required: [status, revision]
        canAdminister: { type: boolean }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/OnbAuthorityAssignment" }
      required: [governance, canAdminister, assignments]
    OnbAuthorityAssignment:
      type: object
      properties:
        id: { type: string }
        personUserId: { type: string }
        personEmail: { type: ["string", "null"] }
        emailResponderAuthorized: { type: boolean }
        authorityRole: { type: string }
        scopes: { type: array, items: { type: string } }
        caseId: { type: ["integer", "null"] }
        siteScope: { type: ["string", "null"] }
        jurisdictionScope: { type: ["string", "null"] }
        validFrom: { type: string }
        validUntil: { type: ["string", "null"] }
        status: { type: string, enum: [active, revoked] }
        revision: { type: integer, minimum: 1 }
