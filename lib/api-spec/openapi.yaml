  /onboarding/audit:
    get:
      operationId: listOnboardingProtectedAudit
      tags: [onboarding, audit]
      summary: Search minimized protected audit evidence
      description: Owner/admins receive the tenant-wide view. Registered Demo Administrators may request the read-only demo scope, limited to their authorized synthetic cases and their own unscoped demo actions.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [organization, demo], default: organization } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: action, in: query, schema: { type: string, maxLength: 160 } }
        - { name: objectType, in: query, schema: { type: string, maxLength: 120 } }
        - { name: objectId, in: query, schema: { type: string, maxLength: 200 } }
        - { name: actorId, in: query, schema: { type: string, maxLength: 200 } }
        - { name: outcome, in: query, schema: { type: string, enum: [attempted, success, denied, failure] } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Redacted audit entries and current chain verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnbProtectedAuditPage" }
        "403": { description: Organization owner/admin or eligible Demo Administrator required for the requested scope }
  /onboarding/audit/export:
    get:
      operationId: exportOnboardingProtectedAudit
      tags: [onboarding, audit]
      summary: Export minimized protected audit evidence as CSV
      description: Owner/admin only. Export contains no audit payload values or raw candidate/document data.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: action, in: query, schema: { type: string, maxLength: 160 } }
        - { name: objectType, in: query, schema: { type: string, maxLength: 120 } }
        - { name: objectId, in: query, schema: { type: string, maxLength: 200 } }
        - { name: actorId, in: query, schema: { type: string, maxLength: 200 } }
        - { name: outcome, in: query, schema: { type: string, enum: [attempted, success, denied, failure] } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 1 }, description: Continue from the `next_cursor` CSV footer. }
      responses:
        "200":
          description: CSV export page (maximum 500 rows) with integrity and next_cursor footer; callers continue with cursor when export_truncated=true
          content:
            text/csv:
              schema: { type: string, format: binary }
        "403": { description: Organization owner or admin required }
  /onboarding/audit/integrity:
    get:
      operationId: getOnboardingProtectedAuditIntegrity
      tags: [onboarding, audit]
      summary: Verify the tenant audit hash chain and head
      responses:
        "200":
          description: Integrity result and explicit external anchoring limitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnbProtectedAuditIntegrity" }
        "403": { description: Organization owner or admin required }
  /onboarding/audit/approval-history/{approvalId}:
    get:
      operationId: getOnboardingProtectedAuditApprovalHistory
      tags: [onboarding, audit]
      summary: Retrieve retained approval snapshots without requiring a live approval record
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Retained immutable approval history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnbApprovalHistory" }
        "400": { description: Invalid approval identifier }
        "403": { description: Organization owner or admin required }
  /onboarding/audit/lifecycle:
    get:
      operationId: getOnboardingProtectedAuditLifecycle
      tags: [onboarding, audit]
      summary: Get reviewed audit retention and legal-hold state
      responses:
        "200":
          description: Lifecycle state. This service never supplies a purge deadline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnbProtectedAuditLifecycle" }
        "403": { description: Organization owner or admin required }
  /onboarding/audit/lifecycle/retention:
    put:
      operationId: reviewOnboardingProtectedAuditRetention
      tags: [onboarding, audit]
      summary: Record owner/admin-reviewed audit retention statement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnbProtectedAuditRetentionInput" }
      responses:
        "200":
          description: Updated lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnbProtectedAuditLifecycle" }
        "403": { description: Organization owner or admin required }
  /onboarding/audit/lifecycle/legal-hold:
    post:
      operationId: setOnboardingProtectedAuditLegalHold
      tags: [onboarding, audit]
      summary: Set or release a legal hold with a reviewed reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnbProtectedAuditLegalHoldInput" }
      responses:
        "200":
          description: Updated lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnbProtectedAuditLifecycle" }
        "403": { description: Organization owner or admin required }
  /onboarding/audit/corrections:
    post:
      operationId: createOnboardingProtectedAuditCorrection
      tags: [onboarding, audit]
      summary: Append a linked audit correction without editing existing evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnbProtectedAuditCorrectionInput" }
      responses:
        "201":
          description: Newly appended linked correction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnbProtectedAuditEntry" }
        "403": { description: Organization owner or admin required }
  /privacy/lifecycle/policies:
    get:
      operationId: listSensitiveLifecyclePolicies
      tags: [governance]
      summary: List current approved sensitive lifecycle policies
      responses:
        "200":
          description: Current class-specific policies
          content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveLifecyclePoliciesResponse" } } }
    put:
      operationId: saveSensitiveLifecyclePolicy
      tags: [governance]
      summary: Approve a new immutable sensitive lifecycle policy revision
      description: Requires current server-verified privacy or legal authority; tenant owner/admin is never sufficient. Retention shortening uses the preview/confirm endpoints.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveLifecyclePolicyInput" } } }
      responses:
        "200": { description: Approved revision, content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveLifecyclePolicyResponse" } } } }
        "403": { description: Verified privacy or legal authority required }
        "409": { description: Stale revision or shortening confirmation required }
  /privacy/lifecycle/policies/shortening-preview:
    post:
      operationId: previewSensitiveRetentionShortening
      tags: [governance]
      summary: Preview a strictly shorter retention policy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveLifecyclePolicyInput" } } }
      responses:
        "200": { description: Durable confirmation preview, content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveLifecycleShorteningPreview" } } } }
  /privacy/lifecycle/shortening-previews/{id}/confirm:
    post:
      operationId: confirmSensitiveRetentionShortening
      tags: [governance]
      summary: Explicitly authorize a previewed retention shortening
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationPhrase]
              properties:
                confirmationPhrase: { type: string, enum: ["AUTHORIZE RETENTION SHORTENING"] }
      responses:
        "200": { description: Approved revised policy, content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveLifecyclePolicyResponse" } } } }
        "409": { description: "Preview expired, used, or policy changed" }
  /privacy/lifecycle/holds:
    get:
      operationId: listSensitiveLifecycleHolds
      tags: [governance]
      summary: List tenant sensitive lifecycle holds
      responses:
        "200": { description: Holds, content: { application/json: { schema: { type: object, required: [holds], properties: { holds: { type: array, items: { type: object, additionalProperties: true } } } } } } }
    post:
      operationId: setSensitiveLifecycleHold
      tags: [governance]
      summary: Set a scoped legal or privacy hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, reference]
              properties:
                dataClass: { type: string, enum: [candidate-document, identity, medical, payroll, bgv, candidate-contact, candidate-voice, candidate-portal] }
                caseId: { type: integer, minimum: 1 }
                objectPath: { type: string }
                reason: { type: string, minLength: 1, maxLength: 2000 }
                reference: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201": { description: Active hold }
        "403": { description: Verified privacy or legal authority required }
  /privacy/lifecycle/holds/{id}/release:
    post:
      operationId: releaseSensitiveLifecycleHold
      tags: [governance]
      summary: Release a scoped hold with verified authority
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reference], properties: { reference: { type: string, minLength: 1, maxLength: 2000 } } } } }
      responses:
        "200": { description: Released hold }
        "403": { description: Verified privacy or legal authority required }
  /privacy/lifecycle/deletion-jobs:
    get:
      operationId: listSensitiveLifecycleDeletionJobs
      tags: [governance]
      summary: List sensitive lifecycle deletion jobs
      responses:
        "200": { description: Deletion jobs, content: { application/json: { schema: { type: object, required: [jobs], properties: { jobs: { type: array, items: { type: object, additionalProperties: true } } } } } } }
  /privacy/lifecycle/deletion-jobs/{id}/retry:
    post:
      operationId: retrySensitiveLifecycleDeletionJob
      tags: [governance]
      summary: Requeue one failed lifecycle deletion job
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Requeued job }
        "403": { description: Verified privacy or legal authority required }
        "409": { description: Job is not failed or is absent }
  /onboarding/uat/fairness:
    get:
      operationId: getFairnessProgramme
      tags: [onboardingUat]
      responses:
        "200":
          description: Governed synthetic fairness programme and live reviewer capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FairnessProgrammeView"
  /onboarding/uat/fairness/actions:
    post:
      operationId: applyFairnessAction
      tags: [onboardingUat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FairnessProgrammeAction"
      responses:
        "200":
          description: Updated programme; version conflicts and missing authority fail explicitly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FairnessProgrammeView"
  /onboarding/uat/fairness/evidence-report:
    get:
      operationId: downloadFairnessEvidenceReport
      tags: [onboardingUat]
      responses:
        "200":
          description: Synthetic observations, immutable provenance, coverage, limitations and unresolved differences
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated Clerk-compatible user session token.
    taIntakeHmac:
      type: apiKey
      in: header
      name: x-ta-intake-signature
      description: >
        HMAC authentication for a configured, tenant-pinned TA middleware
        source. The source and timestamp headers are also required and all
        headers are covered by the canonical request signature.
  parameters:
    OnbChecklistProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
    EaAssessmentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    FairnessProgrammeAction:
      type: object
      additionalProperties: false
      required: [kind, expectedVersion]
      properties:
        kind:
          type: string
          enum: [define-scope, review-scope, set-criteria, review-criteria, run, recover, investigate]
        expectedVersion: { type: integer }
        decisionType: { type: string, enum: [policy-extract-recommendation] }
        pairIds:
          type: array
          items: { type: string }
        role: { type: string, enum: [business, hr-compliance, legal] }
        approved: { type: boolean }
        note: { type: string }
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/FairnessCriterion"
        runId: { type: string }
        pairId: { type: string }
        disposition: { type: string, enum: [open, remediation-required, explained] }
    FairnessCriterion:
      type: object
      required: [pairId, expected, rationale]
      properties:
        pairId: { type: string }
        expected: { type: string, enum: [supported, insufficient, conflicting, injected] }
        rationale: { type: string }
    FairnessReview:
      type: object
      required: [userId, role, assignmentId, membershipRevision, at, approved, note]
      properties:
        userId: { type: string }
        role: { type: string, enum: [business, hr-compliance, legal] }
        assignmentId: { type: [integer, "null"] }
        membershipRevision: { type: integer }
        stage: { type: string, enum: [scope, criteria] }
        revision: { type: integer }
        bindingDigest: { type: string }
        at: { type: string }
        approved: { type: boolean }
        note: { type: string }
    FairnessPair:
      type: object
      required: [id, title, variation, relevantFacts, excerpt, sourceContext, variants]
      properties:
        id: { type: string }
        title: { type: string }
        variation: { type: string }
        relevantFacts: { type: string }
        excerpt: { type: string }
        sourceContext: { type: string }
        variants:
          type: array
          items:
            type: object
            required: [label, characteristic, question]
            properties:
              label: { type: string }
              characteristic: { type: string }
              question: { type: string }
    FairnessSelection:
      type: object
      required: [outcome, excerptId, quotedText]
      properties:
        outcome: { type: string, enum: [supported, insufficient, conflicting, injected] }
        excerptId: { type: [string, "null"] }
        quotedText: { type: [string, "null"] }
    FairnessObservation:
      type: object
      required: [pairId, expected, rationale, outputs, errors, status, differences, policyDigest, inputDigests, investigation]
      properties:
        pairId: { type: string }
        expected: { type: string, enum: [supported, insufficient, conflicting, injected] }
        rationale: { type: string }
        outputs:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/FairnessSelection"
              - type: "null"
        errors:
          type: array
          items: { type: [string, "null"] }
        status: { type: string, enum: [blocked, investigate, observed-match] }
        differences:
          type: array
          items: { type: string }
        policyDigest: { type: string }
        policyVersion: { type: string }
        modelReceipts:
          type: array
          items:
            anyOf:
              - type: "null"
              - type: object
                required: [requestedModel, resolvedModel, providerResponseId, systemFingerprint]
                properties:
                  requestedModel: { type: string }
                  resolvedModel: { type: string }
                  providerResponseId: { type: string }
                  systemFingerprint: { type: [string, "null"] }
        inputDigests:
          type: array
          items: { type: string }
        investigation:
          anyOf:
            - type: "null"
            - type: object
              required: [disposition, note, reviewedBy, at]
              properties:
                disposition: { type: string, enum: [open, remediation-required, explained] }
                note: { type: string }
                reviewedBy: { type: string }
                at: { type: string }
    FairnessRun:
      type: object
      required: [id, status, at, finishedAt, actor, programmeVersion, scopeRevision, criteriaRevision, provenance, catalogVersion, model, promptVersion, promptDigest, outputContractVersion, approvals, criteria, observations, limitation]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, completed, blocked] }
        at: { type: string }
        finishedAt: { type: [string, "null"] }
        actor: { type: string }
        programmeVersion: { type: integer }
        scopeRevision: { type: integer }
        criteriaRevision: { type: integer }
        provenance: { type: string, enum: [synthetic-model-observation] }
        catalogVersion: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        promptDigest: { type: string }
        outputContractVersion: { type: string }
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/FairnessReview"
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/FairnessCriterion"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/FairnessObservation"
        limitation: { type: [string, "null"] }
        fixtures:
          type: array
          items:
            $ref: "#/components/schemas/FairnessPair"
    FairnessProgramme:
      type: object
      required: [version, scopeRevision, criteriaRevision, scope, scopeReviews, criteria, criteriaReviews, runs, evidence]
      properties:
        version: { type: integer }
        scopeRevision: { type: integer }
        criteriaRevision: { type: integer }
        criteriaIdentityDigest: { type: [string, "null"] }
        scope:
          anyOf:
            - type: "null"
            - type: object
              required: [decisionType, pairIds, note, definedBy]
              properties:
                decisionType: { type: string }
                pairIds:
                  type: array
                  items: { type: string }
                note: { type: string }
                definedBy: { type: string }
                catalogVersion: { type: string }
                catalogDigest: { type: string }
        scopeReviews:
          type: array
          items:
            $ref: "#/components/schemas/FairnessReview"
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/FairnessCriterion"
        criteriaReviews:
          type: array
          items:
            $ref: "#/components/schemas/FairnessReview"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/FairnessRun"
        evidence:
          type: array
          items:
            type: object
            required: [at, actor, kind, version, provenance, note]
            properties:
              at: { type: string }
              actor: { type: string }
              kind: { type: string }
              version: { type: integer }
              provenance: { type: string, enum: [manual-evidence, synthetic-model-observation] }
              note: { type: string }
              details:
                type: object
                additionalProperties: true
    FairnessProgrammeView:
      type: object
      required: [programme, catalog, capabilities]
      properties:
        programme:
          $ref: "#/components/schemas/FairnessProgramme"
        catalog:
          type: object
          required: [version, scope, pairs, limitations]
          properties:
            version: { type: string }
            identity:
              type: object
              required: [model, promptVersion, promptDigest, outputContractVersion]
              properties:
                model: { type: string }
                promptVersion: { type: string }
                promptDigest: { type: string }
                outputContractVersion: { type: string }
            scope:
              type: object
              required: [id, title, decisions, description, relevantFacts]
              properties:
                id: { type: string }
                title: { type: string }
                decisions:
                  type: array
                  items: { type: string }
                description: { type: string }
                relevantFacts:
                  type: array
                  items: { type: string }
            pairs:
              type: array
              items:
                $ref: "#/components/schemas/FairnessPair"
            limitations:
              type: array
              items: { type: string }
        capabilities:
          type: object
          required: [canDefine, reviewerRoles, scopeApproved, criteriaApproved]
          properties:
            canDefine: { type: boolean }
            reviewerRoles:
              type: array
              items: { type: string, enum: [business, hr-compliance, legal] }
            scopeApproved: { type: boolean }
            criteriaApproved: { type: boolean }
    HrPolicyEvaluationReviewInput:
      type: object
      additionalProperties: false
      required: [benchmarkHash, decision, reference, confirmation, expectedReviewId]
      properties:
        benchmarkHash: { type: string }
        decision: { type: string, enum: [approved, rejected] }
        # Enforced as <=500 by the service: Orval can reorder reused max constants after eager schemas.
        reference: { type: string, minLength: 1 }
        confirmation: { type: string }
        expectedReviewId: { type: string, nullable: true }
    HrPolicyEvaluationRunInput:
      type: object
      additionalProperties: false
      required: [benchmarkHash, mode, requestId]
      properties:
        benchmarkHash: { type: string }
        mode: { type: string, enum: [offline, live] }
        requestId: { type: string, pattern: '^[a-zA-Z0-9-]{8,80}$' }
        confirmation: { type: string }
    HrPolicyEvaluationReview:
      type: object
      required: [reviewId, benchmarkHash, decision, reviewer, reviewedAt, authorityId, reference]
      properties:
        reviewId: { type: string }
        benchmarkHash: { type: string }
        decision: { type: string, enum: [approved, rejected] }
        reviewer: { type: string }
        reviewedAt: { type: string }
        authorityId: { type: integer }
        reference: { type: string }
    HrPolicyBenchmarkCase:
      type: object
      required: [id, category, question, source, role, applicability, appliesOn, expected]
      properties:
        id: { type: string }
        category: { type: string }
        question: { type: string }
        pairing:
          type: object
          required: [groupId, language, variant]
          properties:
            groupId: { type: string }
            language: { type: string }
            variant: { type: string, enum: [canonical, paraphrase, translation] }
        source:
          type: object
          required: [id, version, status, text, audience, applicability, effectiveFrom, effectiveUntil, reviewBy]
          properties:
            id: { type: string }
            version: { type: integer }
            status: { type: string }
            text: { type: string }
            audience: { type: array, items: { type: string } }
            applicability: { type: object, additionalProperties: { type: string } }
            effectiveFrom: { type: string }
            effectiveUntil: { type: string, nullable: true }
            reviewBy: { type: string, nullable: true }
        role: { type: string }
        applicability: { type: object, additionalProperties: { type: string } }
        appliesOn: { type: string }
        expected:
          type: object
          required: [outcome, abstain, modelCalled, excerptId, quotedText, rationale]
          properties:
            outcome: { type: string, enum: [supported, insufficient, conflicting, injected] }
            abstain: { type: boolean }
            modelCalled: { type: boolean }
            excerptId: { type: string, nullable: true, enum: [extract-1] }
            quotedText: { type: string, nullable: true }
            rationale: { type: string }
    HrPolicyEvaluationRun:
      type: object
      additionalProperties: true
      required: [runId, mode, status, benchmarkHash]
      properties:
        runId: { type: string }
        mode: { type: string, enum: [offline, live] }
        status: { type: string }
        benchmarkHash: { type: string }
        evidenceKind: { type: string }
        requestHash: { type: string }
        contractHash: { type: string }
        passed: { type: integer }
        total: { type: integer }
        failed: { type: integer }
        outcomeAgreement: { type: number, nullable: true }
        unsafeSupportCount: { type: integer }
        pairedFailed: { type: integer }
        pairedConsistency: { type: number, nullable: true }
        pairedSupportAgreement: { type: number, nullable: true }
        pairedAbstentionAgreement: { type: number, nullable: true }
        limits: { $ref: "#/components/schemas/HrPolicyEvaluationLimits" }
        pairs:
          type: array
          items: { $ref: "#/components/schemas/HrPolicyBenchmarkPairResult" }
        results:
          type: array
          items:
            type: object
            required: [caseId, expected, actual, passed, abstained]
            properties:
              caseId: { type: string }
              expected: { type: string }
              actual: { type: string }
              passed: { type: boolean }
              abstained: { type: boolean }
    HrPolicyBenchmarkPairResult:
      type: object
      required: [groupId, anchorCaseId, variantCaseId, language, variant, expected, modelRequired, consistent, passed]
      properties:
        groupId: { type: string }
        anchorCaseId: { type: string }
        variantCaseId: { type: string }
        language: { type: string }
        variant: { type: string }
        expected: { type: string }
        modelRequired: { type: boolean }
        consistent: { type: boolean }
        passed: { type: boolean }
    HrPolicyEvaluationCatalog:
      type: object
      additionalProperties: true
      required: [benchmarkVersion, benchmarkHash, model, promptVersion, requestHash, contractHash, currentLiveEvidence, cases, canReview, approved, review, runs, limitation, reviewConfirmation, liveConfirmation, limits]
      properties:
        benchmarkVersion: { type: string }
        benchmarkHash: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        requestHash: { type: string }
        contractHash: { type: string }
        currentLiveEvidence: { type: boolean }
        cases: { type: array, items: { $ref: "#/components/schemas/HrPolicyBenchmarkCase" } }
        canReview: { type: boolean }
        approved: { type: boolean }
        review: { allOf: [{ $ref: "#/components/schemas/HrPolicyEvaluationReview" }], nullable: true }
        runs: { type: array, items: { $ref: "#/components/schemas/HrPolicyEvaluationRun" } }
        limitation: { type: string }
        reviewConfirmation: { type: string }
        liveConfirmation: { type: string }
        limits: { $ref: "#/components/schemas/HrPolicyEvaluationLimits" }
    HrPolicyEvaluationLimits:
      type: object
      required: [calls, completionTokensPerCall, totalCompletionTokens, inputCharactersPerCall, milliseconds]
      properties:
        calls: { type: integer }
        completionTokensPerCall: { type: integer }
        totalCompletionTokens: { type: integer }
        inputCharactersPerCall: { type: integer }
        milliseconds: { type: integer }
        liveRunsPerTenantPerDay: { type: integer }
    VaultEvidenceBinding:
      type: object
      additionalProperties: false
      required: [id, revision, sha256]
      properties:
        id: { type: string }
        revision: { type: integer }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    VaultSourceResult:
      type: object
      additionalProperties: false
      required: [submissionId, profileId, issuerId, kind, jurisdiction, bindings, outcome, sourceReference, verifiedAt, expiresAt]
      properties:
        submissionId: { type: string }
        profileId: { type: string }
        issuerId: { type: string }
        kind: { type: string }
        jurisdiction: { type: string }
        bindings: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/VaultEvidenceBinding" } }
        outcome: { type: string, enum: [clear, adverse, inconclusive] }
        sourceReference: { type: string, minLength: 1, maxLength: 400 }
        verifiedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    VaultSourceEnvelope:
      type: object
      additionalProperties: false
      required: [result, signature]
      properties:
        result: { $ref: "#/components/schemas/VaultSourceResult" }
        signature: { type: string, minLength: 88, maxLength: 88 }
    VaultConsumptionInput:
      type: object
      additionalProperties: false
      required: [requestId, vaultId, acknowledgeEmployeeBinding]
      properties:
        requestId: { type: string }
        vaultId: { type: string }
        acknowledgeEmployeeBinding: { type: boolean }
    VaultDocumentInput:
