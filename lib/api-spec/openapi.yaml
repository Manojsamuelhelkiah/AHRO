          $ref: "#/components/schemas/OnbChannelInfo"
        blockedPublishBackup:
          $ref: "#/components/schemas/OnbBlockedPublishBackupReadiness"
        inboundEmail:
          $ref: "#/components/schemas/OnbInboundEmailMonitor"
      required: [email, whatsapp, blockedPublishBackup, inboundEmail]
    OnbBlockedPublishBackupReadiness:
      type: object
      description: Side-effect-free readiness of the WhatsApp fallback for blocked-release alerts
      properties:
        ready:
          type: boolean
        destination:
          type: ["string", "null"]
          description: Masked backup WhatsApp destination
        sender:
          type: ["string", "null"]
          description: Masked Twilio WhatsApp sender
        missing:
          type: array
          items:
            type: string
          description: Non-secret setting categories that still need configuration
        invalid:
          type: array
          items:
            type: string
          description: Non-secret phone setting categories whose values are not valid E.164 numbers
        note:
          type: string
      required: [ready, destination, sender, missing, invalid, note]
    OnbInboundEmailMonitor:
      type: object
      description: Health of the background Gmail inbox poller that ingests real email replies
      properties:
        running:
          type: boolean
          description: Whether the poll loop has been started in this server process
        healthy:
          type: boolean
          description: True only when state is "healthy" — a poll succeeded recently and nothing failed since
        state:
          type: string
          description: healthy | initializing | broken | stopped
        pollIntervalSeconds:
          type: integer
        lastPollAt:
          type: ["string", "null"]
          description: When the most recent poll attempt started (ISO)
        lastSuccessAt:
          type: ["string", "null"]
          description: When the most recent poll completed successfully (ISO)
        lastError:
          type: ["string", "null"]
          description: Error message from the most recent failed poll, cleared on success
        lastErrorAt:
          type: ["string", "null"]
      required: [running, healthy, state, pollIntervalSeconds, lastPollAt, lastSuccessAt, lastError, lastErrorAt]
    OnbSystemConnectorHealth:
      type: object
      description: Health of one watched external-system integration (push webhook or scheduled polling)
      properties:
        key:
          type: string
