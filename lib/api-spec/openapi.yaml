          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        correlationId:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        caseId: { type: integer, minimum: 1, maximum: 9007199254740991 }
        purpose: { type: string, minLength: 1, maxLength: 300 }
        toolKey: { type: string, minLength: 1 }
        organizationId:
          type: string
          description: Optional claimed organization ID. If present and not the trusted selected tenant, the invocation is denied and audited.
      required: [agentId, runId, correlationId, caseId, purpose, toolKey]
    AgentInvocationToolResult:
      type: object
      properties:
        caseId: { type: integer }
        lifecycleStage: { type: string }
