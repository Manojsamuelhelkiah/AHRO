              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Case not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "409":
          description: Stale generation/version or a send is already awaiting reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
