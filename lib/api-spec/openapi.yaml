    AgentInvocationResponse:
      type: object
      properties:
        auditId: { type: integer }
        result: { $ref: "#/components/schemas/AgentInvocationToolResult" }
      required: [auditId, result]
    AgentInvocationAuthenticationError:
      type: object
      properties:
        code: { type: string, const: AUTHENTICATION_REQUIRED }
        message: { type: string }
      required: [code, message]
    AgentInvocationError:
      type: object
      properties:
        code: { type: string, const: AGENT_INVOCATION_INVALID }
        message: { type: string }
      required: [code, message]
    AgentInvocationDenialCode:
      type: string
      enum:
        - AGENT_INVOCATION_TENANT_MISMATCH
        - AGENT_INVOCATION_AGENT_NOT_ACTIVE
        - AGENT_INVOCATION_AGENT_OWNER_MISMATCH
        - AGENT_INVOCATION_CASE_OUT_OF_SCOPE
        - AGENT_INVOCATION_UNKNOWN_TOOL
        - AGENT_INVOCATION_TOOL_NOT_IMPLEMENTED
        - AGENT_INVOCATION_TOOL_ACCESS_DENIED
        - AGENT_INVOCATION_RUN_REPLAY
    AgentInvocationDenied:
      type: object
      properties:
        code: { $ref: "#/components/schemas/AgentInvocationDenialCode" }
        message: { type: string }
        auditId: { type: integer }
      required: [code, message, auditId]
    AgentInvocationFailure:
      type: object
      properties:
        code: { type: string, const: AGENT_INVOCATION_FAILED }
