      description: >
        Authenticated tenant route requiring an organization owner or
        administrator. A date change opens fresh HRIS, provisioning, payroll,
        benefits, and schedules reconciliation; it reuses no prior timing
        conclusion, grants no authority, and dispatches no provider action.
        A stale `expectedVersion` returns HTTP `409` and no state is changed.
