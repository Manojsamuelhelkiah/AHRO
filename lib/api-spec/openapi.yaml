        createdAt:
          type: string
          description: ISO 8601 creation timestamp.
      required: [id, effectiveDate, rationale, rates, createdBy, createdAt]
    PricingRateRegister:
      type: object
      description: The full pricing rate register — current snapshot and complete version history.
      properties:
        current:
          $ref: "#/components/schemas/PricingRateSetVersion"
          description: The current effective rate set (null when none exists yet).
          nullable: true
        versions:
          type: array
          description: All versions, newest first.
          items:
            $ref: "#/components/schemas/PricingRateSetVersion"
        canManage:
          type: boolean
          description: Whether the signed-in user may publish immutable global rate versions.
      required: [current, versions, canManage]
    PricingRateSetInput:
      type: object
      description: Body for creating a new pricing rate set version.
      properties:
        effectiveDate:
          type: string
          description: YYYY-MM-DD calendar date this version takes effect. May be in the future (scheduled).
        rationale:
          type: string
          description: Non-blank rationale explaining why this version was created.
        rates:
          type: object
          additionalProperties: true
          description: Complete pricing rate snapshot. All quote-critical keys are required; missing or unsafe values block save.
      required: [effectiveDate, rationale, rates]
    DemoScenarioChoice:
