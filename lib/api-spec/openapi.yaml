  /onboarding/cases/{caseId}/operational-requests:
    get:
      operationId: getOnboardingOperationalRequests
      tags: [onboarding]
      summary: Read simulated operational setup requests for a case
      description: >
        Read-only case-scoped view of simulated requests for documentation,
        access, assets, payroll, and learning workstreams. This endpoint never
        initializes missing requests and never contacts a provider.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Operational request state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbOperationalRequestsEnvelope"
        "404":
          description: Case not found in the requesting organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: initializeOnboardingOperationalRequests
      tags: [onboarding]
      summary: Initialize missing simulated operational setup requests
      description: >
        Creates only missing request records and their unmistakable simulated
        Communication timeline entries. The default method is agent. No email,
        AI agent, provider, external system, readiness, document, BGV, or
        approval effect occurs. Owner/admin users may mutate ordinary tenants;
        members may use this simulation-only mutation in Demo Organization.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbOperationalRequestsInitialize"
      responses:
        "200":
          description: Current request state after idempotent initialization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbOperationalRequestsMutationResult"
        "400":
          description: Invalid initialization request
        "403":
          description: Owner/admin required, except Demo Organization simulation members
        "404":
          description: Case not found
        "409":
          description: Stale version, offline sample, or conflicting idempotency request
  /onboarding/cases/{caseId}/operational-requests/{requestId}/actions:
    post:
      operationId: applyOnboardingOperationalRequestAction
      tags: [onboarding]
      summary: Apply a simulated operational request lifecycle action
      description: >
        Selects email or agent, starts/progresses/completes/blocks, or retries
        one request. The path requestId is the stable operational request id;
        body requestId is the client idempotency id and must be reused for a
        retry of the same HTTP request. Every effect is logged-only and marked
        simulated in Communications. No provider call or live readiness change
        is made.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnbOperationalRequestAction"
      responses:
        "200":
          description: Current request state after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnbOperationalRequestsMutationResult"
        "400":
          description: Invalid action
        "403":
          description: Owner/admin required, except Demo Organization simulation members
        "404":
          description: Case or operational request not found
        "409":
          description: Stale version, invalid state transition, offline sample, or duplicate idempotency id
