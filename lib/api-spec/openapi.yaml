          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OnbChecklistTemplateItem"
        day1LogisticsDefault:
          $ref: "#/components/schemas/OnbDay1Logistics"
        candidateLinkRetentionDays:
          type: integer
          enum: [30, 90, 180, 365]
          description: Number of days expired or revoked candidate-link metadata is retained
        candidateAccessCleanup:
          $ref: "#/components/schemas/CandidateAccessCleanupHealth"
