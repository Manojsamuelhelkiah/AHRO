        email: { type: ["string", "null"] }
        configured: { type: boolean }
        purpose: { type: string }
        actualDeliveryState: { $ref: "#/components/schemas/BgvNotificationDeliveryState" }
        communicationIds:
          type: array
          items: { type: integer }
        liveSendAuthorized: { type: boolean }
        reason: { type: string }
      required: [role, displayName, email, configured, purpose, actualDeliveryState, communicationIds, liveSendAuthorized, reason]
    BgvNotificationCycle:
      type: object
      properties:
        cycleId: { type: string }
        episode: { type: string, enum: [blocked, release] }
        source:
          type: string
          enum: [webhook, scheduled-poll, status-email, overdue, reopened, hr-reconcile, unknown]
        sourceProvenance:
