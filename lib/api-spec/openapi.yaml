    OnbSettings:
      type: object
      properties:
        hrAlertEmail:
          type: string
          nullable: true
          description: Address stored via the settings screen, or null when not set
        envFallback:
          type: string
          nullable: true
          description: Address from HR_ALERT_EMAIL / ONBOARDING_HR_ALERT_EMAIL, or null
        effective:
          type: string
          nullable: true
          description: Address outage alerts will actually be sent to, or null when none
        source:
          type: string
          nullable: true
          description: Where the effective address comes from ("settings" | "environment"), null when none
        autoEscalationCalls:
          type: boolean
          description: When true, the System Watcher automatically places the SLA escalation voice call for hires who have gone quiet
        hrApproverEmail:
          type: string
          nullable: true
          description: Optional remote HR approver address; when set, new pending approvals are emailed there and a reply containing approve/reject from that exact sender decides them
