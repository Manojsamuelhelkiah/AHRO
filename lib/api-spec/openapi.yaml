            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/standard-providers/status:
    get:
      operationId: getOnboardingStandardProviderStatus
      tags: [onboarding]
      summary: Get administrator source-contract configuration, manual ownership, and truthfulness gates
      description: Requires organization owner/admin. Source evidence and identifiers are redacted unless the viewer also has current all-class sensitive authority for the linked case. Observations are explicitly unverified and cannot satisfy readiness or release gates.
      responses:
        "200":
          description: Provider contract status and unresolved decision register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardProviderStatusResponse"
  /onboarding/standard-providers/{providerKey}/configuration:
    put:
      operationId: updateOnboardingStandardProviderConfiguration
      tags: [onboarding]
      summary: Save Oracle HCM or ServiceNow mapping metadata only
      description: Requires organization owner/admin. Credentials are never accepted and remote dispatch remains disabled.
      parameters:
        - name: providerKey
          in: path
          required: true
          schema: { type: string, enum: [oracle-hcm, servicenow, bgv, payroll, benefits] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardProviderConfigurationInput" }
      responses:
        "200": { description: Mapping saved; remote dispatch remains disabled }
        "400": { description: Invalid mapping or missing sandbox/operator evidence }
        "403": { description: Organization owner or admin required }
        "409": { description: Provider intentionally unselected or stale configuration version }
  /onboarding/standard-providers/{providerKey}/source-confirmations/refresh:
    post:
      operationId: refreshOnboardingStandardProviderSourceConfirmation
      tags: [onboarding]
      summary: Refresh an authenticated Oracle or ServiceNow source confirmation
      description: Requires organization owner/admin plus current all-class sensitive authority. The server reads tenant-pinned provider credentials only after sandbox/operator and governance/lifecycle fences; callers cannot provide source state, evidence, or a field snapshot.
      parameters:
        - name: providerKey
          in: path
          required: true
          schema: { type: string, enum: [oracle-hcm, servicenow] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardProviderSourceConfirmationRefreshInput" }
      responses:
        "201": { description: Authenticated normalized non-live source confirmation recorded }
        "400": { description: Missing provider source identity }
        "403": { description: Organization owner or admin required }
        "409": { description: Mapping is not configured }
  /onboarding/ta-intake/events:
    post:
      operationId: commitOnboardingTrustedTaIntakeEvents
      tags: [onboarding]
      summary: Commit accepted-offer or scheduled-preboarding events from an authenticated TA source
      description: >
        Authenticated service-to-service intake using the tenant-pinned TA source
        HMAC contract. The source identity and organization are established by
        the verified headers, never by the request body. Rows are committed
        independently: successful rows remain durable when another row is
        invalid, blocked, duplicated, or conflicting. This endpoint creates
        held cases only; it does not grant authority, start downstream
        orchestration, send messages, or dispatch a provider.
      security:
        - taIntakeHmac: []
      parameters:
        - name: x-ta-intake-source
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
          description: Configured, tenant-pinned TA middleware source identifier.
        - name: x-ta-intake-timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
          description: Unix epoch timestamp in milliseconds covered by the HMAC.
        - name: x-ta-intake-signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
          description: Lowercase SHA-256 HMAC over the canonical request contract.
        - name: x-organization-id
          in: header
          required: false
          schema: { type: string, minLength: 1 }
          description: Optional organization selector; when supplied it must match the source's tenant binding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardIntakeBatchInput" }
      responses:
        "200":
          description: Every row was an exact replay reconciliation; no new case was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "201":
          description: At least one row created a held case and every other row reconciled successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "207":
          description: Multi-Status; successful rows were committed and unresolved rows can be corrected and replayed independently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "400":
          description: Missing or malformed intake event batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: TA source authentication headers are missing or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: The authenticated TA source is not authorized for the requested organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/standard-intake/preview:
    post:
      operationId: previewOnboardingStandardIntake
      tags: [onboarding]
      summary: Validate and preview standard intake rows without creating cases
      description: >
        Authenticated tenant route for an organization owner or administrator.
        The server validates the bounded event/person/workforce-context
        structure, detects active-case duplicates, and resolves the effective
        checklist policy without mutating a case. It grants no authority and
        performs no provider, message, or downstream workflow dispatch.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardIntakeBatchInput" }
      responses:
        "200":
          description: Per-row validation and reconciliation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakePreviewResponse" }
        "400":
          description: The body must contain 1–500 intake events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Organization owner or administrator required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/standard-intake/events:
    post:
      operationId: commitOnboardingStandardIntakeEvents
      tags: [onboarding]
      summary: Commit standard intake events with row-isolated recovery
      description: >
        Authenticated tenant route for an organization owner or administrator.
        Each row is validated and committed independently. A `207 Multi-Status`
        response means successful rows remain durable while invalid, blocked,
        duplicate, or conflicting rows are returned for correction and replay.
        Exact retries reconcile to the original case; changed facts for an
        existing source event are reported as a row conflict. Intake creates a
        held case only: it grants no authority, does not complete Gate A, and
        does not start orchestration, send messages, or dispatch a provider.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardIntakeBatchInput" }
      responses:
        "200":
          description: Every row reconciled to an existing event; no new case was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "201":
          description: At least one held case was created and all remaining rows reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "207":
          description: Multi-Status; successful rows were committed and unresolved rows are independently recoverable by replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "400":
          description: The body must contain 1–500 intake events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Organization owner or administrator required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/standard-intake/replay:
    post:
      operationId: replayOnboardingStandardIntakeEvents
      tags: [onboarding]
      summary: Replay unresolved standard intake rows
      description: >
        Authenticated tenant route for an organization owner or administrator.
        It uses the same bounded batch contract as commit and preserves exact
        event identity for recovery. A `207 Multi-Status` response preserves
        successful rows and reports row-level failures for another replay; it
        never grants authority or dispatches downstream onboarding work.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardIntakeBatchInput" }
      responses:
        "200":
          description: Every row reconciled to an existing event; no new case was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "201":
          description: At least one held case was created and all remaining rows reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "207":
          description: Multi-Status; successful rows were committed and unresolved rows remain independently replayable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeCommitResponse" }
        "400":
          description: The body must contain 1–500 intake events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Organization owner or administrator required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/cases/{caseId}/standard-intake-evidence:
    get:
      operationId: getOnboardingStandardIntakeEvidence
      tags: [onboarding]
      summary: Read restricted standard intake source evidence metadata
      description: >
        Authenticated tenant route requiring an organization owner or
        administrator and a current case-scoped `hr-compliance-approve`
        authority assignment. It exposes only the opaque source evidence
        reference and activation metadata; it does not expose the offer
        artifact, grant authority, or complete Gate A.
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Restricted source evidence and activation metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeEvidence" }
        "400":
          description: Valid positive case id required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Owner/admin membership and current case-scoped HR/compliance authority required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "404":
          description: No standard intake source event is associated with the case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/cases/{caseId}/standard-intake/release:
    post:
      operationId: releaseOnboardingStandardIntakeCase
      tags: [onboarding]
      summary: Release a reviewed standard intake case to the existing onboarding engine
      description: >
        Authenticated tenant route requiring an organization owner or
        administrator and a current case-scoped `hr-compliance-approve`
        authority assignment. Release only changes the held case into the
        existing engine entry state; the normal Gate A approval remains
        required. This route grants no authority, does not complete Gate A,
        and does not authorize provider dispatch.
      security:
        - bearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Case released to the existing engine; Gate A remains required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardIntakeReleaseResponse" }
        "400":
          description: Valid positive case id required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Owner/admin membership and current case-scoped HR/compliance authority required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "404":
          description: Standard intake case not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "409":
          description: Policy rebase, scheduling, lifecycle, or prior-release conflict; no activation was applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/cases/{id}/standard-operations:
    get:
      operationId: getOnboardingStandardOperations
      tags: [onboarding]
      summary: Read standard onboarding operations safeguards and release blockers
      description: >
        Authenticated tenant-member route. The view is a status projection for
        preparation, start-date reconciliation, exception holds, and manual
        fulfillment; it grants no authority and performs no provider dispatch,
        enrollment, access release, asset release, payroll action, benefits
        action, or schedule action.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Standard operations status projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOperationsView" }
        "400":
          description: Valid positive case id required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Active organization membership required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "404":
          description: Case not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/cases/{id}/standard-operations/exceptions:
    post:
      operationId: setOnboardingStandardOperationException
      tags: [onboarding]
      summary: Place a standard operations exception hold
      description: >
        Authenticated tenant route requiring an organization owner or
        administrator. Records a status-only HR Operations hold and grants no
        authority or release permission. `expectedVersion` is optimistic
        concurrency control; a stale value returns HTTP `409` and no state is
        changed.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardOperationsExceptionInput" }
      responses:
        "200":
          description: Updated standard operations projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOperationsView" }
        "400":
          description: Invalid exception type, expected version, or rationale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "403":
          description: Organization owner or administrator required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "404":
          description: Case not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "409":
          description: Standard operations version conflict; refresh and retry with the current version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
  /onboarding/cases/{id}/standard-operations/exceptions/{type}/resolve:
    post:
      operationId: resolveOnboardingStandardOperationException
      tags: [onboarding]
      summary: Resolve a standard operations exception hold
      description: >
        Authenticated tenant route requiring an organization owner or
        administrator. Records a status-only resolution and grants no
        authority or release permission. A stale `expectedVersion` returns
        HTTP `409` without applying the resolution.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [no-response, payroll-cutoff, delayed-bgv] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardOperationsResolutionInput" }
      responses:
        "200":
          description: Updated standard operations projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOperationsView" }
        "400":
          description: Invalid exception type, expected version, or rationale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardOnboardingError" }
        "401":
