<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Run before CSS or React; only this artifact reads this preference.
      (() => {
        const base = '%BASE_URL%'.replace(/\/$/, '');
        if (location.pathname === `${base}/candidate`) return;
        let theme = 'classic';
        try {
          const saved = localStorage.getItem('onboarding-agent:appearance');
          if (['classic', 'vibrant', 'midnight'].includes(saved)) theme = saved;
        } catch { /* Storage can be blocked; Classic is always available. */ }
        document.documentElement.dataset.controlTowerTheme = theme;
        document.documentElement.style.colorScheme = theme === 'midnight' ? 'dark' : 'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Agentic HRO Suite</title>
    <meta name="description" content="Agentic HRO Suite — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Agentic HRO Suite" />
    <meta property="og:description" content="Agentic HRO Suite — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agentic HRO Suite" />
    <meta name="twitter:description" content="Agentic HRO Suite — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
